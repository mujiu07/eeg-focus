<!DOCTYPE html>
<html lang="zh-CN" data-sky="day">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>专注小蛙 - 游戏</title>
  <link rel="stylesheet" href="assets/style.css">
  <link rel="stylesheet" href="assets/vinyl.css">
  <style>
    .canvas-wrap { position: relative; width: 100%; max-width: 900px; }
    #game-canvas {
      display: block; width: 100%; height: auto;
      /* 首帧绘制前先铺一层与当前天空模式一致的底色，避免白天/黑夜闪一下 */
      background: linear-gradient(180deg, var(--sky-top) 0%, var(--sky-mid) 34%, var(--sky-low) 62%, var(--water-top) 100%);
      box-shadow: var(--shadow-soft);
      border: 3px solid rgba(255,255,255,.75);
    }
    .hud { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
    .hud-item {
      display: inline-flex; align-items: center; gap: 10px;
      padding: 11px 22px; border-radius: 999px;
      font-weight: 800; font-size: 19px;
    }
    html[data-sky] .hud-item {
      color: #f7f6ed;
      background: #23373a;
      border: 1px solid #54716b;
      box-shadow: none;
    }
    .hud-item .icon { font-size: 22px; }
    /* 心率：图标按实际 BPM 节律跳动，低采样率数据过期时自动停下 */
    #hr-hud .icon { display: inline-block; transform-origin: 50% 60%; }
    #hr-hud.beat .icon { animation: hrBeat 1s ease-in-out infinite; }
    #hr-hud.stale { color: #bdcfcb; }
    @keyframes hrBeat {
      0%, 100% { transform: scale(1); }
      16% { transform: scale(1.22); }
      34% { transform: scale(1); }
    }
    .game-meters {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 8px 20px;
      width: min(100%, 900px);
      padding: 12px 16px;
      border-radius: 14px;
      color: #f7f6ed;
      background: #23373a;
      font-size: 15px;
      font-variant-numeric: tabular-nums;
    }
    .energy-track {
      position: relative;
      grid-column: 1 / -1;
      height: 10px;
      border-radius: 8px;
      background: #4e6666;
    }
    #energy-fill, #energy-zone {
      position: absolute;
      height: 100%;
      border-radius: inherit;
    }
    #energy-fill {
      width: 100%;
      background: #83c5aa;
      transform: scaleX(0);
      transform-origin: left center;
    }
    #energy-zone { border: 2px solid #ffda86; background: rgba(255, 218, 134, .18); }
    .game-guidance {
      width: 100%;
      max-width: 900px;
      text-align: center;
      color: var(--ink);
      font-size: 14px;
      line-height: 1.5;
      padding: 10px 14px;
      border-radius: 14px;
      background: var(--card);
    }
    .game-guidance p { margin: 0; }
    .warn-banner {
      min-height: 1.5em;
      font-weight: 700;
      visibility: hidden;
    }
    .warn-banner.show { visibility: visible; }

    /* 首次上手教学 */
    .tutorial {
      position: absolute; inset: 0; z-index: 30;
      display: flex; align-items: center; justify-content: center;
      background: rgba(10, 40, 48, .34);
      -webkit-backdrop-filter: blur(3px); backdrop-filter: blur(3px);
      border-radius: 20px;
    }
    .tutorial.hidden { display: none; }
    .tutorial-card {
      background: #fff9ee; color: #263b33; border-radius: 20px; padding: 20px 24px;
      width: calc(100% - 40px); max-width: 400px;
      box-shadow: 0 20px 50px rgba(20, 60, 70, .26);
      text-align: left;
    }
    .tutorial-card h3 { margin: 0 0 10px; font-size: 17px; color: #263b33; }
    .tutorial-card ol { margin: 0 0 16px; padding-left: 20px; }
    .tutorial-card li {
      margin: 7px 0; font-size: 14.5px; line-height: 1.55; color: #38524a;
    }
    .tut-gold { color: #795219; }

    /* ---- 开局倒数 / 结算转场 ----
       同一套梦境池塘语言：青蛙蹲在荷叶上、涟漪一圈圈散开、
       暖白卡片配青绿渐变数字；遮罩只做低刺激的水雾，不用纯黑。 */
    .cue {
      position: absolute; inset: 0; z-index: 40;
      display: grid; place-items: center;
      border-radius: 20px;
      opacity: 0; visibility: hidden; pointer-events: none;
      background:
        radial-gradient(120% 88% at 50% -6%, rgba(255, 255, 255, .5), transparent 64%),
        rgba(18, 54, 62, .34);
      -webkit-backdrop-filter: blur(5px) saturate(1.06);
      backdrop-filter: blur(5px) saturate(1.06);
      transition: opacity .42s ease, visibility .42s;
    }
    .cue.show { opacity: 1; visibility: visible; pointer-events: auto; }
    .cue.leaving { opacity: 0; transition-duration: .45s; }

    .cue-card {
      position: relative;
      width: min(76%, 372px);
      padding: 22px 26px 20px;
      border-radius: 26px;
      text-align: center;
      background: linear-gradient(180deg, rgba(255, 252, 245, .98), rgba(255, 249, 238, .95));
      border: 1px solid rgba(255, 255, 255, .92);
      box-shadow: 0 26px 64px rgba(17, 60, 70, .3), inset 0 1px 0 rgba(255, 255, 255, .9);
      transform: translateY(16px) scale(.96);
      transition: transform .55s cubic-bezier(.22, 1, .36, 1);
    }
    .cue.show .cue-card { transform: none; }

    /* 荷叶 + 青蛙：与画布里的落点同构，只是换成首页那只 emoji 小蛙 */
    .cue-pad { position: relative; width: 108px; height: 78px; margin: 0 auto 2px; }
    .cue-ripple {
      position: absolute; left: 50%; bottom: 9px;
      width: 76px; height: 25px; border-radius: 50%;
      border: 2px solid rgba(88, 194, 112, .4);
      transform: translate(-50%, 0) scale(.5);
      opacity: 0;
    }
    .cue.show .cue-ripple { animation: cueRipple 2.8s ease-out infinite; }
    .cue.show .cue-ripple:nth-child(2) { animation-delay: 1.4s; }
    @keyframes cueRipple {
      0%   { transform: translate(-50%, 0) scale(.5); opacity: .8; }
      70%  { opacity: .22; }
      100% { transform: translate(-50%, 0) scale(1.9); opacity: 0; }
    }
    .cue-leaf {
      position: absolute; left: 50%; bottom: 14px;
      width: 86px; height: 30px; border-radius: 50%;
      transform: translateX(-50%);
      background: radial-gradient(62% 82% at 40% 26%, #d3f8d5, #7edb8c 58%, #46b463);
      box-shadow: inset 0 -5px 9px rgba(30, 96, 56, .18), 0 10px 18px rgba(47, 110, 128, .16);
      animation: cueBob 3.4s ease-in-out infinite;
    }
    @keyframes cueBob {
      0%, 100% { transform: translateX(-50%) translateY(1px) rotate(-.6deg); }
      50%      { transform: translateX(-50%) translateY(-3px) rotate(.6deg); }
    }
    .cue-frog {
      position: absolute; left: 50%; top: -33px;
      font-family: "Segoe UI Emoji", "Apple Color Emoji", "Noto Color Emoji", "PingFang SC", sans-serif;
      font-size: 36px; line-height: 1;
      transform: translateX(-50%);
      filter: drop-shadow(0 7px 9px rgba(47, 110, 128, .28));
      animation: cueFrogBob 3.4s ease-in-out infinite;
    }
    @keyframes cueFrogBob {
      0%, 100% { transform: translateX(-50%) translateY(0) scale(1); }
      50%      { transform: translateX(-50%) translateY(-4px) scale(1.03); }
    }

    /* 结算：小蛙跳上荷叶、水花散开、金色光点向上飘 */
    .cue--end .cue-leaf { animation: cueLeafSettle .95s cubic-bezier(.3, 0, .35, 1) both; }
    .cue--end .cue-frog { animation: cueHop .78s cubic-bezier(.28, -.25, .4, 1) both; }
    @keyframes cueLeafSettle {
      0%   { transform: translateX(-50%) scale(.92, 1); }
      38%  { transform: translateX(-50%) scale(1.05, .9); }
      64%  { transform: translateX(-50%) scale(.98, 1.04); }
      100% { transform: translateX(-50%) scale(1, 1); }
    }
    @keyframes cueHop {
      0%   { transform: translate(-50%, 18px) scale(.82); opacity: 0; }
      28%  { opacity: 1; }
      56%  { transform: translate(-50%, -30px) scale(1.04, .97); }
      82%  { transform: translate(-50%, 2px) scale(.97, 1.03); }
      100% { transform: translate(-50%, 0) scale(1); opacity: 1; }
    }
    .cue-splash {
      position: absolute; left: 50%; bottom: 8px;
      width: 80px; height: 26px; border-radius: 50%;
      border: 2px solid rgba(255, 255, 255, .9);
      transform: translate(-50%, 0) scale(.4);
      opacity: 0;
    }
    .cue--end .cue-splash { animation: cueSplash .85s .5s ease-out both; }
    @keyframes cueSplash {
      0%   { transform: translate(-50%, 0) scale(.35); opacity: .9; }
      100% { transform: translate(-50%, -16px) scale(1.5, 2.1); opacity: 0; }
    }
    .cue-spark {
      position: absolute; width: 6px; height: 6px; border-radius: 50%;
      background: #ffda86; box-shadow: 0 0 9px rgba(255, 196, 96, .9);
      opacity: 0;
    }
    .cue--end .cue-spark { animation: cueSpark 1.7s .55s ease-out both; }
    @keyframes cueSpark {
      0%   { transform: translateY(6px) scale(.4); opacity: 0; }
      24%  { opacity: 1; }
      100% { transform: translateY(-34px) scale(1); opacity: 0; }
    }

    /* 倒数数字：与校准页 .countdown 同一青绿渐变；GO 换成暖金色 */
    .cue-kicker {
      margin-top: 2px;
      font-size: 11px; font-weight: 800; letter-spacing: .28em;
      color: var(--ink-soft);
    }
    .cue-count-wrap { position: relative; display: grid; place-items: center; height: 98px; margin-top: 2px; }
    .cue-halo {
      position: absolute; width: 80px; height: 80px; border-radius: 50%;
      background: radial-gradient(circle, rgba(255, 218, 134, .5), rgba(255, 218, 134, 0) 68%);
      opacity: 0;
    }
    .cue-count {
      position: relative;
      font-size: 84px; line-height: 1; font-weight: 900;
      font-variant-numeric: tabular-nums;
      background: linear-gradient(152deg, #27817c, #3aa7a0 56%, #58c270);
      -webkit-background-clip: text; background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .cue-count.go {
      font-size: 58px; letter-spacing: 2px;
      background: linear-gradient(140deg, #f7a455, #ffc37e 52%, #ffda86);
      -webkit-background-clip: text; background-clip: text;
    }
    .cue-count.pop { animation: cuePop .62s cubic-bezier(.22, 1.35, .4, 1) both; }
    .cue-halo.pop { animation: cueHalo .95s cubic-bezier(.2, .7, .3, 1) both; }
    @keyframes cuePop {
      0%   { transform: scale(.58); opacity: 0; }
      58%  { transform: scale(1.07); opacity: 1; }
      100% { transform: scale(1); opacity: 1; }
    }
    @keyframes cueHalo {
      0%   { transform: scale(.4); opacity: .85; }
      100% { transform: scale(1.7); opacity: 0; }
    }

    .cue-title { margin-top: 6px; font-size: 25px; font-weight: 900; letter-spacing: 1px; color: var(--ink); }
    .cue--end .cue-title { margin-top: 2px; }
    .cue-sub {
      margin-top: 7px; min-height: 2.8em;
      font-size: 14px; line-height: 1.5; font-weight: 600; color: var(--ink-soft);
    }
    .cue-dots { display: flex; justify-content: center; gap: 8px; margin-top: 8px; }
    .cue-dots i {
      width: 7px; height: 7px; border-radius: 50%;
      background: rgba(58, 108, 122, .16);
      transition: background .3s ease, transform .3s ease;
    }
    .cue-dots i.on { background: var(--accent); transform: scale(1.2); }

    .cue-stats { display: flex; justify-content: center; gap: 8px; margin: 11px 0 4px; }
    .cue-stat {
      min-width: 78px; padding: 8px 10px 7px;
      border-radius: 14px;
      background: rgba(58, 167, 160, .08);
      border: 1px solid rgba(58, 167, 160, .16);
    }
    .cue-stat b { display: block; font-size: 20px; font-weight: 900; color: var(--accent-dark); line-height: 1.2; }
    .cue-stat span { font-size: 10.5px; font-weight: 700; color: var(--ink-soft); letter-spacing: .4px; }
    .cue-score { background: rgba(255, 195, 126, .16); border-color: rgba(247, 164, 85, .26); }
    .cue-score b { color: #b9782c; }
    .cue-load {
      width: 148px; height: 5px; margin: 12px auto 0;
      border-radius: 999px; background: rgba(58, 108, 122, .12); overflow: hidden;
    }
    .cue-load i {
      display: block; width: 42%; height: 100%; border-radius: inherit;
      background: linear-gradient(90deg, #53bdb2, #79d279);
      animation: cueLoad 1.15s ease-in-out infinite;
    }
    @keyframes cueLoad {
      0%   { transform: translateX(-130%); }
      100% { transform: translateX(380%); }
    }


    @media (prefers-reduced-motion: reduce) {
      .cue, .cue-card, .cue-count.pop, .cue-halo.pop,
      .cue--end .cue-leaf, .cue--end .cue-frog, .cue--end .cue-splash,
      .cue--end .cue-spark, .cue.show .cue-ripple {
        animation-duration: .01ms; animation-delay: 0ms; transition-duration: .01ms;
      }
      .cue-leaf, .cue-frog { animation: none; }
    }

    @media (max-width: 560px) {
      .canvas-wrap { display: flex; flex-direction: column; }
      .tutorial {
        position: static;
        order: -1;
        margin-bottom: 12px;
        background: none;
        backdrop-filter: none;
      }
      .tutorial-card { width: 100%; padding: 16px; }
      .hud { justify-content: center; }
      .hud-item { gap: 6px; padding: 7px 10px; font-size: 15px; }
      .hud-item .icon { font-size: 17px; }
      /* 手机上的池塘只有两三百像素高，转场改为覆盖整屏才放得下 */
      .cue { position: fixed; border-radius: 0; }
      .cue-card { width: min(88%, 360px); padding: 18px 20px 16px; }
      .cue-pad { height: 70px; }
      .cue-count-wrap { height: 86px; }
      .cue-count { font-size: 72px; }
      .cue-count.go { font-size: 48px; }
      .cue-title { font-size: 22px; }
    }

    /* 非 macOS 不显示心率 HUD（心率采集依赖 macOS 的 hrd 进程） */
    html[data-heart="off"] #hr-hud { display: none !important; }
  </style>
  <link rel="stylesheet" href="assets/sky.css">
  <script src="assets/sky.js"></script>
  <script>
    // 顺带缓存到 localStorage，下一次进入游戏页就能同步判断，不会闪出心率 HUD
    try {
      if (localStorage.getItem("bf-heart-ok") === "0") document.documentElement.dataset.heart = "off";
    } catch (_) {}
    fetch("/api/env").then(r => r.json()).then(env => {
      try { localStorage.setItem("bf-heart-ok", env.heart_supported ? "1" : "0"); } catch (_) {}
      if (!env.heart_supported) {
        document.documentElement.dataset.heart = "off";
        try { localStorage.setItem("bf-heart", "off"); } catch (_) {}
      }
    }).catch(() => {});
  </script>
</head>
<body>
  <div class="bubbles"><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
  <div class="sky-veil sky-veil--dawn" aria-hidden="true"></div>
  <div class="sky-veil sky-veil--dusk" aria-hidden="true"></div>
  <div class="sky-veil sky-veil--night" aria-hidden="true"></div>

  <div class="wrap">
    <div class="page-skybar">
      <span class="page-skybar-label">🎨 页面配色</span>
      <div class="sky-switch" id="sky-switch" role="group" aria-label="天空模式">
        <button type="button" class="sky-opt" data-mode="dawn" aria-pressed="false" title="黎明模式"><span aria-hidden="true">🌄</span>黎明</button>
        <button type="button" class="sky-opt" data-mode="day" aria-pressed="false" title="白天模式"><span aria-hidden="true">☀️</span>白天</button>
        <button type="button" class="sky-opt" data-mode="dusk" aria-pressed="false" title="傍晚模式"><span aria-hidden="true">🌇</span>傍晚</button>
        <button type="button" class="sky-opt" data-mode="night" aria-pressed="false" title="黑夜模式"><span aria-hidden="true">🌙</span>黑夜</button>
        <button type="button" class="sky-opt" data-mode="auto" aria-pressed="false" title="跟随系统时间（日出日落）"><span aria-hidden="true">🌗</span>跟随时间</button>
      </div>
    </div>
    <div class="card" style="padding:16px 22px">
      <div class="hud">
        <span class="hud-item" id="lamp"><span class="lamp-dot"></span><span id="lamp-text">专注中</span></span>
        <span class="hud-item"><span>剩余</span><span id="timer" style="min-width:5.5ch;text-align:center">01:00</span></span>
        <span class="hud-item" id="hr-hud" title="心率（辅助信号，低采样率）">
          <span class="icon" id="hr-icon">♥</span><span id="hr-bpm" style="min-width:2.5ch;text-align:center">--</span><span style="font-size:13px;opacity:.6;font-weight:700">BPM</span>
        </span>
        <span class="hud-item"><span>得分</span><span id="score" style="color:#ffda86;min-width:2ch;text-align:center">0</span></span>
      </div>
    </div>

    <div class="game-meters">
      <div>信号分数 <strong id="focus-readout">—</strong></div>
      <div>蓄力 <strong id="energy-readout">0%</strong></div>
      <div class="energy-track" aria-hidden="true">
        <div id="energy-fill"></div><div id="energy-zone"></div>
      </div>
    </div>
    <div class="canvas-wrap">
      <canvas id="game-canvas" width="900" height="460"></canvas>

      <div class="tutorial hidden" id="tutorial">
        <div class="tutorial-card">
          <h3>玩法</h3>
          <ol>
            <li>池塘上方的能量条涨到 <b class="tut-gold">金色区间</b> 时，点击池塘或按空格，青蛙就会起跳。</li>
            <li>走神的时候进度会停住，<b>不会往回退</b>，慢慢来就好。</li>
          </ol>
          <button class="btn btn-primary" id="tutorial-ok" type="button">开始玩</button>
        </div>
      </div>

      <!-- 开局倒数：3 → 2 → 1 → 开始！ -->
      <div class="cue cue--start" id="start-cue" role="status" aria-hidden="true" aria-live="polite">
        <div class="cue-card">
          <div class="cue-pad" aria-hidden="true">
            <span class="cue-ripple"></span>
            <span class="cue-ripple"></span>
            <div class="cue-leaf"><span class="cue-frog">🐸</span></div>
          </div>
          <p class="cue-kicker">专注小蛙</p>
          <div class="cue-count-wrap">
            <span class="cue-halo" aria-hidden="true"></span>
            <span class="cue-count">3</span>
          </div>
          <p class="cue-sub">坐稳，慢慢吸一口气</p>
          <div class="cue-dots" aria-hidden="true"><i></i><i></i><i></i></div>
        </div>
      </div>

      <!-- 结算：小蛙跳回荷叶，报告生成中 -->
      <div class="cue cue--end" id="end-cue" role="status" aria-hidden="true" aria-live="polite">
        <div class="cue-card">
          <div class="cue-pad" aria-hidden="true">
            <span class="cue-ripple"></span>
            <span class="cue-ripple"></span>
            <span class="cue-splash"></span>
            <div class="cue-leaf"><span class="cue-frog">🐸</span></div>
          </div>
          <span class="cue-spark" style="left:13%;top:16%" aria-hidden="true"></span>
          <span class="cue-spark" style="right:14%;top:11%;animation-delay:.75s" aria-hidden="true"></span>
          <span class="cue-spark" style="right:21%;top:42%;animation-delay:1.05s" aria-hidden="true"></span>
          <p class="cue-kicker">本局完成</p>
          <p class="cue-title">这一局结束啦</p>
          <div class="cue-stats">
            <div class="cue-stat cue-score"><b>0</b><span>得分</span></div>
            <div class="cue-stat cue-jumps"><b>0</b><span>跳跃次数</span></div>
            <div class="cue-stat cue-time"><b>00:00</b><span>专注时长</span></div>
          </div>
          <p class="cue-sub">正在生成专注报告…</p>
          <div class="cue-load" aria-hidden="true"><i></i></div>
        </div>
      </div>

    </div>

    <div class="game-guidance">
      <p id="replay-label" class="hidden">脑电数据回放 · 使用已录制的心算信号</p>
      <p>蓄力进入金色区间后，点击池塘或按空格起跳。</p>
      <p class="warn-banner show" id="warn">正在等待信号…</p>
      <p id="game-error" class="hint hidden" role="alert"></p>
    </div>

    <div class="card hidden" id="manual-card">
      <div class="section-title" style="margin-bottom:6px"><span class="dot"></span>手动模拟模式</div>
      <div class="slider-row" style="display:flex;gap:16px;align-items:center">
        <span style="font-weight:700">放松</span>
        <input type="range" id="manual-slider" min="0" max="100" value="30" style="flex:1">
        <span style="font-weight:700">专注</span>
      </div>
      <p class="hint" style="font-size:13.5px;margin-top:10px">
        演示用滑块：<strong>拉到右边</strong>青蛙会一直前进，<strong>拉到左边</strong>就停下来。正式游戏不需要它。
      </p>
    </div>

    <div class="btn-row">
      <button id="btn-retry" class="btn btn-primary hidden" type="button">重新连接</button>
      <button id="btn-quit" class="btn btn-ghost">退出游戏</button>
    </div>
  </div>

  <script src="assets/api.js"></script>
  <script src="assets/achievements.js"></script>
  <script src="assets/pond-effects.js"></script>
  <script>
    const $ = id => document.getElementById(id);
    const canvas = $("game-canvas");
    const ctx = canvas.getContext("2d");

    // ---- 画布分辨率适配 ----
    // 逻辑坐标系固定 900×460；位图按「实际显示宽度 × devicePixelRatio」创建，
    // 让 1 个位图像素正好落在 1 个设备像素上。否则浏览器会把 900×460 的画布
    // 拉伸重采样，半透明白云缓慢漂移时边缘会逐帧抖动，看起来就像在闪烁。
    const W = 900, H = 460;
    const view = { x: 1, y: 1 };

    function fitCanvas() {
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      // clientWidth 不含 3px 外边框：位图必须与内容区 1:1，否则仍会被缩放
      const cssW = canvas.clientWidth || canvas.getBoundingClientRect().width || W;
      const cssH = cssW * H / W;
      const bw = Math.max(1, Math.round(cssW * dpr));
      const bh = Math.max(1, Math.round(cssH * dpr));
      const sx = bw / W, sy = bh / H;
      if (canvas.width === bw && canvas.height === bh && view.x === sx && view.y === sy) return;
      canvas.width = bw;
      canvas.height = bh;
      view.x = sx;
      view.y = sy;
    }

    // ---- 天空主题：与首页（index.html）共用 sky.js 里的同一份色板 ----
    // 黎明 / 白天 / 傍晚 / 黑夜切换时，画布的天空、日月星、云、远山、水面、
    // 水面反光与荷叶明度都会跟着重绘，和初始界面的梦境池塘保持一致。
    function theme() {
      return window.SkyTheme ? SkyTheme.palette(SkyTheme.sky()) : SkyThemeFake;
    }
    const SkyThemeFake = {
      sky: ["#dff4fb", "#c9edf4", "#b3e3e8"],
      water: ["#9fd8e2", "#6fb8c9"],
      hills: ["rgba(201, 233, 223, .86)", "rgba(179, 221, 214, .92)"],
      trees: "rgba(88, 178, 128, .8)",
      waves: 1,
      cloud: { fill: "rgba(255, 255, 255, .92)", alpha: .88 },
      mist: { color: "255, 233, 216", alpha: 0 },
      glow: null,
      sun: { x: 828, y: 62, core: "#ffdf8e", mid: "#ffe9b8", halo: "#ffe9b8" },
      moon: null,
      stars: false,
      flora: "none",
      frog: "none",
      energy: ["#8fe3a0", "#2f9c93"],
      hud: { pill: "rgba(255, 255, 255, .92)", ink: "#23464f", inkSoft: "rgba(35, 70, 79, .75)" },
    };

    // 星图：固定随机种子，每次打开位置一致；避开月亮周围留出干净的月光
    const stars = (function () {
      let seed = 20261112;
      const rnd = () => {
        seed = (seed * 1664525 + 1013904223) % 4294967296;
        return seed / 4294967296;
      };
      const out = [];
      for (let i = 0; i < 76; i++) {
        const x = 14 + rnd() * 872;
        const y = 8 + rnd() * 174;
        if (Math.pow(x - 808, 2) + Math.pow(y - 66, 2) < 52 * 52) continue;
        out.push({ x, y, r: 0.6 + rnd() * 1.5, ph: rnd() * Math.PI * 2, sp: 0.5 + rnd() * 1.1 });
      }
      return out;
    })();

    // ---- 会话与基线 ----
    // 校准基线有效期 1 小时：有效期内刷新/关闭页面都无需重新校准；
    // 过期（或从未校准）时不允许用旧基线开局，先回校准页。
    const params = new URLSearchParams(location.search);
    const demoRequested = params.get("demo") === "1";
    const requestedTest = params.get("test");
    const demo = DeveloperTools.canTest && demoRequested;
    const testMode = DeveloperTools.canTest && ["replay", "manual"].includes(requestedTest) ? requestedTest : null;
    const developerRun = demo || !!testMode;
    const deniedTest = (demoRequested || requestedTest) && !developerRun;
    const calibrationStore = testMode ? Store.forDeveloperTest() : Store;
    const calibInfo = testMode ? calibrationStore.calibInfo() : Store.playerCalibInfo();
    const prev = calibrationStore.load();
    const calib = deniedTest ? null : demo ? { baseline: 0.55 }
      : testMode && prev?.source?.mode !== testMode ? null : calibInfo.calib;
    const baseline = calib ? calib.baseline : 0.4;
    const calibExpired = calibInfo.expired;
    if (deniedTest) {
      location.replace("index.html");
    } else if (!calib) {
      if (calibExpired) calibrationStore.clearCalib();
      toast(calibExpired ? "校准已超过 1 小时，需要再校准一次" : "先做一次校准，让青蛙认识你的状态");
      setTimeout(() => {
        const query = new URLSearchParams();
        if (calibExpired) query.set("reason", "expired");
        if (testMode) query.set("test", testMode);
        location.replace("calibrate.html" + (query.size ? "?" + query : ""));
      }, 1200);
    }

    // ---- 本局时长（开始前由首页弹窗选择：game.html?sec=180）----
    const DURATION_MIN_SEC = 60;
    const DURATION_MAX_SEC = 3600;
    function readDurationSec() {
      const raw = params.get("sec")
                || localStorage.getItem("bf-duration-sec");
      const n = Math.round(Number(raw));
      if (!Number.isFinite(n) || n <= 0) return 60;
      return Math.min(DURATION_MAX_SEC, Math.max(DURATION_MIN_SEC, n));
    }
    const totalSec = readDurationSec();

    // 计时显示：始终 mm:ss，避免 10 分钟时数字过长
    function formatClock(sec) {
      const s = Math.max(0, Math.ceil(sec));
      const m = Math.floor(s / 60);
      const r = s % 60;
      return String(m).padStart(2, "0") + ":" + String(r).padStart(2, "0");
    }

    // 云的横向包围盒：三个椭圆合起来最远横向半径 = 20s + 20s = 40s。
    // 出界判定与循环回绕都用这个值，保证云是「完全离开屏幕」后才从另一侧进来，
    // 不会在边缘处突然消失/出现（那同样会被看成闪烁）。
    const CLOUD_HALF_W = 40;

    const state = {
      session: null, es: null,
      focus: baseline, raw: baseline,
      fused: baseline,     // 融合分：心率新鲜时按权重修正，否则等于 focus
      norm: null,          // 后端 20–80 动态分（0–100），游戏判定与显示都用它
      scoreSmooth: null,   // 平滑后的分数：避免单帧抖动让判定反复横跳
      focusOn: false,      // 滞回后的“在状态”开关
      tutorialOpen: false, // 首次上手的教学层是否打开
      introOpen: false,    // 开局倒数是否正在播放（计时与蓄力暂停）
      jumpWindow: null,    // 金色起跳区间 {lo,hi}（能量百分比）：在区间内点击可提前起跳
      actions: { timed_jumps: 0, automatic_jumps: 0, jumps: [] },
      signalTime: 0,
      bpm: null, hrValid: false, hrMode: "off",
      energy: 0,
      score: 0,
      totalSec,
      timeLeft: totalSec,
      lastTs: null,
      stale: true,        // 首帧到来前和断流期间均暂停蓄力
      lastFrameTs: 0,     // 最近一次有效帧时间（新鲜度检查）
      clock: 0,           // 平滑累积的动画时钟（秒）：不用 rAF 墙钟，避免切后台/掉帧时跳变
      over: false,
      saving: false,
      leaving: false,
      manualMode: false,
      jumping: { active: false, t: 0, fromX: 0, toX: 0 },
      cur: 0,           // 青蛙当前所在荷叶在 lilies 中的下标
      pendingSettle: false,  // 落地后等待水花散尽、荷叶上浮稳定，再开始平移
      settling: false,  // 跳完后青蛙与荷叶一起平滑移回屏幕中间
      popups: [],     // 浮动文字 {x,y,text,t}
      droplets: [],
      splashes: [],   // 水花涟漪 {x,y,r0,r1,t,life}
      clouds: [
        { x: 120, y: 52, s: 1.0, v: 8, phase: 0.6 },
        { x: 520, y: 38, s: 0.8, v: 12, phase: 2.4 },
        { x: 780, y: 72, s: 0.62, v: 6, phase: 4.1 },
      ],
    };

    $("timer").textContent = formatClock(state.totalSec);

    // 荷叶布局（青蛙等待位固定在屏幕中间 cx=450：当前荷叶中心 = cx）
    let lilies = [];
    const CX = W / 2;
    const LILY_GAP_MIN = 160;     // 相邻荷叶最小间距
    const LILY_GAP_SPREAD = 45;   // 间距随机增量
    const LILY_SPAWN_SEC = 0.62;  // 新荷叶从水下浮到水面的时长（一次跳跃内完成）
    const LILY_RISE = 54;         // 出水前藏在水面下的深度（px）
    const LILY_BREAK_AT = 0.32;   // 浮到这个进度时叶缘刚好顶破水面，溅起水花
    function resetLilies() {
      // 开局只摆「青蛙所在」和「下一跳目标」两片。之后每次起跳，
      // 都先在青蛙右边让新荷叶从水下浮出来，等它出水、水花散尽后才平移视角。
      lilies = [];
      state.cur = 0;
      let x = CX;   // 青蛙初始位置 = 荷叶正中心（叶脉交点）
      for (let i = 0; i < 2; i++) {
        lilies.push({
          x, y: 340 - (i % 2) * 26, bob: Math.random() * Math.PI * 2,
          dip: 0, dipVel: 0, spawn: 1, surfaced: true,
        });
        x += LILY_GAP_MIN + Math.random() * LILY_GAP_SPREAD;
      }
    }
    // 前方补一片新荷叶（落在最右侧荷叶的右边，留在画面内好让孩子看见它浮出来）
    function addLily() {
      const last = lilies[lilies.length - 1];
      const x = Math.min(last.x + LILY_GAP_MIN + Math.random() * LILY_GAP_SPREAD,
                         W - 70);
      const lily = {
        x,
        y: last.y === 340 ? 314 : 340,
        bob: Math.random() * Math.PI * 2,
        dip: 0, dipVel: 0,
        spawn: 0,        // 0 → 1：从水下浮上水面，浮完才允许平移视角
        surfaced: false, // 是否已经顶破水面（水花只放一次）
      };
      lilies.push(lily);
      return lily;
    }
    // 起跳前就保证「青蛙右边」已经有一片正在浮上来的新荷叶：
    // 孩子先看到荷叶和水花，之后才会看到视角平移，避免落地后凭空冒出来。
    function ensureNextLily() {
      if (!lilies[state.cur + 2]) addLily();
    }
    resetLilies();
    // 第一次跳给一个更早的窗口，别让孩子干等到满格
    state.jumpWindow = { lo: 22, hi: 36 };
    const reducedMotion = matchMedia("(prefers-reduced-motion: reduce)");

    // ---- 创建会话 ----
    async function init() {
      if (!calib) return;   // 无有效校准：已在上面安排跳转回校准页，不创建会话
      state.introOpen = true;   // 会话建立到倒数结束之间，先冻结计时与蓄力
      const prevMode = prev && prev.source ? prev.source.mode : null;
      // heart：仅心率玩法，没有脑电信号，判定完全来自心率分量
      const mode = demo ? "manual" : testMode || prevMode;
      // 心率辅助源：?heart=hrd 或 localStorage 的 bf-heart 决定是否接入；
      // 未开启时整个链路保持纯 EEG，HUD 显示 "--"。
      let heartMode = (params.get("heart")
        || localStorage.getItem("bf-heart") || "off").toLowerCase();
      // 仅心率模式不能关心率，否则整局没有可用信号
      if (mode === "heart") heartMode = "hrd";
      const heartRest = Number(localStorage.getItem("bf-heart-rest")) || null;
      const heartWeight = Number(localStorage.getItem("bf-heart-weight")) || 0.15;
      // baseline 必须随会话一起上报：报告页的橙色虚线与"高于基线占比"都依赖它
      let body = { mode, baseline: calib.baseline };
      // 动态定标区间随会话带上：校准页把「最放松/最专注」映射成 20/80
      if (calib.range && calib.range.low != null && calib.range.high != null) {
        body.score_low = calib.range.low;
        body.score_high = calib.range.high;
      }
      if (!developerRun && heartMode === "hrd") {
        body.heart_mode = heartMode;
        if (heartRest) body.heart_rest_bpm = heartRest;
        body.heart_weight = heartWeight;
      }
      if (mode === "replay") {
        const pairs = await API.replayPairs();
        const calibFile = prev?.source?.file;
        const pair = pairs.find(({ rest }) => rest.path.split(/[/\\]/).pop() === calibFile);
        if (!pair) throw new Error("找不到本次校准对应的心算回放，请返回校准页重新选择信号源");
        body.file = pair.task.path;
      } else if (mode === "hardware") {
        body.osc_ports = (prev && prev.source && prev.source.osc_ports) || null;
      }
      const res = await API.post("/api/session", body);
      if (state.leaving) {
        API.endAbandonedSession(res.session_id);
        return;
      }
      state.session = { id: res.session_id, mode, osc_ports: body.osc_ports || null };
      $("replay-label").textContent = developerRun ? "开发者测试 · " + describeSignal(res.source) : "";
      $("replay-label").classList.toggle("hidden", !developerRun);
      state.manualMode = mode === "manual";
      if (demo) {
        await API.post(`/api/session/${res.session_id}/manual`, { focus: 0.8 });
        $("manual-slider").value = "80";
      }
      $("manual-card").classList.toggle("hidden", !state.manualMode);

      state.es = API.stream(res.session_id, {
        onFrame(f) {
          if (!f.valid || f.focus == null) { state.stale = true; return; }
          state.lastFrameTs = performance.now();
          state.signalTime = f.t;
          state.stale = false;
          state.focus = f.focus; state.raw = f.raw;
          // 融合分：心率新鲜时后端已按权重修正；缺失/过期时与 focus 完全一致
          state.fused = (f.focus_fused != null) ? f.focus_fused : f.focus;
          state.norm = (f.score != null) ? f.score : null;
          if (f.hr) {
            state.bpm = f.hr.bpm;
            state.hrValid = !!f.hr.valid;
            state.hrMode = f.hr.mode || "off";
          }
        },
        onEnd() { showGameError("本局连接已结束，请重新开局。", "重新开局"); },
        onError() { showGameError("连接中断。请检查本地服务，再重新开局。", "重新开局"); },
        onStatus(s) { if (s === "reconnecting") state.stale = true; },
      });

      requestAnimationFrame(loop);
      // 没有教学层就立刻倒数；教学层“开始玩”会再触发一次（内部去重）
      if (!state.tutorialOpen) requestStartCue();
    }

    // ---- 手动模式 ----
    $("manual-slider").addEventListener("input", async e => {
      const v = e.target.value / 100;
      state.focus = v; state.raw = v;
      if (state.session) await API.post(`/api/session/${state.session.id}/manual`, { focus: v });
    });

    // 点击/空格：先判目标，再判起跳窗口
    canvas.addEventListener("pointerdown", tryJumpTap);
    window.addEventListener("keydown", e => {
      if (e.target.closest?.("button, input, select, textarea, a[href]")) return;
      if (e.code === "Space" || e.code === "Enter") {
        e.preventDefault();
        tryJumpTap();
      }
    });

    // ---- 游戏主循环 ----
    function loop(ts) {
      if (state.over) return;
      const dt = state.lastTs ? Math.min((ts - state.lastTs) / 1000, 0.05) : 0.016;
      state.lastTs = ts;
      // 动画时钟逐帧累加并限幅：浏览器切后台、掉帧或恢复时不会突然跳一大步，
      // 云和星星的位移/明暗因此始终连续，不会出现"闪一下"。
      state.clock += dt;
      updateGame(dt);
      draw(state.clock);
      requestAnimationFrame(loop);
    }

    // 纯视觉推进：云、水花、荷叶的呼吸与判定无关，开局倒数时也继续跑
    function updateAmbient(dt) {
      // 云漂移：完全移出右侧后才从左侧外面重新进入（按包围盒判定，不靠固定留白）
      state.clouds.forEach(c => {
        c.x += c.v * dt;
        const halfW = CLOUD_HALF_W * c.s;
        if (c.x - halfW > W) c.x = -halfW;
      });

      // 水花/浮字更新
      state.splashes = state.splashes.filter(p => (p.t += dt) < p.life);
      state.droplets = state.droplets.filter(p => {
        p.t += dt;
        if (p.t >= p.life) return false;
        PondEffects.advanceDroplet(p, dt);
        return true;
      });
      state.popups = state.popups.filter(p => (p.t += dt) < 1.2);
      // 荷叶下沉/上浮（弹簧阻尼）：dip > 0 沉入水面，dip < 0 回弹上浮
      updateLilyDips(dt);
      // 新荷叶从水下浮上来的进度（浮出水面前不平移视角）
      updateLilySpawns(dt);
    }

    function updateGame(dt) {
      if (state.tutorialOpen) return;   // 教学层打开时先不跑游戏逻辑
      updateAmbient(dt);
      // 开局倒数期间只让画面呼吸：计时、蓄力与判定全部暂停
      if (state.introOpen) return;

      // 主动任务 1：错过窗口就顺延到能量前方，孩子始终有下一个可追的目标
      if (state.jumpWindow && !state.jumping.active && !state.settling && !state.pendingSettle
          && state.energy > state.jumpWindow.hi + 1.5) {
        const lo = Math.min(94, state.energy + 2);
        state.jumpWindow = { lo, hi: Math.min(99, lo + 11) };
      }

      // 数据新鲜度：超过 3 秒无有效帧 → 视为断流，暂停蓄力（旧分数不得继续驱动游戏）
      if (performance.now() - state.lastFrameTs > 3000) state.stale = true;

      // 动态分：后端把校准得到的 20/80 两端换算好，50 分就是专注线
      const scoreNow = (state.norm != null)
        ? state.norm
        : ((state.fused != null ? state.fused : state.focus) * 100);
      // 判定放宽：先平滑，再用滞回——到 45 分算“跟上”，掉到 38 分以下才算飘走。
      // 这样在 50 分线附近轻微波动时不会来回闪烁。
      if (state.scoreSmooth == null) state.scoreSmooth = scoreNow;
      state.scoreSmooth += (scoreNow - state.scoreSmooth) * Math.min(1, dt * 3.2);
      if (!state.focusOn) {
        if (state.scoreSmooth >= 45) state.focusOn = true;
      } else if (state.scoreSmooth < 38) {
        state.focusOn = false;
      }
      const focused = !state.stale && state.focusOn;
      // 蓄力：跳跃中与平移中不蓄力；落地后等待水花/上浮的这段时间仍可蓄力
      if (!state.jumping.active && !state.settling && !state.pendingSettle && !state.stale) {
        if (focused) {
          const gain = (state.scoreSmooth - 42) * dt * 0.16;
          state.energy = Math.min(100, state.energy + gain);
        }
        // 分心时不回退蓄力，只停止增长。时间仍在走，少跳几次本身就是代价，
        // 不需要再让进度条往下掉——那只会让孩子觉得“白练了”。
      }

      if (state.pendingSettle) {
        // 顺序：起跳时右边的新荷叶已经开始从水下往上浮，等它完全出水、水花散尽、
        // 荷叶回弹停稳，才允许平移视角——落地点不会突然多出一片荷叶。
        const l = lilies[state.cur];
        const calm = Math.abs(l.dip || 0) < 0.4 && Math.abs(l.dipVel || 0) < 2;
        const next = lilies[state.cur + 1];
        const grown = !next || next.spawn >= 1;
        if (!state.splashes.length && !state.droplets.length && calm && grown) {
          state.pendingSettle = false;
          state.settling = true;
        }
      } else if (state.jumping.active) {
        state.jumping.t += dt;
        if (state.jumping.t >= 0.55) {
          const landing = lilies[state.cur + 1];   // 目标荷叶
          state.jumping.active = false;
          state.cur += 1;                          // 青蛙落到下一片，旧荷叶保留在左侧
          // 正常流程里下一片在起跳时（ensureNextLily）就已生成，这里只是兜底
          if (!lilies[state.cur + 1]) addLily();
          state.energy = 15;
          rollJumpWindow();                        // 新一跳重新给一个金色窗口
          // 落地：新荷叶被压得下沉一截，四周溅起水花，随后回弹上浮
          dipLily(landing, PondEffects.landingImpulse);
          spawnLandingSplash(landing.x, landing.y + 6);
          // 先等特效结束、上浮稳定，再平移（见 pendingSettle 分支）
          state.pendingSettle = true;
        }
      } else if (state.settling) {
        // 平移：所有荷叶同步左移，直到当前荷叶中心回到 CX（青蛙回中间）
        // 旧荷叶随场景移出，完全离开画面后回收。
        const cur = lilies[state.cur];
        const dist = cur.x - CX;
        if (dist <= 0.5) {
          cur.x = CX;   // 精确归位：青蛙正中心回到屏幕中间
          state.settling = false;
        } else {
          const step = Math.min(dist, Math.max(24 * dt, dist * dt * 4));
          lilies.forEach(l => { l.x -= step; });
          while (state.cur > 0 && lilies[0].x < -60) {
            lilies.shift();
            state.cur -= 1;
          }
        }
      } else if (!state.stale && state.energy >= 100) {
        startJump();
      }

      const lamp = $("lamp");
      lamp.classList.toggle("lamp-on", focused);

      // 心率 HUD：只在读数新鲜时跳动；过期/未接入显示 "--" 并降低存在感
      const hrHud = $("hr-hud");
      if (state.hrValid && state.bpm) {
        $("hr-bpm").textContent = Math.round(state.bpm);
        hrHud.classList.add("beat");
        hrHud.classList.remove("stale");
        $("hr-icon").style.animationDuration =
          Math.min(1.5, Math.max(0.4, 60 / state.bpm)) + "s";
      } else {
        $("hr-bpm").textContent = "--";
        hrHud.classList.remove("beat");
        hrHud.classList.add("stale");
      }
      $("lamp-text").textContent = state.stale ? "信号中断" : (focused ? "跟上了" : "飘走了");
      // 提示条：断流、或“正在蓄力但分心”。跳跃/平移期间本来就不蓄力，不算分心。
      const charging = !state.jumping.active && !state.settling && !state.pendingSettle && !state.stale;
      $("warn").classList.toggle("show", state.stale || (charging && !focused));
      $("warn").textContent = state.stale
        ? "正在等待信号，计时已暂停。请检查设备连接。"
        : "注意力飘走了，慢慢来";

      if (state.stale) return;
      state.timeLeft -= dt;
      $("timer").textContent = formatClock(state.timeLeft);
      if (state.timeLeft <= 0) finishGame();
    }

    // ---- 主动任务：金色起跳窗口 + 变化监测 ----
    // 原先是全自动跳，孩子只要“看着”，十几秒后注意就飘了，测到的其实是“无事可做”。
    // 这两件事给了必须持续盯住的落点：等窗口、抓飞过的目标。
    function rollJumpWindow() {
      const lo = 28 + Math.random() * 24;              // 28–52%：更早出现，不用干等
      state.jumpWindow = { lo, hi: Math.min(92, lo + 14) };
    }

    function tryJumpTap() {
      if (state.over || state.stale || state.tutorialOpen || state.introOpen) return;
      if (state.jumping.active || state.settling || state.pendingSettle) return;
      const w = state.jumpWindow;
      if (!w) return;
      if (state.energy >= w.lo && state.energy <= w.hi) startJump(true);
    }

    function startJump(perfect = false) {
      const from = lilies[state.cur], to = lilies[state.cur + 1];
      if (!from || !to) return;
      ensureNextLily();   // 新荷叶现在就从水下往上浮，落到目标荷叶时它已经在水面上了
      state.jumping = { active: true, t: 0, fromX: from.x, toX: to.x };
      state.actions[perfect ? "timed_jumps" : "automatic_jumps"] += 1;
      const time = state.signalTime + (performance.now() - state.lastFrameTs) / 1000;
      state.actions.jumps.push({ t: Math.round(time * 100) / 100, timed: perfect });
      state.score += perfect ? 2 : 1;
      $("score").textContent = state.score;
      state.popups.push({ x: from.x, y: from.y - 150, text: perfect ? "完美 +2" : "+1", t: 0 });
      state.jumpWindow = null;
      // 蹬水起跳：脚下荷叶被踩得小幅度下沉，随后自动回弹上浮
      dipLily(from, 60);
    }

    // 荷叶弹簧阻尼：给一次向下的冲量 → 下沉 → 回弹（略微上浮）→ 稳定
    function updateLilyDips(dt) {
      lilies.forEach(lily => PondEffects.advancePad(lily, dt));
    }
    // 新荷叶从水下浮上来：spawn 0 → 1，浮完才允许视角平移
    function updateLilySpawns(dt) {
      lilies.forEach(lily => {
        if (lily.spawn >= 1) return;
        const before = lily.spawn;
        lily.spawn = Math.min(1, lily.spawn + dt / LILY_SPAWN_SEC);
        // 叶缘顶破水面的那一瞬：溅起水花和涟漪（每次只放一次）
        if (!lily.surfaced && before < LILY_BREAK_AT && lily.spawn >= LILY_BREAK_AT) {
          lily.surfaced = true;
          spawnEmergingSplash(lily.x, lily.y + 6);
        }
        if (lily.spawn >= 1) lily.surfaced = true;
      });
    }
    function dipLily(lily, impulse) {
      if (!lily) return;
      if (lily.dip === undefined) { lily.dip = 0; lily.dipVel = 0; }
      lily.dipVel += impulse;
    }

    // 落水水花：涟漪圈 + 一圈向外上方飞溅的水珠
    function spawnLandingSplash(x, y) {
      if (reducedMotion.matches) return;
      const effect = PondEffects.landing(x, y);
      state.splashes = state.splashes.concat(effect.ripples);
      state.droplets = state.droplets.concat(effect.droplets);
    }

    // 新荷叶出水的水花：比落地更"涌"一点，中间水柱带得更高
    function spawnEmergingSplash(x, y) {
      if (reducedMotion.matches) return;
      const effect = PondEffects.emerging(x, y);
      state.splashes = state.splashes.concat(effect.ripples);
      state.droplets = state.droplets.concat(effect.droplets);
    }

    // ---- 绘制 ----
    // t 是平滑累积的动画时钟（秒），不是 rAF 墙钟时间戳
    function draw(t) {
      const p = theme();
      // 先按设备像素清空整张位图，再切回 900×460 逻辑坐标绘制
      ctx.setTransform(1, 0, 0, 1, 0, 0);
      ctx.globalAlpha = 1;
      ctx.filter = "none";
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.setTransform(view.x, 0, 0, view.y, 0, 0);

      drawSky(p);
      drawStars(p, t);
      drawSun(p, t);
      drawClouds(p);
      drawMist(p);
      drawMountains(p);
      drawTrees(p);
      drawWater(p, t);
      drawReflection(p, t);
      drawSplashes();   // 涟漪在水面上、荷叶之下：被荷叶遮住内圈，叶缘外才露出
      drawLilies(p, t);
      drawFrog(p, t);
      drawDroplets();
      drawPopups();
      updateMeters();
    }

    function drawSky(p) {
      const g = ctx.createLinearGradient(0, 0, 0, 240);
      g.addColorStop(0, p.sky[0]);
      g.addColorStop(0.5, p.sky[1]);
      g.addColorStop(1, p.sky[2]);
      ctx.fillStyle = g;
      ctx.fillRect(0, 0, W, 240);
    }

    // 夜空星星：与首页一样缓慢明暗交替
    function drawStars(p, t) {
      if (!p.stars) return;
      ctx.save();
      ctx.fillStyle = "#ffffff";
      for (let i = 0; i < stars.length; i++) {
        const s = stars[i];
        const tw = 0.5 + 0.5 * Math.sin(t * s.sp + s.ph);
        ctx.globalAlpha = 0.25 + 0.7 * tw;
        ctx.beginPath();
        ctx.arc(s.x, s.y, s.r * (0.85 + 0.3 * tw), 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.restore();
    }

    // 白天太阳 / 黎明与傍晚的低日 / 黑夜月亮，位置与首页一致
    function drawSun(p, t) {
      if (p.sun) {
        const s = p.sun;
        const pulse = 1 + Math.sin(t * 1.1) * 0.04;
        ctx.save();
        ctx.globalAlpha = 0.24;
        ctx.fillStyle = s.halo;
        ctx.beginPath(); ctx.arc(s.x, s.y, 46 * pulse, 0, Math.PI * 2); ctx.fill();
        ctx.globalAlpha = 0.48;
        ctx.beginPath(); ctx.arc(s.x, s.y, 29, 0, Math.PI * 2); ctx.fill();
        ctx.globalAlpha = 0.92;
        ctx.fillStyle = s.core;
        ctx.beginPath(); ctx.arc(s.x, s.y, 21, 0, Math.PI * 2); ctx.fill();
        ctx.restore();
      }
      if (p.moon) {
        const m = p.moon;
        ctx.save();
        ctx.globalAlpha = 0.16;
        ctx.fillStyle = m.halo;
        ctx.beginPath(); ctx.arc(m.x, m.y, 48, 0, Math.PI * 2); ctx.fill();
        ctx.globalAlpha = 1;
        ctx.fillStyle = m.core;
        ctx.beginPath(); ctx.arc(m.x, m.y, 27, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = "#dbe6f8";
        ctx.beginPath(); ctx.arc(m.x - 9, m.y - 9, 5.6, 0, Math.PI * 2); ctx.fill();
        ctx.globalAlpha = .9;
        ctx.beginPath(); ctx.arc(m.x + 9, m.y + 3, 4.2, 0, Math.PI * 2); ctx.fill();
        ctx.globalAlpha = .8;
        ctx.beginPath(); ctx.arc(m.x - 4, m.y + 11, 3, 0, Math.PI * 2); ctx.fill();
        ctx.restore();
      }
    }

    // 白云绘制约定（后续改动请保持）：
    // 1) 云只做缓慢水平漂移：不做上下浮动、不用随机量、不在帧内改透明度。
    //    半透明白云任何一点位置或亮度抖动，都会被看成"闪烁"。
    // 2) 云心对齐到设备像素网格：每次只移动整数个设备像素，边缘覆盖率在帧间
    //    保持不变，不会出现抗锯齿边缘"沙沙"抖动的感觉。
    // 3) 云的整体透明度只由当前天空色板 p.cloud.alpha 决定；天空渐变期间
    //    由 sky.js 逐帧插值，除此之外不再叠加任何重复的 alpha 修饰。
    function drawClouds(p) {
      if (!p.cloud) return;   // 黑夜不显示云
      const px = view.x;      // 逻辑像素 -> 设备像素的比例
      ctx.save();
      ctx.globalAlpha = p.cloud.alpha;
      ctx.fillStyle = p.cloud.fill;
      state.clouds.forEach(c => {
        const k = c.s;
        const x = Math.round(c.x * px) / px;   // 对齐设备像素，消除亚像素抖动
        const y = c.y;
        ctx.beginPath();
        ctx.ellipse(x, y, 34 * k, 13 * k, 0, 0, Math.PI * 2);
        ctx.ellipse(x + 18 * k, y - 9 * k, 22 * k, 11 * k, 0, 0, Math.PI * 2);
        ctx.ellipse(x - 20 * k, y - 5 * k, 20 * k, 10 * k, 0, 0, Math.PI * 2);
        ctx.fill();
      });
      ctx.restore();
    }

    // 晨昏时地平线附近的薄雾（首页 #heroMist 同款）
    function drawMist(p) {
      if (!p.mist || !p.mist.alpha) return;
      ctx.save();
      ctx.filter = "blur(7px)";
      ctx.fillStyle = "rgba(" + p.mist.color + ", " + p.mist.alpha + ")";
      ctx.beginPath(); ctx.ellipse(140, 196, 130, 9, 0, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.ellipse(470, 208, 160, 8, 0, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.ellipse(770, 198, 138, 8, 0, 0, Math.PI * 2); ctx.fill();
      ctx.restore();
    }

    function drawMountains(p) {
      ctx.fillStyle = p.hills[0];
      ctx.beginPath();
      ctx.moveTo(0, 210);
      ctx.quadraticCurveTo(180, 108, 400, 180);
      ctx.quadraticCurveTo(560, 120, 700, 190);
      ctx.quadraticCurveTo(800, 150, 900, 196);
      ctx.lineTo(900, 250); ctx.lineTo(0, 250);
      ctx.closePath(); ctx.fill();
      ctx.fillStyle = p.hills[1];
      ctx.beginPath();
      ctx.moveTo(0, 230);
      ctx.quadraticCurveTo(240, 160, 470, 216);
      ctx.quadraticCurveTo(650, 180, 900, 226);
      ctx.lineTo(900, 260); ctx.lineTo(0, 260);
      ctx.closePath(); ctx.fill();
    }

    function drawTrees(p) {
      // 左岸树丛
      ctx.fillStyle = p.trees;
      for (let i = 0; i < 5; i++) {
        const x = 18 + i * 34, y = 216 + (i % 2) * 8, s = 16 + (i % 3) * 4;
        ctx.beginPath();
        ctx.moveTo(x, y); ctx.lineTo(x - s, y + 16); ctx.lineTo(x + s, y + 16);
        ctx.closePath(); ctx.fill();
      }
      ctx.save();
      ctx.globalAlpha = .8;
      for (let i = 0; i < 4; i++) {
        const x = 780 + i * 30, y = 212 + (i % 2) * 10, s = 14 + (i % 3) * 4;
        ctx.beginPath();
        ctx.moveTo(x, y); ctx.lineTo(x - s, y + 16); ctx.lineTo(x + s, y + 16);
        ctx.closePath(); ctx.fill();
      }
      ctx.restore();
    }

    function drawWater(p, t) {
      const g = ctx.createLinearGradient(0, 230, 0, H);
      g.addColorStop(0, p.water[0]);
      g.addColorStop(1, p.water[1]);
      ctx.fillStyle = g;
      ctx.fillRect(0, 230, W, H - 230);

      // 水波层
      ctx.lineWidth = 3;
      for (let layer = 0; layer < 4; layer++) {
        ctx.strokeStyle = `rgba(255,255,255,${(0.42 - layer * 0.09) * p.waves})`;
        const base = 268 + layer * 42;
        ctx.beginPath();
        for (let x = 0; x <= W; x += 10) {
          const y = base + Math.sin(x * 0.018 + t * (0.7 + layer * 0.12) + layer * 1.7) * 5;
          x === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
        }
        ctx.stroke();
      }
      // 水面高光
      ctx.fillStyle = `rgba(255,255,255,${0.14 * p.waves})`;
      for (let i = 0; i < 6; i++) {
        const hx = (i * 173 + 40) % 860 + 20;
        const hy = 300 + ((i * 97) % 120);
        ctx.beginPath();
        ctx.ellipse(hx + Math.sin(t + i) * 6, hy, 26, 7, 0.15, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    // 黎明（左侧暖阳）/ 傍晚（右侧落日）的水面反光
    function drawReflection(p, t) {
      const gl = p.glow;
      if (!gl) return;
      const shimmer = 1 + Math.sin(t * 0.9) * 0.04;
      ctx.save();
      ctx.filter = "blur(6px)";
      ctx.globalAlpha = .34;
      ctx.fillStyle = "rgb(" + gl.color + ")";
      ctx.beginPath();
      ctx.ellipse(gl.x, gl.y, gl.rx * shimmer, gl.ry, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();

      ctx.save();
      ctx.globalAlpha = .4;
      ctx.strokeStyle = "rgb(" + gl.color + ")";
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(gl.x - gl.rx * 0.8, gl.y - 12);
      ctx.lineTo(gl.x + gl.rx * 0.8, gl.y - 12);
      ctx.moveTo(gl.x - gl.rx * 0.55, gl.y - 4);
      ctx.lineTo(gl.x + gl.rx * 0.55, gl.y - 4);
      ctx.stroke();
      ctx.restore();
    }

    function drawLilies(p, t) {
      lilies.forEach((l, i) => {
        const spawn = l.spawn == null ? 1 : l.spawn;
        if (spawn <= 0) return;
        // 出水动画：先快后慢地浮上来（ease-out）；还没出水时整片叶子压暗、带一点模糊和水色，
        // 看上去就是"沉在水下正在往上浮"，而不是在水面上凭空出现。
        const sunk = Math.pow(1 - spawn, 2.2);              // 1 → 0
        const rise = sunk * LILY_RISE;                      // 还差多少才浮到水面
        const under = Math.min(1, Math.max(0, rise / 28));  // 1 = 完全在水下
        const grow = 1 - Math.pow(1 - spawn, 3);
        const alpha = Math.min(1, 0.5 + spawn * 0.9);
        const bob = Math.sin(t * 1.4 + l.bob) * 2.5;
        const dip = l.dip || 0;
        const y = l.y + bob + dip + rise;   // 下沉量直接加在荷叶中心
        const s = (i === state.cur ? 1.15 : 1) * (0.28 + 0.72 * grow);
        // 下沉时轻微压扁、回弹上浮时轻微拉伸，让"被踩下去"更有重量感
        const squash = Math.max(-0.075, Math.min(0.13, dip * 0.013));
        // 出水过程：水面被顶起来的鼓包 + 一圈向外散开的水纹（越接近水面越淡）
        if (spawn < 1) {
          const ring = 28 + 36 * grow;
          ctx.save();
          ctx.globalAlpha = 0.42 * under;
          ctx.fillStyle = "rgba(226,248,255,.95)";
          ctx.beginPath();
          ctx.ellipse(l.x, l.y + 3, 42 * (0.55 + 0.45 * grow), 14 * (0.55 + 0.45 * grow),
                      0, 0, Math.PI * 2);
          ctx.fill();
          ctx.globalAlpha = 0.55 * (1 - grow * 0.9);
          ctx.strokeStyle = "rgba(255,255,255,.9)";
          ctx.lineWidth = 2.6 - 1.4 * grow;
          ctx.beginPath();
          ctx.ellipse(l.x, l.y + 6, ring, ring * 0.4, 0, 0, Math.PI * 2);
          ctx.stroke();
          ctx.restore();
        }
        // 水面倒影（还沉在水下时不留倒影）
        ctx.save();
        ctx.globalAlpha = 0.16 * alpha * (1 - under);
        ctx.fillStyle = "#1d6f86";
        ctx.beginPath();
        ctx.ellipse(l.x + 4, l.y + 14 + bob * 0.4 + dip * 0.5, 44 * s, 18 * s, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
        // 荷叶：明度随天空模式变化（与首页 #heroLilies 的滤镜一致）；
        // 水下时再叠一层压暗 + 模糊，浮出水面后恢复常态。
        const dry = p.flora && p.flora !== "none" ? p.flora + " " : "";
        ctx.save();
        ctx.globalAlpha = alpha;
        ctx.filter = under > 0.02
          ? dry + `brightness(${(1 - 0.45 * under).toFixed(3)}) `
                 + `saturate(${(1 - 0.28 * under).toFixed(3)}) `
                 + `blur(${(1.5 * under).toFixed(2)}px)`
          : (dry.trim() || "none");
        ctx.translate(l.x, y);
        ctx.scale(s * (1 + squash * 0.5), s * (1 - squash));
        const g = ctx.createRadialGradient(6, -8, 4, 0, 0, 48);
        g.addColorStop(0, "#c6f3c8");
        g.addColorStop(0.65, "#74d484");
        g.addColorStop(1, "#46b463");
        ctx.fillStyle = g;
        ctx.beginPath();
        ctx.ellipse(0, 0, 47, 26, 0, 0, Math.PI * 2);
        ctx.fill();
        // 高光弧
        ctx.strokeStyle = "rgba(255,255,255,.5)";
        ctx.lineWidth = 2.5;
        ctx.beginPath();
        ctx.arc(0, 2, 34, -2.2, -1.1);
        ctx.stroke();
        // 叶脉
        ctx.strokeStyle = "rgba(30, 96, 56, .4)";
        ctx.lineWidth = 1.6;
        ctx.beginPath();
        ctx.moveTo(-34, 0); ctx.lineTo(34, 0);
        ctx.moveTo(0, -19); ctx.lineTo(0, 19);
        ctx.moveTo(-18, -11); ctx.lineTo(18, 11);
        ctx.moveTo(-18, 11); ctx.lineTo(18, -11);
        ctx.stroke();
        // 还没出水：整片叶子再罩一层水色，让它真的有"隔着水"的感觉
        if (under > 0.02) {
          ctx.globalAlpha = 0.5 * under;
          ctx.filter = "none";
          ctx.fillStyle = "rgba(118,203,219,.6)";
          ctx.beginPath();
          ctx.ellipse(0, 0, 47, 26, 0, 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.restore();
      });
    }

    function drawFrog(p, t) {
      // 荷叶上表面 = 荷叶中心 y - 26；青蛙中心 = 交点 y - 28（半高），青蛙底部正好落在三条直线交点（荷叶中心 y）
      // 荷叶下沉/上浮时青蛙跟着一起动，避免落地瞬间"悬空"
      const i0 = state.cur, i1 = state.cur + 1;
      const lilyTop = i => lilies[i].y + (lilies[i].dip || 0) - 26;
      const frogBase = i => lilies[i].y + (lilies[i].dip || 0) - 28;
      // 空中轨迹用不含下沉的基准：青蛙已离叶，不该被起跳荷叶的下沉带着抖
      const lilyTopRaw = i => lilies[i].y - 26;
      const frogBaseRaw = i => lilies[i].y - 28;
      const k = state.jumping.active ? Math.min(state.jumping.t / 0.55, 1) : 0;
      let fx, fy;
      if (state.jumping.active) {
        fx = interpolateJump(state.jumping.t);
        fy = frogBaseRaw(i0) + (frogBaseRaw(i1) - frogBaseRaw(i0)) * k - jumpArc(state.jumping.t);
      } else {
        fx = lilies[i0].x;   // 荷叶正中心（叶脉交点）
        fy = frogBase(i0) + Math.sin(t * 2.2) * 2;
      }
      // 阴影：贴荷叶/水面，随跳跃高度缩小
      ctx.save();
      ctx.globalAlpha = 0.2 * (1 - 0.55 * Math.sin(k * Math.PI));
      ctx.fillStyle = "#1d6f86";
      ctx.beginPath();
      const shadowY = state.jumping.active
        ? (lilyTopRaw(i0) + 2) + (lilyTopRaw(i1) - lilyTopRaw(i0)) * k
        : lilyTop(i0) + 2;
      ctx.ellipse(fx, shadowY,
                 24 * (1 - 0.4 * Math.sin(k * Math.PI)), 9 * (1 - 0.4 * Math.sin(k * Math.PI)), 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
      ctx.save();
      ctx.translate(fx, fy);
      ctx.filter = p.frog;
      PondEffects.frogEllipses.forEach(shape => paintEllipse(...shape));
      const mouth = PondEffects.frogMouth;
      ctx.strokeStyle = mouth.color;
      ctx.lineWidth = mouth.width;
      ctx.beginPath();
      ctx.moveTo(...mouth.start);
      ctx.quadraticCurveTo(...mouth.curve);
      ctx.stroke();
      ctx.restore();
    }

    function paintEllipse(x, y, rx, ry, color) {
      ctx.fillStyle = color;
      ctx.beginPath();
      ctx.ellipse(x, y, rx, ry, 0, 0, Math.PI * 2);
      ctx.fill();
    }

    function drawSplashes() {
      state.splashes.forEach(p => {
        if (p.t < 0) return;
        const shape = PondEffects.rippleStyle(p);
        ctx.save();
        ctx.globalAlpha = shape.opacity;
        ctx.strokeStyle = "#fff";
        ctx.lineWidth = shape.width;
        ctx.beginPath();
        ctx.ellipse(p.x, p.y, shape.rx, shape.ry, 0, 0, Math.PI * 2);
        ctx.stroke();
        ctx.restore();
      });
    }

    function drawDroplets() {
      ctx.save();
      state.droplets.forEach(p => {
        const shape = PondEffects.dropletStyle(p);
        ctx.globalAlpha = shape.opacity;
        paintEllipse(p.x, p.y, shape.rx, shape.ry, "#fff");
      });
      ctx.restore();
    }

    function drawPopups() {
      state.popups.forEach(p => {
        const k = p.t / 1.2;
        ctx.save();
        ctx.globalAlpha = 1 - k;
        ctx.font = "900 30px 'PingFang SC', sans-serif";
        ctx.textAlign = "center";
        ctx.fillStyle = "#fff4d8";
        ctx.strokeStyle = "#23373a";
        ctx.lineWidth = 4;
        ctx.strokeText(p.text, p.x, p.y - k * 26);
        ctx.fillText(p.text, p.x, p.y - k * 26);
        ctx.restore();
      });
    }

    function updateMeters() {
      const energy = Math.round(state.energy);
      const shown = Math.round(state.norm ?? (state.fused ?? state.focus) * 100);
      const focus = $("focus-readout");
      const label = state.stale ? "—" : String(shown);
      if (focus.textContent !== label) focus.textContent = label;
      const readout = $("energy-readout");
      if (readout.textContent !== energy + "%") readout.textContent = energy + "%";
      $("energy-fill").style.transform = "scaleX(" + state.energy / 100 + ")";
      const window = state.jumpWindow;
      const zone = $("energy-zone");
      zone.hidden = !window;
      if (window) {
        zone.style.left = window.lo + "%";
        zone.style.width = (window.hi - window.lo) + "%";
      }
    }

    function interpolateJump(tt) {
      const from = lilies[state.cur].x;
      const to = lilies[state.cur + 1].x;
      const k = Math.min(tt / 0.55, 1);
      return from + (to - from) * k;
    }
    function jumpArc(tt) {
      const k = Math.min(tt / 0.55, 1);
      return Math.sin(k * Math.PI) * 74;
    }

    function roundRect(ctx, x, y, w, h, r) {
      ctx.beginPath();
      ctx.moveTo(x + r, y);
      ctx.arcTo(x + w, y, x + w, y + h, r);
      ctx.arcTo(x + w, y + h, x, y + h, r);
      ctx.arcTo(x, y + h, x, y, r);
      ctx.arcTo(x, y, x + w, y, r);
      ctx.closePath();
    }

    // ---- 开局倒数 / 结算转场 ----
    // 与池塘同一套语言：青蛙蹲在荷叶上、涟漪一圈圈散开、暖白卡片配青绿渐变数字。
    // 倒数期间 state.introOpen 冻结计时、蓄力与判定，只让背景的云和水继续呼吸。
    const startCue = $("start-cue");
    const endCue = $("end-cue");
    let startCueState = "idle";   // idle | pending | playing | done
    let startCueTimers = [];
    let endCueTimer = null;

    function replayClass(el, cls) {
      if (!el) return;
      el.classList.remove(cls);
      void el.offsetWidth;   // 强制回流，让同一个元素能重新播放动画
      el.classList.add(cls);
    }

    function cueCount(cue, text, go = false) {
      if (!cue) return;
      const num = cue.querySelector(".cue-count");
      num.textContent = text;
      num.classList.toggle("go", go);
      replayClass(num, "pop");
      replayClass(cue.querySelector(".cue-halo"), "pop");
    }

    function requestStartCue() {
      if (startCueState === "playing" || startCueState === "done") return;
      if (!state.session) { startCueState = "pending"; return; }
      if (!startCue) { startCueState = "done"; return; }
      startCueState = "playing";
      state.introOpen = true;
      state.lastTs = null;
      const sub = startCue.querySelector(".cue-sub");
      const dots = Array.from(startCue.querySelectorAll(".cue-dots i"));
      $("lamp-text").textContent = "准备中";
      $("warn").classList.remove("show");   // 倒数期间不显示“正在等待信号”
      startCue.classList.remove("leaving");
      startCue.classList.add("show");
      startCue.setAttribute("aria-hidden", "false");

      startCueTimers.forEach(clearTimeout);
      startCueTimers = [
        ["3", "坐稳，慢慢吸一口气"],
        ["2", "眼睛看向池塘，肩膀放松"],
        ["1", "小蛙要跳了，跟着它一起专注"],
      ].map(([n, tip], i) => setTimeout(() => {
        cueCount(startCue, n);
        sub.textContent = tip;
        dots.forEach((d, j) => d.classList.toggle("on", j <= i));
      }, i * 1000));

      startCueTimers.push(setTimeout(() => {
        cueCount(startCue, "开始！", true);
        sub.textContent = "专注的时候，小蛙就会往前跳";
        dots.forEach(d => d.classList.add("on"));
      }, 3000));

      startCueTimers.push(setTimeout(() => startCue.classList.add("leaving"), 3760));
      startCueTimers.push(setTimeout(() => {
        startCue.classList.remove("show", "leaving");
        startCue.setAttribute("aria-hidden", "true");
        state.introOpen = false;
        state.lastTs = null;
        startCueState = "done";
      }, 4220));
    }

    function cancelStartCue() {
      startCueTimers.forEach(clearTimeout);
      startCueTimers = [];
      startCueState = "done";
      state.introOpen = false;
      if (!startCue) return;
      startCue.classList.remove("show", "leaving");
      startCue.setAttribute("aria-hidden", "true");
    }

    function showEndCue() {
      if (!endCue) return Promise.resolve();
      const score = state.score;
      const jumps = state.actions.timed_jumps + state.actions.automatic_jumps;
      const played = Math.max(0, Math.round(state.totalSec - Math.max(0, state.timeLeft)));
      endCue.querySelector(".cue-score b").textContent = score;
      endCue.querySelector(".cue-jumps b").textContent = jumps;
      endCue.querySelector(".cue-time b").textContent = formatClock(played);
      endCue.querySelector(".cue-sub").textContent =
        score >= 10 ? "小蛙跳得又稳又远，这一局真棒！"
          : score >= 4 ? "小蛙跟着你的专注往前跳了好几步。"
          : score > 0 ? "小蛙出发啦，下次再陪它走远一点。"
          : "这次小蛙还没出发，慢慢来，我们再来一次。";
      endCue.classList.remove("leaving");
      endCue.classList.add("show");
      endCue.setAttribute("aria-hidden", "false");
      // 结算至少展示 1.8 秒；保存请求与动画并行，报告页不会突兀地跳出来
      return new Promise(resolve => {
        clearTimeout(endCueTimer);
        endCueTimer = setTimeout(resolve, 1800);
      });
    }

    function hideEndCue() {
      clearTimeout(endCueTimer);
      if (!endCue) return;
      endCue.classList.remove("show", "leaving");
      endCue.setAttribute("aria-hidden", "true");
    }

    // ---- 结束 ----
    function showGameError(message, label, retry = () => location.reload()) {
      state.over = true;
      state.es?.close();
      cancelStartCue();
      hideEndCue();
      $("tutorial").classList.add("hidden");
      $("warn").classList.remove("show");
      const error = $("game-error");
      error.textContent = message;
      error.classList.remove("hidden");
      const button = $("btn-retry");
      button.textContent = label;
      button.onclick = retry;
      button.classList.remove("hidden");
      button.focus();
    }

    async function finishGame() {
      if (state.saving || state.leaving) return;
      state.over = true;
      state.saving = true;
      if (state.es) state.es.close();
      $("btn-retry").classList.add("hidden");
      $("game-error").classList.add("hidden");
      $("warn").textContent = "正在保存本局结果…";
      $("warn").classList.add("show");
      const sessionId = state.session.id;
      const ending = showEndCue();   // 结算转场与保存并行，节省等待
      try {
        const playedSec = state.totalSec - Math.max(0, state.timeLeft);
        await API.post(`/api/session/${sessionId}/finish`, {
          score: state.score,
          actions: state.actions,
          demo,
          played_sec: playedSec,
          notes: "完整一局（" + formatClock(state.totalSec) + "）",
        });
        state.session = null;
        // 完整玩完一局 → 计入「专注小达人」时长与当天打卡（试玩/演示不计入）
        if (!developerRun && !state.achievementsRecorded) {
          state.achievementsRecorded = true;
          Achievements.recordSession({ playedSec: playedSec });
        }
        await ending;   // 至少让结束动画完整播完，再进报告页
        if (!state.leaving) location.href = "report.html?id=" + sessionId;
      } catch (e) {
        hideEndCue();
        if (!state.leaving) showGameError("保存结果失败：" + e.message, "重试保存", finishGame);
      } finally {
        state.saving = false;
      }
    }

    $("btn-quit").addEventListener("click", () => { location.href = developerRun ? "dev.html" : "index.html"; });
    window.addEventListener("pagehide", () => {
      state.leaving = true;
      state.es?.close();
      if (state.session && !state.saving) API.endAbandonedSession(state.session.id);
    });
    window.addEventListener("pageshow", event => {
      if (event.persisted) location.reload();
    });

    // 校准后的第一次开局：先讲一遍玩法，讲完就不再出现
    (function setupTutorial() {
      const box = $("tutorial");
      const okBtn = $("tutorial-ok");
      if (!box || !okBtn) return;
      let done = false;
      const tutorialStorage = developerRun ? sessionStorage : localStorage;
      const tutorialKey = developerRun ? "bf-dev-tutorial-done" : "bf-tutorial-done";
      try { done = tutorialStorage.getItem(tutorialKey) === "1"; } catch (_) {}
      if (!done && calib && (demo || !calibExpired)) {
        box.classList.remove("hidden");
        state.tutorialOpen = true;
      }
      okBtn.addEventListener("click", () => {
        box.classList.add("hidden");
        state.tutorialOpen = false;
        try { tutorialStorage.setItem(tutorialKey, "1"); } catch (_) {}
        requestStartCue();   // 教学层关掉后才开始倒数
      });
    })();

    // 分辨率适配：首帧绘制前先算一次，窗口尺寸或缩放变化时重算
    fitCanvas();
    window.addEventListener("resize", fitCanvas);
    window.addEventListener("orientationchange", fitCanvas);
    window.addEventListener("pageshow", fitCanvas);
    // 容器宽度变化（窗口缩放以外的情形）同样要重新适配，否则画布会被再次拉伸
    if (window.ResizeObserver) new ResizeObserver(fitCanvas).observe(canvas);

    init().catch(e => {
      if (!state.leaving) showGameError("游戏启动失败：" + e.message, "重试启动");
    });
  </script>
  <script src="assets/music.js" defer></script>
</body>
</html>
