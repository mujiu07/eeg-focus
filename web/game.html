<!DOCTYPE html>
<html lang="zh-CN" data-sky="day">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>专注小蛙 - 游戏</title>
  <link rel="stylesheet" href="assets/style.css">
  <link rel="stylesheet" href="assets/vinyl.css">
  <style>
    .canvas-wrap { position: relative; width: 100%; max-width: 900px; }
    #game-canvas {
      display: block; width: 100%; height: auto;
      /* 首帧绘制前先铺一层与当前天空模式一致的底色，避免白天/黑夜闪一下 */
      background: linear-gradient(180deg, var(--sky-top) 0%, var(--sky-mid) 34%, var(--sky-low) 62%, var(--water-top) 100%);
      box-shadow: var(--shadow-soft);
      border: 3px solid rgba(255,255,255,.75);
    }
    .hud { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
    .hud-item {
      display: inline-flex; align-items: center; gap: 10px;
      padding: 11px 22px; border-radius: 999px;
      font-weight: 800; font-size: 19px;
    }
    html[data-sky] .hud-item {
      color: #f7f6ed;
      background: #23373a;
      border: 1px solid #54716b;
      box-shadow: none;
    }
    .hud-item .icon { font-size: 22px; }
    /* 心率：图标按实际 BPM 节律跳动，低采样率数据过期时自动停下 */
    #hr-hud .icon { display: inline-block; transform-origin: 50% 60%; }
    #hr-hud.beat .icon { animation: hrBeat 1s ease-in-out infinite; }
    #hr-hud.stale { color: #bdcfcb; }
    @keyframes hrBeat {
      0%, 100% { transform: scale(1); }
      16% { transform: scale(1.22); }
      34% { transform: scale(1); }
    }
    .game-meters {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 8px 20px;
      width: min(100%, 900px);
      padding: 12px 16px;
      border-radius: 14px;
      color: #f7f6ed;
      background: #23373a;
      font-size: 15px;
      font-variant-numeric: tabular-nums;
    }
    .energy-track {
      position: relative;
      grid-column: 1 / -1;
      height: 10px;
      border-radius: 8px;
      background: #4e6666;
    }
    #energy-fill, #energy-zone {
      position: absolute;
      height: 100%;
      border-radius: inherit;
    }
    #energy-fill {
      width: 100%;
      background: #83c5aa;
      transform: scaleX(0);
      transform-origin: left center;
    }
    #energy-zone { border: 2px solid #ffda86; background: rgba(255, 218, 134, .18); }
    .game-guidance {
      width: 100%;
      max-width: 900px;
      text-align: center;
      color: var(--ink);
      font-size: 14px;
      line-height: 1.5;
      padding: 10px 14px;
      border-radius: 14px;
      background: var(--card);
    }
    .game-guidance p { margin: 0; }
    .warn-banner {
      min-height: 1.5em;
      font-weight: 700;
      visibility: hidden;
    }
    .warn-banner.show { visibility: visible; }

    /* 首次上手教学 */
    .tutorial {
      position: absolute; inset: 0; z-index: 30;
      display: flex; align-items: center; justify-content: center;
      background: rgba(10, 40, 48, .34);
      -webkit-backdrop-filter: blur(3px); backdrop-filter: blur(3px);
      border-radius: 20px;
    }
    .tutorial.hidden { display: none; }
    .tutorial-card {
      background: #fff9ee; color: #263b33; border-radius: 20px; padding: 20px 24px;
      width: calc(100% - 40px); max-width: 400px;
      box-shadow: 0 20px 50px rgba(20, 60, 70, .26);
      text-align: left;
    }
    .tutorial-card h3 { margin: 0 0 10px; font-size: 17px; color: #263b33; }
    .tutorial-card ol { margin: 0 0 16px; padding-left: 20px; }
    .tutorial-card li {
      margin: 7px 0; font-size: 14.5px; line-height: 1.55; color: #38524a;
    }
    .tut-gold { color: #795219; }

    @media (max-width: 560px) {
      .canvas-wrap { display: flex; flex-direction: column; }
      .tutorial {
        position: static;
        order: -1;
        margin-bottom: 12px;
        background: none;
        backdrop-filter: none;
      }
      .tutorial-card { width: 100%; padding: 16px; }
      .hud { justify-content: center; }
      .hud-item { gap: 6px; padding: 7px 10px; font-size: 15px; }
      .hud-item .icon { font-size: 17px; }
    }

    /* 非 macOS 不显示心率 HUD（心率采集依赖 macOS 的 hrd 进程） */
    html[data-heart="off"] #hr-hud { display: none !important; }
  </style>
  <link rel="stylesheet" href="assets/sky.css">
  <script src="assets/sky.js"></script>
  <script>
    // 顺带缓存到 localStorage，下一次进入游戏页就能同步判断，不会闪出心率 HUD
    try {
      if (localStorage.getItem("bf-heart-ok") === "0") document.documentElement.dataset.heart = "off";
    } catch (_) {}
    fetch("/api/env").then(r => r.json()).then(env => {
      try { localStorage.setItem("bf-heart-ok", env.heart_supported ? "1" : "0"); } catch (_) {}
      if (!env.heart_supported) {
        document.documentElement.dataset.heart = "off";
        try { localStorage.setItem("bf-heart", "off"); } catch (_) {}
      }
    }).catch(() => {});
  </script>
</head>
<body>
  <div class="bubbles"><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
  <div class="sky-veil sky-veil--dawn" aria-hidden="true"></div>
  <div class="sky-veil sky-veil--dusk" aria-hidden="true"></div>
  <div class="sky-veil sky-veil--night" aria-hidden="true"></div>

  <div class="wrap">
    <div class="page-skybar">
      <span class="page-skybar-label">🎨 页面配色</span>
      <div class="sky-switch" id="sky-switch" role="group" aria-label="天空模式">
        <button type="button" class="sky-opt" data-mode="dawn" aria-pressed="false" title="黎明模式"><span aria-hidden="true">🌄</span>黎明</button>
        <button type="button" class="sky-opt" data-mode="day" aria-pressed="false" title="白天模式"><span aria-hidden="true">☀️</span>白天</button>
        <button type="button" class="sky-opt" data-mode="dusk" aria-pressed="false" title="傍晚模式"><span aria-hidden="true">🌇</span>傍晚</button>
        <button type="button" class="sky-opt" data-mode="night" aria-pressed="false" title="黑夜模式"><span aria-hidden="true">🌙</span>黑夜</button>
        <button type="button" class="sky-opt" data-mode="auto" aria-pressed="false" title="跟随系统时间（日出日落）"><span aria-hidden="true">🌗</span>跟随时间</button>
      </div>
    </div>
    <div class="card" style="padding:16px 22px">
      <div class="hud">
        <span class="hud-item" id="lamp"><span class="lamp-dot"></span><span id="lamp-text">专注中</span></span>
        <span class="hud-item"><span>剩余</span><span id="timer" style="min-width:5.5ch;text-align:center">01:00</span></span>
        <span class="hud-item" id="hr-hud" title="心率（辅助信号，低采样率）">
          <span class="icon" id="hr-icon">♥</span><span id="hr-bpm" style="min-width:2.5ch;text-align:center">--</span><span style="font-size:13px;opacity:.6;font-weight:700">BPM</span>
        </span>
        <span class="hud-item"><span>得分</span><span id="score" style="color:#ffda86;min-width:2ch;text-align:center">0</span></span>
      </div>
    </div>

    <div class="game-meters">
      <div>信号分数 <strong id="focus-readout">—</strong></div>
      <div>蓄力 <strong id="energy-readout">0%</strong></div>
      <div class="energy-track" aria-hidden="true">
        <div id="energy-fill"></div><div id="energy-zone"></div>
      </div>
    </div>
    <div class="canvas-wrap">
      <canvas id="game-canvas" width="900" height="460"></canvas>

      <div class="tutorial hidden" id="tutorial">
        <div class="tutorial-card">
          <h3>玩法</h3>
          <ol>
            <li>下方能量条涨到 <b class="tut-gold">金色区间</b> 时，点击池塘或按空格，青蛙就会起跳。</li>
            <li>走神的时候进度会停住，<b>不会往回退</b>，慢慢来就好。</li>
          </ol>
          <button class="btn btn-primary" id="tutorial-ok" type="button">开始玩</button>
        </div>
      </div>
    </div>

    <div class="game-guidance">
      <p id="replay-label" class="hidden">脑电数据回放 · 使用已录制的心算信号</p>
      <p>蓄力进入金色区间后，点击池塘或按空格起跳。</p>
      <p class="warn-banner" id="warn">注意力飘走了，慢慢来</p>
    </div>

    <div class="card hidden" id="manual-card">
      <div class="section-title" style="margin-bottom:6px"><span class="dot"></span>手动模拟模式</div>
      <div class="slider-row" style="display:flex;gap:16px;align-items:center">
        <span style="font-weight:700">放松</span>
        <input type="range" id="manual-slider" min="0" max="100" value="30" style="flex:1">
        <span style="font-weight:700">专注</span>
      </div>
      <p class="hint" style="font-size:13.5px;margin-top:10px">
        演示用滑块：<strong>拉到右边</strong>青蛙会一直前进，<strong>拉到左边</strong>就停下来。正式游戏不需要它。
      </p>
    </div>

    <div class="btn-row">
      <button id="btn-quit" class="btn btn-ghost">退出游戏</button>
    </div>
  </div>

  <script src="assets/api.js"></script>
  <script>
    const $ = id => document.getElementById(id);
    const canvas = $("game-canvas");
    const ctx = canvas.getContext("2d");

    // ---- 天空主题：与首页（index.html）共用 sky.js 里的同一份色板 ----
    // 黎明 / 白天 / 傍晚 / 黑夜切换时，画布的天空、日月星、云、远山、水面、
    // 水面反光与荷叶明度都会跟着重绘，和初始界面的梦境池塘保持一致。
    function theme() {
      return window.SkyTheme ? SkyTheme.palette(SkyTheme.sky()) : SkyThemeFake;
    }
    const SkyThemeFake = {
      sky: ["#dff4fb", "#c9edf4", "#b3e3e8"],
      water: ["#9fd8e2", "#6fb8c9"],
      hills: ["rgba(201, 233, 223, .86)", "rgba(179, 221, 214, .92)"],
      trees: "rgba(88, 178, 128, .8)",
      waves: 1,
      cloud: { fill: "rgba(255, 255, 255, .92)", alpha: .88 },
      mist: { color: "255, 233, 216", alpha: 0 },
      glow: null,
      sun: { x: 828, y: 62, core: "#ffdf8e", mid: "#ffe9b8", halo: "#ffe9b8" },
      moon: null,
      stars: false,
      flora: "none",
      frog: "none",
      energy: ["#8fe3a0", "#2f9c93"],
      hud: { pill: "rgba(255, 255, 255, .92)", ink: "#23464f", inkSoft: "rgba(35, 70, 79, .75)" },
    };

    // 星图：固定随机种子，每次打开位置一致；避开月亮周围留出干净的月光
    const stars = (function () {
      let seed = 20261112;
      const rnd = () => {
        seed = (seed * 1664525 + 1013904223) % 4294967296;
        return seed / 4294967296;
      };
      const out = [];
      for (let i = 0; i < 76; i++) {
        const x = 14 + rnd() * 872;
        const y = 8 + rnd() * 174;
        if (Math.pow(x - 808, 2) + Math.pow(y - 66, 2) < 52 * 52) continue;
        out.push({ x, y, r: 0.6 + rnd() * 1.5, ph: rnd() * Math.PI * 2, sp: 0.5 + rnd() * 1.1 });
      }
      return out;
    })();

    // ---- 会话与基线 ----
    // 校准基线有效期 1 小时：有效期内刷新/关闭页面都无需重新校准；
    // 过期（或从未校准）时不允许用旧基线开局，先回校准页。
    const demo = new URLSearchParams(location.search).get("demo") === "1";
    const calibInfo = Store.calibInfo();
    const calib = demo ? { baseline: 0.55 } : calibInfo.calib;
    const prev = Store.load();
    const baseline = calib ? calib.baseline : 0.4;
    const calibExpired = calibInfo.expired;
    if (!calib) {
      Store.clearCalib();
      toast(calibExpired ? "校准已超过 1 小时，需要再校准一次" : "先做一次校准，让青蛙认识你的状态");
      setTimeout(() => {
        location.replace(calibExpired ? "calibrate.html?reason=expired" : "calibrate.html");
      }, 1200);
    }

    // ---- 本局时长（开始前由首页弹窗选择：game.html?sec=180）----
    const DURATION_MIN_SEC = 60;
    const DURATION_MAX_SEC = 3600;
    function readDurationSec() {
      const raw = new URLSearchParams(location.search).get("sec")
                || localStorage.getItem("bf-duration-sec");
      const n = Math.round(Number(raw));
      if (!Number.isFinite(n) || n <= 0) return 60;
      return Math.min(DURATION_MAX_SEC, Math.max(DURATION_MIN_SEC, n));
    }
    const totalSec = readDurationSec();

    // 计时显示：始终 mm:ss，避免 10 分钟时数字过长
    function formatClock(sec) {
      const s = Math.max(0, Math.ceil(sec));
      const m = Math.floor(s / 60);
      const r = s % 60;
      return String(m).padStart(2, "0") + ":" + String(r).padStart(2, "0");
    }

    const state = {
      session: null, es: null,
      focus: baseline, raw: baseline,
      fused: baseline,     // 融合分：心率新鲜时按权重修正，否则等于 focus
      norm: null,          // 后端 20–80 动态分（0–100），游戏判定与显示都用它
      scoreSmooth: null,   // 平滑后的分数：避免单帧抖动让判定反复横跳
      focusOn: false,      // 滞回后的“在状态”开关
      tutorialOpen: false, // 首次上手的教学层是否打开
      jumpWindow: null,    // 金色起跳区间 {lo,hi}（能量百分比）：在区间内点击可提前起跳
      actions: { timed_jumps: 0, automatic_jumps: 0 },
      bpm: null, hrValid: false, hrMode: "off",
      energy: 0,
      score: 0,
      totalSec,
      timeLeft: totalSec,
      lastTs: null,
      stale: false,       // 数据无效/断流：暂停蓄力
      lastFrameTs: 0,     // 最近一次有效帧时间（新鲜度检查）
      over: false,
      manualMode: false,
      jumping: { active: false, t: 0, fromX: 0, toX: 0 },
      cur: 0,           // 青蛙当前所在荷叶在 lilies 中的下标
      pendingSettle: false,  // 落地后等待水花散尽、荷叶上浮稳定，再开始平移
      settling: false,  // 跳完后青蛙与荷叶一起平滑移回屏幕中间
      popups: [],     // 浮动文字 {x,y,text,t}
      splashes: [],   // 水花涟漪 {x,y,r0,r1,t,life}
      clouds: [
        { x: 120, y: 52, s: 1.0, v: 8, phase: 0.6 },
        { x: 520, y: 38, s: 0.8, v: 12, phase: 2.4 },
        { x: 780, y: 72, s: 0.62, v: 6, phase: 4.1 },
      ],
    };

    $("timer").textContent = formatClock(state.totalSec);

    // 荷叶布局（青蛙等待位固定在屏幕中间 cx=450：当前荷叶中心 = cx）
    let lilies = [];
    const CX = canvas.width / 2;
    function resetLilies() {
      const n = 6;
      lilies = [];
      state.cur = 0;
      let x = CX;   // 青蛙初始位置 = 荷叶正中心（叶脉交点）
      for (let i = 0; i < n; i++) {
        lilies.push({ x, y: 340 - (i % 2) * 26, bob: Math.random() * Math.PI * 2, dip: 0, dipVel: 0 });
        x += 170 + (i * 37) % 40;
      }
    }
    // 前方补一片新荷叶（落在最右侧荷叶的右边）
    function addLily() {
      const last = lilies[lilies.length - 1];
      lilies.push({
        x: last.x + 170 + Math.random() * 60,
        y: last.y === 340 ? 314 : 340,
        bob: Math.random() * Math.PI * 2,
        dip: 0, dipVel: 0,
      });
    }
    resetLilies();
    // 第一次跳给一个更早的窗口，别让孩子干等到满格
    state.jumpWindow = { lo: 22, hi: 36 };
    const reducedMotion = matchMedia("(prefers-reduced-motion: reduce)");

    // ---- 创建会话 ----
    async function init() {
      if (!calib) return;   // 无有效校准：已在上面安排跳转回校准页，不创建会话
      const prevMode = prev && prev.source ? prev.source.mode : null;
      // heart：仅心率玩法，没有脑电信号，判定完全来自心率分量
      const mode = demo ? "manual" : ["manual", "hardware", "heart"].includes(prevMode) ? prevMode : "replay";
      // 心率辅助源：?heart=hrd|mock 或 localStorage 的 bf-heart 决定是否接入；
      // 未开启时整个链路保持纯 EEG，HUD 显示 "--"。
      let heartMode = (new URLSearchParams(location.search).get("heart")
        || localStorage.getItem("bf-heart") || "off").toLowerCase();
      // 仅心率模式不能关心率，否则整局没有可用信号
      if (mode === "heart" && !["hrd", "mock", "csv"].includes(heartMode)) heartMode = "hrd";
      const heartRest = Number(localStorage.getItem("bf-heart-rest")) || null;
      const heartWeight = Number(localStorage.getItem("bf-heart-weight")) || 0.15;
      // baseline 必须随会话一起上报：报告页的橙色虚线与"高于基线占比"都依赖它
      let body = { mode, baseline: calib.baseline };
      // 动态定标区间随会话带上：校准页把「最放松/最专注」映射成 20/80
      if (calib.range && calib.range.low != null && calib.range.high != null) {
        body.score_low = calib.range.low;
        body.score_high = calib.range.high;
      }
      if (!demo && ["hrd", "mock", "csv"].includes(heartMode)) {
        body.heart_mode = heartMode;
        if (heartRest) body.heart_rest_bpm = heartRest;
        body.heart_weight = heartWeight;
      }
      if (mode === "replay") {
        const pairs = await API.replayPairs();
        const calibFile = prev?.source?.file;
        const pair = pairs.find(({ rest }) => rest.path.split(/[/\\]/).pop() === calibFile);
        if (!pair) throw new Error("找不到本次校准对应的心算回放，请返回校准页重新选择信号源");
        body.file = pair.task.path;
      } else if (mode === "hardware") {
        body.osc_ports = (prev && prev.source && prev.source.osc_ports) || null;
      }
      const res = await API.post("/api/session", body);
      state.session = { id: res.session_id, mode, osc_ports: body.osc_ports || null };
      $("replay-label").textContent = demo ? "无设备试玩 · 滑块控制信号" : describeSignal(res.source);
      $("replay-label").classList.toggle("hidden", !demo && mode !== "replay");
      state.manualMode = mode === "manual";
      if (demo) {
        await API.post(`/api/session/${res.session_id}/manual`, { focus: 0.8 });
        $("manual-slider").value = "80";
      }
      $("manual-card").classList.toggle("hidden", !state.manualMode);

      state.es = API.stream(res.session_id, {
        onHello() { state.lastFrameTs = performance.now(); },
        onFrame(f) {
          state.lastFrameTs = performance.now();
          if (f.meta && f.meta.error) { state.stale = true; return; }  // 异常帧：显式无效
          state.stale = false;
          state.focus = f.focus; state.raw = f.raw;
          // 融合分：心率新鲜时后端已按权重修正；缺失/过期时与 focus 完全一致
          state.fused = (f.focus_fused != null) ? f.focus_fused : f.focus;
          state.norm = (f.score != null) ? f.score : null;
          if (f.hr) {
            state.bpm = f.hr.bpm;
            state.hrValid = !!f.hr.valid;
            state.hrMode = f.hr.mode || "off";
          }
        },
        onEnd() { finishGame(); },
        onError() { state.stale = true; },
        onStatus(s) { if (s === "reconnecting") state.stale = true; },
      });

      requestAnimationFrame(loop);
    }

    // ---- 手动模式 ----
    $("manual-slider").addEventListener("input", async e => {
      const v = e.target.value / 100;
      state.focus = v; state.raw = v;
      if (state.session) await API.post(`/api/session/${state.session.id}/manual`, { focus: v });
    });

    // 点击/空格：先判目标，再判起跳窗口
    canvas.addEventListener("pointerdown", tryJumpTap);
    window.addEventListener("keydown", e => {
      if (e.target.closest?.("button, input, select, textarea, a[href]")) return;
      if (e.code === "Space" || e.code === "Enter") {
        e.preventDefault();
        tryJumpTap();
      }
    });

    // ---- 游戏主循环 ----
    function loop(ts) {
      if (state.over) return;
      const dt = state.lastTs ? Math.min((ts - state.lastTs) / 1000, 0.05) : 0.016;
      state.lastTs = ts;
      updateGame(dt);
      draw(ts);
      requestAnimationFrame(loop);
    }

    function updateGame(dt) {
      if (state.tutorialOpen) return;   // 教学层打开时先不跑游戏逻辑
      // 云漂移（到屏幕右侧完全离开后再回到左侧，避免边缘处突然消失/出现）
      state.clouds.forEach(c => {
        c.x += c.v * dt;
        if (c.x > canvas.width + 80) c.x = -90;
      });

      // 水花/浮字更新
      state.splashes = state.splashes.filter(p => (p.t += dt) < p.life);
      state.popups = state.popups.filter(p => (p.t += dt) < 1.2);
      // 荷叶下沉/上浮（弹簧阻尼）：dip > 0 沉入水面，dip < 0 回弹上浮
      updateLilyDips(dt);

      // 主动任务 1：错过窗口就顺延到能量前方，孩子始终有下一个可追的目标
      if (state.jumpWindow && !state.jumping.active && !state.settling && !state.pendingSettle
          && state.energy > state.jumpWindow.hi + 1.5) {
        const lo = Math.min(94, state.energy + 2);
        state.jumpWindow = { lo, hi: Math.min(99, lo + 11) };
      }

      // 数据新鲜度：超过 3 秒无有效帧 → 视为断流，暂停蓄力（旧分数不得继续驱动游戏）
      if (performance.now() - state.lastFrameTs > 3000) state.stale = true;

      // 动态分：后端把校准得到的 20/80 两端换算好，50 分就是专注线
      const scoreNow = (state.norm != null)
        ? state.norm
        : ((state.fused != null ? state.fused : state.focus) * 100);
      // 判定放宽：先平滑，再用滞回——到 45 分算“跟上”，掉到 38 分以下才算飘走。
      // 这样在 50 分线附近轻微波动时不会来回闪烁。
      if (state.scoreSmooth == null) state.scoreSmooth = scoreNow;
      state.scoreSmooth += (scoreNow - state.scoreSmooth) * Math.min(1, dt * 3.2);
      if (!state.focusOn) {
        if (state.scoreSmooth >= 45) state.focusOn = true;
      } else if (state.scoreSmooth < 38) {
        state.focusOn = false;
      }
      const focused = !state.stale && state.focusOn;
      // 蓄力：跳跃中与平移中不蓄力；落地后等待水花/上浮的这段时间仍可蓄力
      if (!state.jumping.active && !state.settling && !state.pendingSettle && !state.stale) {
        if (focused) {
          const gain = (state.scoreSmooth - 42) * dt * 0.16;
          state.energy = Math.min(100, state.energy + gain);
        }
        // 分心时不回退蓄力，只停止增长。时间仍在走，少跳几次本身就是代价，
        // 不需要再让进度条往下掉——那只会让孩子觉得“白练了”。
      }

      if (state.pendingSettle) {
        // 等水花和涟漪全部散尽、新荷叶回弹上浮停稳，再开始平移
        const l = lilies[state.cur];
        const calm = Math.abs(l.dip || 0) < 0.4 && Math.abs(l.dipVel || 0) < 2;
        if (!state.splashes.length && calm) {
          state.pendingSettle = false;
          state.settling = true;
        }
      } else if (state.jumping.active) {
        state.jumping.t += dt;
        if (state.jumping.t >= 0.55) {
          const landing = lilies[state.cur + 1];   // 目标荷叶
          state.jumping.active = false;
          state.cur += 1;                          // 青蛙落到下一片，旧荷叶保留在左侧
          if (!lilies[state.cur + 1]) addLily();   // 前方始终留一片下一跳的荷叶
          state.energy = 15;
          rollJumpWindow();                        // 新一跳重新给一个金色窗口
          // 落地：新荷叶被压得下沉一截，四周溅起水花，随后回弹上浮
          dipLily(landing, 95);
          spawnLandingSplash(landing.x, landing.y + 6);
          // 先等特效结束、上浮稳定，再平移（见 pendingSettle 分支）
          state.pendingSettle = true;
        }
      } else if (state.settling) {
        // 平移：所有荷叶同步左移，直到当前荷叶中心回到 CX（青蛙回中间）
        // 旧荷叶随场景移出，完全离开画面后回收。
        const cur = lilies[state.cur];
        const dist = cur.x - CX;
        if (dist <= 0.5) {
          cur.x = CX;   // 精确归位：青蛙正中心回到屏幕中间
          state.settling = false;
        } else {
          const step = Math.min(dist, Math.max(24 * dt, dist * dt * 4));
          lilies.forEach(l => { l.x -= step; });
          while (state.cur > 0 && lilies[0].x < -60) {
            lilies.shift();
            state.cur -= 1;
          }
        }
      } else if (!state.stale && state.energy >= 100) {
        startJump();
      }

      const lamp = $("lamp");
      lamp.classList.toggle("lamp-on", focused);

      // 心率 HUD：只在读数新鲜时跳动；过期/未接入显示 "--" 并降低存在感
      const hrHud = $("hr-hud");
      if (state.hrValid && state.bpm) {
        $("hr-bpm").textContent = Math.round(state.bpm);
        hrHud.classList.add("beat");
        hrHud.classList.remove("stale");
        $("hr-icon").style.animationDuration =
          Math.min(1.5, Math.max(0.4, 60 / state.bpm)) + "s";
      } else {
        $("hr-bpm").textContent = "--";
        hrHud.classList.remove("beat");
        hrHud.classList.add("stale");
      }
      $("lamp-text").textContent = state.stale ? "信号中断" : (focused ? "跟上了" : "飘走了");
      // 提示条：断流、或“正在蓄力但分心”。跳跃/平移期间本来就不蓄力，不算分心。
      const charging = !state.jumping.active && !state.settling && !state.pendingSettle && !state.stale;
      $("warn").classList.toggle("show", state.stale || (charging && !focused));
      $("warn").textContent = state.stale ? "数据中断，先停一下" : "注意力飘走了，慢慢来";

      state.timeLeft -= dt;
      $("timer").textContent = formatClock(state.timeLeft);
      if (state.timeLeft <= 0) finishGame();
    }

    // ---- 主动任务：金色起跳窗口 + 变化监测 ----
    // 原先是全自动跳，孩子只要“看着”，十几秒后注意就飘了，测到的其实是“无事可做”。
    // 这两件事给了必须持续盯住的落点：等窗口、抓飞过的目标。
    function rollJumpWindow() {
      const lo = 28 + Math.random() * 24;              // 28–52%：更早出现，不用干等
      state.jumpWindow = { lo, hi: Math.min(92, lo + 14) };
    }

    function tryJumpTap() {
      if (state.over || state.stale || state.tutorialOpen) return;
      if (state.jumping.active || state.settling || state.pendingSettle) return;
      const w = state.jumpWindow;
      if (!w) return;
      if (state.energy >= w.lo && state.energy <= w.hi) startJump(true);
    }

    function startJump(perfect) {
      const from = lilies[state.cur], to = lilies[state.cur + 1];
      state.jumping = { active: true, t: 0, fromX: from.x, toX: to.x };
      state.actions[perfect ? "timed_jumps" : "automatic_jumps"] += 1;
      state.score += perfect ? 2 : 1;
      $("score").textContent = state.score;
      state.popups.push({ x: from.x, y: from.y - 150, text: perfect ? "完美 +2" : "+1", t: 0 });
      state.jumpWindow = null;
      // 蹬水起跳：脚下荷叶被踩得小幅度下沉，随后自动回弹上浮
      dipLily(from, 60);
    }

    // 荷叶弹簧阻尼：给一次向下的冲量 → 下沉 → 回弹（略微上浮）→ 稳定
    const LILY_SPRING_K = 150;
    const LILY_SPRING_C = 19;
    function updateLilyDips(dt) {
      lilies.forEach(l => {
        if (l.dip === undefined) { l.dip = 0; l.dipVel = 0; }
        const acc = -LILY_SPRING_K * l.dip - LILY_SPRING_C * l.dipVel;
        l.dipVel += acc * dt;
        l.dip += l.dipVel * dt;
        if (Math.abs(l.dip) < 0.02 && Math.abs(l.dipVel) < 0.4) { l.dip = 0; l.dipVel = 0; }
      });
    }
    function dipLily(lily, impulse) {
      if (!lily) return;
      if (lily.dip === undefined) { lily.dip = 0; lily.dipVel = 0; }
      lily.dipVel += impulse;
    }

    // 落水水花：涟漪圈 + 一圈向外上方飞溅的水珠
    function spawnLandingSplash(x, y) {
      if (reducedMotion.matches) return;
      state.splashes.push({ x, y, r0: 42, r1: 72, t: 0, life: 0.55 });
    }

    // ---- 绘制 ----
    function draw(ts) {
      const t = ts / 1000;
      const p = theme();
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      drawSky(p);
      drawStars(p, t);
      drawSun(p, t);
      drawClouds(p, t);
      drawMist(p);
      drawMountains(p);
      drawTrees(p);
      drawWater(p, t);
      drawReflection(p, t);
      drawSplashes();   // 涟漪在水面上、荷叶之下：被荷叶遮住内圈，叶缘外才露出
      drawLilies(p, t);
      drawFrog(p, t);
      drawPopups();
      updateMeters();
    }

    function drawSky(p) {
      const g = ctx.createLinearGradient(0, 0, 0, 240);
      g.addColorStop(0, p.sky[0]);
      g.addColorStop(0.5, p.sky[1]);
      g.addColorStop(1, p.sky[2]);
      ctx.fillStyle = g;
      ctx.fillRect(0, 0, canvas.width, 240);
    }

    // 夜空星星：与首页一样缓慢明暗交替
    function drawStars(p, t) {
      if (!p.stars) return;
      ctx.save();
      ctx.fillStyle = "#ffffff";
      for (let i = 0; i < stars.length; i++) {
        const s = stars[i];
        const tw = 0.5 + 0.5 * Math.sin(t * s.sp + s.ph);
        ctx.globalAlpha = 0.25 + 0.7 * tw;
        ctx.beginPath();
        ctx.arc(s.x, s.y, s.r * (0.85 + 0.3 * tw), 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.restore();
    }

    // 白天太阳 / 黎明与傍晚的低日 / 黑夜月亮，位置与首页一致
    function drawSun(p, t) {
      if (p.sun) {
        const s = p.sun;
        const pulse = 1 + Math.sin(t * 1.1) * 0.04;
        ctx.save();
        ctx.globalAlpha = 0.24;
        ctx.fillStyle = s.halo;
        ctx.beginPath(); ctx.arc(s.x, s.y, 46 * pulse, 0, Math.PI * 2); ctx.fill();
        ctx.globalAlpha = 0.48;
        ctx.beginPath(); ctx.arc(s.x, s.y, 29, 0, Math.PI * 2); ctx.fill();
        ctx.globalAlpha = 0.92;
        ctx.fillStyle = s.core;
        ctx.beginPath(); ctx.arc(s.x, s.y, 21, 0, Math.PI * 2); ctx.fill();
        ctx.restore();
      }
      if (p.moon) {
        const m = p.moon;
        ctx.save();
        ctx.globalAlpha = 0.16;
        ctx.fillStyle = m.halo;
        ctx.beginPath(); ctx.arc(m.x, m.y, 48, 0, Math.PI * 2); ctx.fill();
        ctx.globalAlpha = 1;
        ctx.fillStyle = m.core;
        ctx.beginPath(); ctx.arc(m.x, m.y, 27, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = "#dbe6f8";
        ctx.beginPath(); ctx.arc(m.x - 9, m.y - 9, 5.6, 0, Math.PI * 2); ctx.fill();
        ctx.globalAlpha = .9;
        ctx.beginPath(); ctx.arc(m.x + 9, m.y + 3, 4.2, 0, Math.PI * 2); ctx.fill();
        ctx.globalAlpha = .8;
        ctx.beginPath(); ctx.arc(m.x - 4, m.y + 11, 3, 0, Math.PI * 2); ctx.fill();
        ctx.restore();
      }
    }

    function drawClouds(p, t) {
      if (!p.cloud) return;   // 黑夜不显示云
      state.clouds.forEach(c => {
        ctx.save();
        ctx.globalAlpha = p.cloud.alpha;
        ctx.fillStyle = p.cloud.fill;
        const s = c.s;
        // 相位固定为 c.phase，不能拿移动中的 c.x 当相位，否则云会随漂移上下颤
        const bob = Math.sin(t * 0.45 + c.phase) * 2.2;
        ctx.beginPath();
        ctx.ellipse(c.x, c.y + bob, 34 * s, 13 * s, 0, 0, Math.PI * 2);
        ctx.ellipse(c.x + 18 * s, c.y - 9 * s + bob, 22 * s, 11 * s, 0, 0, Math.PI * 2);
        ctx.ellipse(c.x - 20 * s, c.y - 5 * s + bob, 20 * s, 10 * s, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      });
    }

    // 晨昏时地平线附近的薄雾（首页 #heroMist 同款）
    function drawMist(p) {
      if (!p.mist || !p.mist.alpha) return;
      ctx.save();
      ctx.filter = "blur(7px)";
      ctx.fillStyle = "rgba(" + p.mist.color + ", " + p.mist.alpha + ")";
      ctx.beginPath(); ctx.ellipse(140, 196, 130, 9, 0, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.ellipse(470, 208, 160, 8, 0, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.ellipse(770, 198, 138, 8, 0, 0, Math.PI * 2); ctx.fill();
      ctx.restore();
    }

    function drawMountains(p) {
      ctx.fillStyle = p.hills[0];
      ctx.beginPath();
      ctx.moveTo(0, 210);
      ctx.quadraticCurveTo(180, 108, 400, 180);
      ctx.quadraticCurveTo(560, 120, 700, 190);
      ctx.quadraticCurveTo(800, 150, 900, 196);
      ctx.lineTo(900, 250); ctx.lineTo(0, 250);
      ctx.closePath(); ctx.fill();
      ctx.fillStyle = p.hills[1];
      ctx.beginPath();
      ctx.moveTo(0, 230);
      ctx.quadraticCurveTo(240, 160, 470, 216);
      ctx.quadraticCurveTo(650, 180, 900, 226);
      ctx.lineTo(900, 260); ctx.lineTo(0, 260);
      ctx.closePath(); ctx.fill();
    }

    function drawTrees(p) {
      // 左岸树丛
      ctx.fillStyle = p.trees;
      for (let i = 0; i < 5; i++) {
        const x = 18 + i * 34, y = 216 + (i % 2) * 8, s = 16 + (i % 3) * 4;
        ctx.beginPath();
        ctx.moveTo(x, y); ctx.lineTo(x - s, y + 16); ctx.lineTo(x + s, y + 16);
        ctx.closePath(); ctx.fill();
      }
      ctx.save();
      ctx.globalAlpha = .8;
      for (let i = 0; i < 4; i++) {
        const x = 780 + i * 30, y = 212 + (i % 2) * 10, s = 14 + (i % 3) * 4;
        ctx.beginPath();
        ctx.moveTo(x, y); ctx.lineTo(x - s, y + 16); ctx.lineTo(x + s, y + 16);
        ctx.closePath(); ctx.fill();
      }
      ctx.restore();
    }

    function drawWater(p, t) {
      const g = ctx.createLinearGradient(0, 230, 0, canvas.height);
      g.addColorStop(0, p.water[0]);
      g.addColorStop(1, p.water[1]);
      ctx.fillStyle = g;
      ctx.fillRect(0, 230, canvas.width, canvas.height - 230);

      // 水波层
      ctx.lineWidth = 3;
      for (let layer = 0; layer < 4; layer++) {
        ctx.strokeStyle = `rgba(255,255,255,${(0.42 - layer * 0.09) * p.waves})`;
        const base = 268 + layer * 42;
        ctx.beginPath();
        for (let x = 0; x <= canvas.width; x += 10) {
          const y = base + Math.sin(x * 0.018 + t * (0.7 + layer * 0.12) + layer * 1.7) * 5;
          x === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
        }
        ctx.stroke();
      }
      // 水面高光
      ctx.fillStyle = `rgba(255,255,255,${0.14 * p.waves})`;
      for (let i = 0; i < 6; i++) {
        const hx = (i * 173 + 40) % 860 + 20;
        const hy = 300 + ((i * 97) % 120);
        ctx.beginPath();
        ctx.ellipse(hx + Math.sin(t + i) * 6, hy, 26, 7, 0.15, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    // 黎明（左侧暖阳）/ 傍晚（右侧落日）的水面反光
    function drawReflection(p, t) {
      const gl = p.glow;
      if (!gl) return;
      const shimmer = 1 + Math.sin(t * 0.9) * 0.04;
      ctx.save();
      ctx.filter = "blur(6px)";
      ctx.globalAlpha = .34;
      ctx.fillStyle = "rgb(" + gl.color + ")";
      ctx.beginPath();
      ctx.ellipse(gl.x, gl.y, gl.rx * shimmer, gl.ry, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();

      ctx.save();
      ctx.globalAlpha = .4;
      ctx.strokeStyle = "rgb(" + gl.color + ")";
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(gl.x - gl.rx * 0.8, gl.y - 12);
      ctx.lineTo(gl.x + gl.rx * 0.8, gl.y - 12);
      ctx.moveTo(gl.x - gl.rx * 0.55, gl.y - 4);
      ctx.lineTo(gl.x + gl.rx * 0.55, gl.y - 4);
      ctx.stroke();
      ctx.restore();
    }

    function drawLilies(p, t) {
      lilies.forEach((l, i) => {
        const bob = Math.sin(t * 1.4 + l.bob) * 2.5;
        const dip = l.dip || 0;
        const y = l.y + bob + dip;   // 下沉量直接加在荷叶中心
        const s = i === state.cur ? 1.15 : 1;
        // 下沉时轻微压扁、回弹上浮时轻微拉伸，让"被踩下去"更有重量感
        const squash = Math.max(-0.075, Math.min(0.13, dip * 0.013));
        // 水面倒影
        ctx.save();
        ctx.globalAlpha = 0.16;
        ctx.fillStyle = "#1d6f86";
        ctx.beginPath();
        ctx.ellipse(l.x + 4, l.y + 14 + bob * 0.4 + dip * 0.5, 44 * s, 18 * s, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
        // 荷叶：明度随天空模式变化（与首页 #heroLilies 的滤镜一致）
        ctx.save();
        ctx.filter = p.flora;
        ctx.translate(l.x, y);
        ctx.scale(s * (1 + squash * 0.5), s * (1 - squash));
        const g = ctx.createRadialGradient(6, -8, 4, 0, 0, 48);
        g.addColorStop(0, "#c6f3c8");
        g.addColorStop(0.65, "#74d484");
        g.addColorStop(1, "#46b463");
        ctx.fillStyle = g;
        ctx.beginPath();
        ctx.ellipse(0, 0, 47, 26, 0, 0, Math.PI * 2);
        ctx.fill();
        // 高光弧
        ctx.strokeStyle = "rgba(255,255,255,.5)";
        ctx.lineWidth = 2.5;
        ctx.beginPath();
        ctx.arc(0, 2, 34, -2.2, -1.1);
        ctx.stroke();
        // 叶脉
        ctx.strokeStyle = "rgba(30, 96, 56, .4)";
        ctx.lineWidth = 1.6;
        ctx.beginPath();
        ctx.moveTo(-34, 0); ctx.lineTo(34, 0);
        ctx.moveTo(0, -19); ctx.lineTo(0, 19);
        ctx.moveTo(-18, -11); ctx.lineTo(18, 11);
        ctx.moveTo(-18, 11); ctx.lineTo(18, -11);
        ctx.stroke();
        ctx.restore();
      });
    }

    function drawFrog(p, t) {
      // 荷叶上表面 = 荷叶中心 y - 26；青蛙中心 = 交点 y - 28（半高），青蛙底部正好落在三条直线交点（荷叶中心 y）
      // 荷叶下沉/上浮时青蛙跟着一起动，避免落地瞬间"悬空"
      const i0 = state.cur, i1 = state.cur + 1;
      const lilyTop = i => lilies[i].y + (lilies[i].dip || 0) - 26;
      const frogBase = i => lilies[i].y + (lilies[i].dip || 0) - 28;
      // 空中轨迹用不含下沉的基准：青蛙已离叶，不该被起跳荷叶的下沉带着抖
      const lilyTopRaw = i => lilies[i].y - 26;
      const frogBaseRaw = i => lilies[i].y - 28;
      const k = state.jumping.active ? Math.min(state.jumping.t / 0.55, 1) : 0;
      let fx, fy;
      if (state.jumping.active) {
        fx = interpolateJump(state.jumping.t);
        fy = frogBaseRaw(i0) + (frogBaseRaw(i1) - frogBaseRaw(i0)) * k - jumpArc(state.jumping.t);
      } else {
        fx = lilies[i0].x;   // 荷叶正中心（叶脉交点）
        fy = frogBase(i0) + Math.sin(t * 2.2) * 2;
      }
      // 阴影：贴荷叶/水面，随跳跃高度缩小
      ctx.save();
      ctx.globalAlpha = 0.2 * (1 - 0.55 * Math.sin(k * Math.PI));
      ctx.fillStyle = "#1d6f86";
      ctx.beginPath();
      const shadowY = state.jumping.active
        ? (lilyTopRaw(i0) + 2) + (lilyTopRaw(i1) - lilyTopRaw(i0)) * k
        : lilyTop(i0) + 2;
      ctx.ellipse(fx, shadowY,
                 24 * (1 - 0.4 * Math.sin(k * Math.PI)), 9 * (1 - 0.4 * Math.sin(k * Math.PI)), 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
      ctx.save();
      ctx.translate(fx, fy);
      ctx.filter = p.frog;
      paintEllipse(0, 17, 29, 9, "#346951");
      paintEllipse(0, 7, 24, 22, "#609b68");
      paintEllipse(0, 13, 16, 13, "#b9cf94");
      for (const x of [-14, 14]) {
        paintEllipse(x, -12, 10, 11, "#609b68");
        paintEllipse(x, -12, 6, 7, "#fbf3d9");
        paintEllipse(x + 1, -12, 3, 4, "#263b33");
      }
      ctx.strokeStyle = "#346951";
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(-8, 5);
      ctx.quadraticCurveTo(0, 10, 8, 5);
      ctx.stroke();
      ctx.restore();
    }

    function paintEllipse(x, y, rx, ry, color) {
      ctx.fillStyle = color;
      ctx.beginPath();
      ctx.ellipse(x, y, rx, ry, 0, 0, Math.PI * 2);
      ctx.fill();
    }

    function drawSplashes() {
      state.splashes.forEach(p => {
        if (p.t < 0) return;   // 多圈涟漪可以错开出现
        const k = p.t / p.life;
        const r = p.r0 + (p.r1 - p.r0) * k;
        ctx.save();
        ctx.globalAlpha = 0.42 * (1 - k);
        ctx.strokeStyle = "rgba(255,255,255,.98)";
        ctx.lineWidth = 3 * (1 - k) + 0.8;
        ctx.beginPath();
        // 贴水面的椭圆涟漪（透视压扁）
        ctx.ellipse(p.x, p.y, r, r * 0.42, 0, 0, Math.PI * 2);
        ctx.stroke();
        ctx.restore();
      });
    }

    function drawPopups() {
      state.popups.forEach(p => {
        const k = p.t / 1.2;
        ctx.save();
        ctx.globalAlpha = 1 - k;
        ctx.font = "900 30px 'PingFang SC', sans-serif";
        ctx.textAlign = "center";
        ctx.fillStyle = "#fff4d8";
        ctx.strokeStyle = "#23373a";
        ctx.lineWidth = 4;
        ctx.strokeText(p.text, p.x, p.y - k * 26);
        ctx.fillText(p.text, p.x, p.y - k * 26);
        ctx.restore();
      });
    }

    function updateMeters() {
      const energy = Math.round(state.energy);
      const shown = Math.round(state.norm ?? (state.fused ?? state.focus) * 100);
      const focus = $("focus-readout");
      const label = state.stale ? "—" : String(shown);
      if (focus.textContent !== label) focus.textContent = label;
      const readout = $("energy-readout");
      if (readout.textContent !== energy + "%") readout.textContent = energy + "%";
      $("energy-fill").style.transform = "scaleX(" + state.energy / 100 + ")";
      const window = state.jumpWindow;
      const zone = $("energy-zone");
      zone.hidden = !window;
      if (window) {
        zone.style.left = window.lo + "%";
        zone.style.width = (window.hi - window.lo) + "%";
      }
    }

    function interpolateJump(tt) {
      const from = lilies[state.cur].x;
      const to = lilies[state.cur + 1].x;
      const k = Math.min(tt / 0.55, 1);
      return from + (to - from) * k;
    }
    function jumpArc(tt) {
      const k = Math.min(tt / 0.55, 1);
      return Math.sin(k * Math.PI) * 74;
    }

    function roundRect(ctx, x, y, w, h, r) {
      ctx.beginPath();
      ctx.moveTo(x + r, y);
      ctx.arcTo(x + w, y, x + w, y + h, r);
      ctx.arcTo(x + w, y + h, x, y + h, r);
      ctx.arcTo(x, y + h, x, y, r);
      ctx.arcTo(x, y, x + w, y, r);
      ctx.closePath();
    }

    // ---- 结束 ----
    async function finishGame() {
      if (state.over) return;
      state.over = true;
      if (state.es) state.es.close();
      try {
        const res = await API.post(`/api/session/${state.session.id}/finish`, {
          score: state.score,
          actions: state.actions,
          demo,
          played_sec: state.totalSec - Math.max(0, state.timeLeft),
          notes: "完整一局（" + formatClock(state.totalSec) + "）",
        });
        location.href = "report.html?id=" + state.session.id;
      } catch (e) {
        toast("提交结果失败：" + e.message);
        location.href = "report.html?id=" + state.session.id;
      }
    }

    $("btn-quit").addEventListener("click", () => { location.href = "index.html"; });

    // 校准后的第一次开局：先讲一遍玩法，讲完就不再出现
    (function setupTutorial() {
      const box = $("tutorial");
      const okBtn = $("tutorial-ok");
      if (!box || !okBtn) return;
      let done = false;
      try { done = localStorage.getItem("bf-tutorial-done") === "1"; } catch (_) {}
      if (!done && calib && (demo || !calibExpired)) {
        box.classList.remove("hidden");
        state.tutorialOpen = true;
      }
      okBtn.addEventListener("click", () => {
        box.classList.add("hidden");
        state.tutorialOpen = false;
        try { localStorage.setItem("bf-tutorial-done", "1"); } catch (_) {}
      });
    })();

    init().catch(e => {
      toast("游戏启动失败：" + e.message);
      console.error(e);
    });
  </script>
  <script src="assets/music.js" defer></script>
</body>
</html>
