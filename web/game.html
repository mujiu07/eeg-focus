<!DOCTYPE html>
<html lang="zh-CN" data-sky="day">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>专注小蛙 - 游戏</title>
  <link rel="stylesheet" href="assets/style.css">
  <link rel="stylesheet" href="assets/vinyl.css">
  <style>
    #game-canvas {
      display: block;
      /* 首帧绘制前先铺一层与当前天空模式一致的底色，避免白天/黑夜闪一下 */
      background: linear-gradient(180deg, var(--sky-top) 0%, var(--sky-mid) 34%, var(--sky-low) 62%, var(--water-top) 100%);
      box-shadow: var(--shadow-soft);
      border: 3px solid rgba(255,255,255,.75);
    }
    .hud { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
    .hud-item {
      display: inline-flex; align-items: center; gap: 10px;
      padding: 11px 22px; border-radius: 999px;
      background: rgba(255,255,255,.82);
      box-shadow: 0 6px 16px rgba(47,110,128,.12);
      border: 1.5px solid rgba(255,255,255,.9);
      font-weight: 800; font-size: 19px; color: var(--ink);
    }
    .hud-item .icon { font-size: 22px; }
    .warn-banner {
      position: fixed; left: 50%; top: 44%;
      transform: translate(-50%, -50%);
      font-size: 24px; font-weight: 800; color: var(--ink-soft);
      background: rgba(255,255,255,.88);
      padding: 12px 30px; border-radius: 999px;
      box-shadow: 0 10px 30px rgba(47,110,128,.18);
      opacity: 0; pointer-events: none;
      transition: opacity .35s ease, transform .35s ease;
      z-index: 20;
    }
    .warn-banner.show { opacity: 1; transform: translate(-50%, -50%) translateY(4px); }

    /* 画面较窄时唱片机会压到顶部 HUD，给 HUD 让位 */
    @media (max-width: 1320px) { .hud { padding-right: 210px; } }
    @media (max-width: 860px) {
      .wrap { padding-top: 136px; }
      .hud { padding-right: 0; }
    }
  </style>
  <link rel="stylesheet" href="assets/sky.css">
  <script src="assets/sky.js"></script>
</head>
<body>
  <div class="bubbles"><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
  <div class="sky-veil sky-veil--dawn" aria-hidden="true"></div>
  <div class="sky-veil sky-veil--dusk" aria-hidden="true"></div>
  <div class="sky-veil sky-veil--night" aria-hidden="true"></div>

  <div class="wrap">
    <div class="page-skybar">
      <span class="page-skybar-label">🎨 页面配色</span>
      <div class="sky-switch" id="sky-switch" role="group" aria-label="天空模式">
        <button type="button" class="sky-opt" data-mode="dawn" aria-pressed="false" title="黎明模式"><span aria-hidden="true">🌄</span>黎明</button>
        <button type="button" class="sky-opt" data-mode="day" aria-pressed="false" title="白天模式"><span aria-hidden="true">☀️</span>白天</button>
        <button type="button" class="sky-opt" data-mode="dusk" aria-pressed="false" title="傍晚模式"><span aria-hidden="true">🌇</span>傍晚</button>
        <button type="button" class="sky-opt" data-mode="night" aria-pressed="false" title="黑夜模式"><span aria-hidden="true">🌙</span>黑夜</button>
        <button type="button" class="sky-opt" data-mode="auto" aria-pressed="false" title="跟随系统时间（日出日落）"><span aria-hidden="true">🌗</span>跟随时间</button>
      </div>
    </div>
    <div class="card" style="padding:16px 22px">
      <div class="hud">
        <span class="hud-item" id="lamp"><span class="icon">🧘</span><span class="lamp-dot"></span><span id="lamp-text">专注中</span></span>
        <span class="hud-item"><span class="icon">⏱️</span><span id="timer" style="min-width:5.5ch;text-align:center">01:00</span></span>
        <span class="hud-item"><span class="icon">🐸</span><span>得分</span><span id="score" style="color:var(--accent-dark);min-width:2ch;text-align:center">0</span></span>
      </div>
    </div>

    <canvas id="game-canvas" width="900" height="460"></canvas>
    <div class="warn-banner" id="warn">🧘 放松一下，保持专注再跳！</div>

    <div class="card hidden" id="manual-card">
      <div class="section-title" style="margin-bottom:6px"><span class="dot"></span>手动模拟模式</div>
      <div class="slider-row" style="display:flex;gap:16px;align-items:center">
        <span style="font-weight:700">😌 放松</span>
        <input type="range" id="manual-slider" min="0" max="100" value="30" style="flex:1">
        <span style="font-weight:700">🧠 专注</span>
      </div>
      <p class="hint" style="font-size:13.5px;margin-top:10px">
        拖动滑块模拟专注状态：<strong>拉到右侧</strong>（专注）青蛙就会一直蓄力前进；<strong>滑到左侧</strong>青蛙就跳不动了。
      </p>
    </div>

    <div class="btn-row">
      <button id="btn-quit" class="btn btn-ghost">🏠 退出游戏</button>
    </div>
  </div>

  <script src="assets/api.js"></script>
  <script>
    const $ = id => document.getElementById(id);
    const canvas = $("game-canvas");
    const ctx = canvas.getContext("2d");

    // ---- 天空主题：与首页（index.html）共用 sky.js 里的同一份色板 ----
    // 黎明 / 白天 / 傍晚 / 黑夜切换时，画布的天空、日月星、云、远山、水面、
    // 水面反光与荷叶明度都会跟着重绘，和初始界面的梦境池塘保持一致。
    function theme() {
      return window.SkyTheme ? SkyTheme.palette(SkyTheme.sky()) : SkyThemeFake;
    }
    const SkyThemeFake = {
      sky: ["#dff4fb", "#c9edf4", "#b3e3e8"],
      water: ["#9fd8e2", "#6fb8c9"],
      hills: ["rgba(201, 233, 223, .86)", "rgba(179, 221, 214, .92)"],
      trees: "rgba(88, 178, 128, .8)",
      waves: 1,
      cloud: { fill: "rgba(255, 255, 255, .92)", alpha: .88 },
      mist: { color: "255, 233, 216", alpha: 0 },
      glow: null,
      sun: { x: 828, y: 62, core: "#ffdf8e", mid: "#ffe9b8", halo: "#ffe9b8" },
      moon: null,
      stars: false,
      flora: "none",
      frog: "none",
      energy: ["#8fe3a0", "#2f9c93"],
      hud: { pill: "rgba(255, 255, 255, .92)", ink: "#23464f", inkSoft: "rgba(35, 70, 79, .75)" },
    };

    // 星图：固定随机种子，每次打开位置一致；避开月亮周围留出干净的月光
    const stars = (function () {
      let seed = 20261112;
      const rnd = () => {
        seed = (seed * 1664525 + 1013904223) % 4294967296;
        return seed / 4294967296;
      };
      const out = [];
      for (let i = 0; i < 76; i++) {
        const x = 14 + rnd() * 872;
        const y = 8 + rnd() * 174;
        if (Math.pow(x - 808, 2) + Math.pow(y - 66, 2) < 52 * 52) continue;
        out.push({ x, y, r: 0.6 + rnd() * 1.5, ph: rnd() * Math.PI * 2, sp: 0.5 + rnd() * 1.1 });
      }
      return out;
    })();

    // ---- 会话与基线 ----
    // 校准基线有效期 1 小时：有效期内刷新/关闭页面都无需重新校准；
    // 过期（或从未校准）时不允许用旧基线开局，先回校准页。
    const calibInfo = Store.calibInfo();
    const calib = calibInfo.calib;
    const prev = Store.load();
    const baseline = calib ? calib.baseline : 0.4;
    const calibExpired = calibInfo.expired;
    if (!calib) {
      Store.clearCalib();
      toast(calibExpired ? "校准已超过 1 小时，需要重新校准" : "先建立专注基线吧！");
      setTimeout(() => {
        location.replace(calibExpired ? "calibrate.html?reason=expired" : "calibrate.html");
      }, 1200);
    }

    // ---- 本局时长（开始前由首页弹窗选择：game.html?sec=180）----
    const DURATION_MIN_SEC = 60;
    const DURATION_MAX_SEC = 3600;
    function readDurationSec() {
      const raw = new URLSearchParams(location.search).get("sec")
                || localStorage.getItem("bf-duration-sec");
      const n = Math.round(Number(raw));
      if (!Number.isFinite(n) || n <= 0) return 60;
      return Math.min(DURATION_MAX_SEC, Math.max(DURATION_MIN_SEC, n));
    }
    const totalSec = readDurationSec();

    // 计时显示：始终 mm:ss，避免 10 分钟时数字过长
    function formatClock(sec) {
      const s = Math.max(0, Math.ceil(sec));
      const m = Math.floor(s / 60);
      const r = s % 60;
      return String(m).padStart(2, "0") + ":" + String(r).padStart(2, "0");
    }

    const state = {
      session: null, es: null,
      focus: baseline, raw: baseline,
      energy: 0,
      score: 0,
      totalSec,
      timeLeft: totalSec,
      lastTs: null,
      stale: false,       // 数据无效/断流：暂停蓄力
      lastFrameTs: 0,     // 最近一次有效帧时间（新鲜度检查）
      over: false,
      manualMode: false,
      jumping: { active: false, t: 0, fromX: 0, toX: 0 },
      cur: 0,           // 青蛙当前所在荷叶在 lilies 中的下标；左侧旧荷叶保留不清除
      pendingSettle: false,  // 落地后等待水花散尽、荷叶上浮稳定，再开始平移
      settling: false,  // 跳完后青蛙与荷叶一起平滑移回屏幕中间
      popups: [],     // 浮动文字 {x,y,text,t}
      splashes: [],   // 水花涟漪 {x,y,r0,r1,t,life}
      droplets: [],   // 溅起的水珠 {x,y,vx,vy,r,t,life}
      clouds: [
        { x: 120, y: 52, s: 1.0, v: 8, phase: 0.6 },
        { x: 520, y: 38, s: 0.8, v: 12, phase: 2.4 },
        { x: 780, y: 72, s: 0.62, v: 6, phase: 4.1 },
      ],
    };

    $("timer").textContent = formatClock(state.totalSec);

    // 荷叶布局（青蛙等待位固定在屏幕中间 cx=450：当前荷叶中心 = cx）
    let lilies = [];
    const CX = canvas.width / 2;
    const LEFT_BOUND = 50;   // 荷叶左移的下限：整片叶子留在游戏框内，不越过左边框
    function resetLilies() {
      const n = 6;
      lilies = [];
      state.cur = 0;
      let x = CX;   // 青蛙初始位置 = 荷叶正中心（叶脉交点）
      for (let i = 0; i < n; i++) {
        lilies.push({ x, y: 340 - (i % 2) * 26, bob: Math.random() * Math.PI * 2, dip: 0, dipVel: 0 });
        x += 170 + (i * 37) % 40;
      }
    }
    // 前方补一片新荷叶（落在最右侧荷叶的右边）
    function addLily() {
      const last = lilies[lilies.length - 1];
      lilies.push({
        x: last.x + 170 + Math.random() * 60,
        y: 340 - (lilies.length % 2) * 26,
        bob: Math.random() * Math.PI * 2,
        dip: 0, dipVel: 0,
      });
    }
    resetLilies();
    const FROG_SIZE = 56;

    // ---- 创建会话 ----
    async function init() {
      if (!calib) return;   // 无有效校准：已在上面安排跳转回校准页，不创建会话
      const prevMode = prev && prev.source ? prev.source.mode : null;
      const mode = prevMode === "manual" ? "manual" : (prevMode === "hardware" ? "hardware" : "replay");
      // baseline 必须随会话一起上报：报告页的橙色虚线与"高于基线占比"都依赖它
      let body = { mode, baseline: calib.baseline };
      if (mode === "replay") {
        const info = await API.get("/api/dev/info");
        const calibFile = prev && prev.source ? prev.source.file : null;
        let subj = null;
        if (calibFile) subj = calibFile.match(/(Subject\d+)/);
        const focusFiles = (info.edf_files || []).filter(f => f.segment === 2);
        const match = focusFiles.find(f => subj && f.subject === subj[1]);
        body.file = (match || focusFiles[0]).path;
      } else if (mode === "hardware") {
        body.osc_ports = (prev && prev.source && prev.source.osc_ports) || null;
      }
      const res = await API.post("/api/session", body);
      state.session = { id: res.session_id, mode, osc_ports: body.osc_ports || null };
      state.manualMode = mode === "manual";
      $("manual-card").classList.toggle("hidden", !state.manualMode);

      state.es = API.stream(res.session_id, {
        onHello() { state.lastFrameTs = performance.now(); },
        onFrame(f) {
          state.lastFrameTs = performance.now();
          if (f.meta && f.meta.error) { state.stale = true; return; }  // 异常帧：显式无效
          state.stale = false;
          state.focus = f.focus; state.raw = f.raw;
        },
        onEnd() { finishGame(); },
        onError() { state.stale = true; },
        onStatus(s) { if (s === "reconnecting") state.stale = true; },
      });

      requestAnimationFrame(loop);
    }

    // ---- 手动模式 ----
    $("manual-slider").addEventListener("input", async e => {
      const v = e.target.value / 100;
      state.focus = v; state.raw = v;
      if (state.session) await API.post(`/api/session/${state.session.id}/manual`, { focus: v });
    });

    // ---- 游戏主循环 ----
    function loop(ts) {
      if (state.over) return;
      const dt = state.lastTs ? Math.min((ts - state.lastTs) / 1000, 0.05) : 0.016;
      state.lastTs = ts;
      updateGame(dt);
      draw(ts);
      requestAnimationFrame(loop);
    }

    function updateGame(dt) {
      // 云漂移（到屏幕右侧完全离开后再回到左侧，避免边缘处突然消失/出现）
      state.clouds.forEach(c => {
        c.x += c.v * dt;
        if (c.x > canvas.width + 80) c.x = -90;
      });

      // 水花/浮字更新
      state.splashes = state.splashes.filter(p => (p.t += dt) < p.life);
      state.popups = state.popups.filter(p => (p.t += dt) < 1.2);
      state.droplets = state.droplets.filter(d => {
        d.t += dt;
        if (d.t >= d.life) return false;
        d.vy += 700 * dt;   // 水滴受重力回落
        d.x += d.vx * dt;
        d.y += d.vy * dt;
        return true;
      });

      // 荷叶下沉/上浮（弹簧阻尼）：dip > 0 沉入水面，dip < 0 回弹上浮
      updateLilyDips(dt);

      // 数据新鲜度：超过 3 秒无有效帧 → 视为断流，暂停蓄力（旧分数不得继续驱动游戏）
      if (performance.now() - state.lastFrameTs > 3000) state.stale = true;

      const focused = !state.stale && state.focus >= baseline;
      // 蓄力：跳跃中与平移中不蓄力；落地后等待水花/上浮的这段时间仍可蓄力
      if (!state.jumping.active && !state.settling && !state.stale) {
        if (focused) {
          const gain = (state.focus - baseline + 0.03) * dt * 8.5;
          state.energy = Math.min(100, state.energy + gain);
        } else {
          state.energy = Math.max(0, state.energy - dt * 4.2);
        }
      }

      if (state.pendingSettle) {
        // 等水花和涟漪全部散尽、新荷叶回弹上浮停稳，再开始平移
        const l = lilies[state.cur];
        const calm = Math.abs(l.dip || 0) < 0.4 && Math.abs(l.dipVel || 0) < 2;
        if (!state.splashes.length && !state.droplets.length && calm) {
          state.pendingSettle = false;
          state.settling = true;
        }
      } else if (state.jumping.active) {
        state.jumping.t += dt;
        if (state.jumping.t >= 0.55) {
          const landing = lilies[state.cur + 1];   // 目标荷叶
          state.jumping.active = false;
          state.cur += 1;                          // 青蛙落到下一片，旧荷叶保留在左侧
          if (!lilies[state.cur + 1]) addLily();   // 前方始终留一片下一跳的荷叶
          state.energy = 15;
          // 落地：新荷叶被压得下沉一截，四周溅起水花，随后回弹上浮
          dipLily(landing, 250);
          spawnLandingSplash(landing.x, landing.y + 6);
          // 先等特效结束、上浮稳定，再平移（见 pendingSettle 分支）
          state.pendingSettle = true;
        }
      } else if (state.settling) {
        // 平移：所有荷叶同步左移，直到当前荷叶中心回到 CX（青蛙回中间）
        // 旧荷叶最多停到左边界，不会越过游戏框左边；ease-out 平滑减速，距离很小时转线性收尾
        const cur = lilies[state.cur];
        const dist = cur.x - CX;
        if (dist <= 0.5) {
          cur.x = CX;   // 精确归位：青蛙正中心回到屏幕中间
          state.settling = false;
        } else {
          const step = Math.min(dist, Math.max(24 * dt, dist * dt * 4));
          lilies.forEach(l => { l.x = Math.max(LEFT_BOUND, l.x - step); });
        }
      } else if (!state.stale && state.energy >= 100) {
        startJump();
      }

      const lamp = $("lamp");
      lamp.classList.toggle("lamp-on", focused);
      $("lamp-text").textContent = state.stale ? "信号中断" : (focused ? "专注中" : "分心了");
      $("warn").classList.toggle("show", state.stale || (!focused && state.energy < 25));
      $("warn").textContent = state.stale ? "数据中断，蓄力已暂停" : "专注度较低，蓄力正在减少";

      state.timeLeft -= dt;
      $("timer").textContent = formatClock(state.timeLeft);
      if (state.timeLeft <= 0) finishGame();
    }

    function startJump() {
      const from = lilies[state.cur], to = lilies[state.cur + 1];
      state.jumping = { active: true, t: 0, fromX: from.x, toX: to.x };
      state.score += 1;
      $("score").textContent = state.score;
      state.popups.push({ x: from.x, y: from.y - 150, text: "+1", t: 0 });
      // 蹬水起跳：脚下荷叶被踩得小幅度下沉，随后自动回弹上浮
      dipLily(from, 170);
    }

    // 荷叶弹簧阻尼：给一次向下的冲量 → 下沉 → 回弹（略微上浮）→ 稳定
    const LILY_SPRING_K = 150;
    const LILY_SPRING_C = 9;
    function updateLilyDips(dt) {
      lilies.forEach(l => {
        if (l.dip === undefined) { l.dip = 0; l.dipVel = 0; }
        const acc = -LILY_SPRING_K * l.dip - LILY_SPRING_C * l.dipVel;
        l.dipVel += acc * dt;
        l.dip += l.dipVel * dt;
        if (Math.abs(l.dip) < 0.02 && Math.abs(l.dipVel) < 0.4) { l.dip = 0; l.dipVel = 0; }
      });
    }
    function dipLily(lily, impulse) {
      if (!lily) return;
      if (lily.dip === undefined) { lily.dip = 0; lily.dipVel = 0; }
      lily.dipVel += impulse;
    }

    // 落水水花：涟漪圈 + 一圈向外上方飞溅的水珠
    function spawnLandingSplash(x, y) {
      for (let i = 0; i < 3; i++) {
        state.splashes.push({
          x, y: y + 2,
          r0: 44 + i * 7,
          r1: 82 + i * 18,
          t: -i * 0.07,
          life: 0.75 + i * 0.14,
        });
      }
      const n = 14;
      for (let i = 0; i < n; i++) {
        const a = (Math.PI * 2 * i) / n + (Math.random() - 0.5) * 0.45;
        state.droplets.push({
          x: x + Math.cos(a) * 34,
          y: y + Math.sin(a) * 12 - 2,
          vx: Math.cos(a) * (50 + Math.random() * 75),
          vy: -(185 + Math.random() * 135) + Math.sin(a) * 35,
          r: 2 + Math.random() * 2.3,
          t: 0,
          life: 0.5 + Math.random() * 0.42,
        });
      }
    }

    // ---- 绘制 ----
    function draw(ts) {
      const t = ts / 1000;
      const p = theme();
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      drawSky(p);
      drawStars(p, t);
      drawSun(p, t);
      drawClouds(p, t);
      drawMist(p);
      drawMountains(p);
      drawTrees(p);
      drawWater(p, t);
      drawReflection(p, t);
      drawSplashes();   // 涟漪在水面上、荷叶之下：被荷叶遮住内圈，叶缘外才露出
      drawLilies(p, t);
      drawFrog(p, t);
      drawDroplets();
      drawPopups();
      drawEnergy(p);
      drawHudText(p);
    }

    function drawSky(p) {
      const g = ctx.createLinearGradient(0, 0, 0, 240);
      g.addColorStop(0, p.sky[0]);
      g.addColorStop(0.5, p.sky[1]);
      g.addColorStop(1, p.sky[2]);
      ctx.fillStyle = g;
      ctx.fillRect(0, 0, canvas.width, 240);
    }

    // 夜空星星：与首页一样缓慢明暗交替
    function drawStars(p, t) {
      if (!p.stars) return;
      ctx.save();
      ctx.fillStyle = "#ffffff";
      for (let i = 0; i < stars.length; i++) {
        const s = stars[i];
        const tw = 0.5 + 0.5 * Math.sin(t * s.sp + s.ph);
        ctx.globalAlpha = 0.25 + 0.7 * tw;
        ctx.beginPath();
        ctx.arc(s.x, s.y, s.r * (0.85 + 0.3 * tw), 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.restore();
    }

    // 白天太阳 / 黎明与傍晚的低日 / 黑夜月亮，位置与首页一致
    function drawSun(p, t) {
      if (p.sun) {
        const s = p.sun;
        const pulse = 1 + Math.sin(t * 1.1) * 0.04;
        ctx.save();
        ctx.globalAlpha = 0.24;
        ctx.fillStyle = s.halo;
        ctx.beginPath(); ctx.arc(s.x, s.y, 46 * pulse, 0, Math.PI * 2); ctx.fill();
        ctx.globalAlpha = 0.48;
        ctx.beginPath(); ctx.arc(s.x, s.y, 29, 0, Math.PI * 2); ctx.fill();
        ctx.globalAlpha = 0.92;
        ctx.fillStyle = s.core;
        ctx.beginPath(); ctx.arc(s.x, s.y, 21, 0, Math.PI * 2); ctx.fill();
        ctx.restore();
      }
      if (p.moon) {
        const m = p.moon;
        ctx.save();
        ctx.globalAlpha = 0.16;
        ctx.fillStyle = m.halo;
        ctx.beginPath(); ctx.arc(m.x, m.y, 48, 0, Math.PI * 2); ctx.fill();
        ctx.globalAlpha = 1;
        ctx.fillStyle = m.core;
        ctx.beginPath(); ctx.arc(m.x, m.y, 27, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = "#dbe6f8";
        ctx.beginPath(); ctx.arc(m.x - 9, m.y - 9, 5.6, 0, Math.PI * 2); ctx.fill();
        ctx.globalAlpha = .9;
        ctx.beginPath(); ctx.arc(m.x + 9, m.y + 3, 4.2, 0, Math.PI * 2); ctx.fill();
        ctx.globalAlpha = .8;
        ctx.beginPath(); ctx.arc(m.x - 4, m.y + 11, 3, 0, Math.PI * 2); ctx.fill();
        ctx.restore();
      }
    }

    function drawClouds(p, t) {
      if (!p.cloud) return;   // 黑夜不显示云
      state.clouds.forEach(c => {
        ctx.save();
        ctx.globalAlpha = p.cloud.alpha;
        ctx.fillStyle = p.cloud.fill;
        const s = c.s;
        // 相位固定为 c.phase，不能拿移动中的 c.x 当相位，否则云会随漂移上下颤
        const bob = Math.sin(t * 0.45 + c.phase) * 2.2;
        ctx.beginPath();
        ctx.ellipse(c.x, c.y + bob, 34 * s, 13 * s, 0, 0, Math.PI * 2);
        ctx.ellipse(c.x + 18 * s, c.y - 9 * s + bob, 22 * s, 11 * s, 0, 0, Math.PI * 2);
        ctx.ellipse(c.x - 20 * s, c.y - 5 * s + bob, 20 * s, 10 * s, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      });
    }

    // 晨昏时地平线附近的薄雾（首页 #heroMist 同款）
    function drawMist(p) {
      if (!p.mist || !p.mist.alpha) return;
      ctx.save();
      ctx.filter = "blur(7px)";
      ctx.fillStyle = "rgba(" + p.mist.color + ", " + p.mist.alpha + ")";
      ctx.beginPath(); ctx.ellipse(140, 196, 130, 9, 0, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.ellipse(470, 208, 160, 8, 0, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.ellipse(770, 198, 138, 8, 0, 0, Math.PI * 2); ctx.fill();
      ctx.restore();
    }

    function drawMountains(p) {
      ctx.fillStyle = p.hills[0];
      ctx.beginPath();
      ctx.moveTo(0, 210);
      ctx.quadraticCurveTo(180, 108, 400, 180);
      ctx.quadraticCurveTo(560, 120, 700, 190);
      ctx.quadraticCurveTo(800, 150, 900, 196);
      ctx.lineTo(900, 250); ctx.lineTo(0, 250);
      ctx.closePath(); ctx.fill();
      ctx.fillStyle = p.hills[1];
      ctx.beginPath();
      ctx.moveTo(0, 230);
      ctx.quadraticCurveTo(240, 160, 470, 216);
      ctx.quadraticCurveTo(650, 180, 900, 226);
      ctx.lineTo(900, 260); ctx.lineTo(0, 260);
      ctx.closePath(); ctx.fill();
    }

    function drawTrees(p) {
      // 左岸树丛
      ctx.fillStyle = p.trees;
      for (let i = 0; i < 5; i++) {
        const x = 18 + i * 34, y = 216 + (i % 2) * 8, s = 16 + (i % 3) * 4;
        ctx.beginPath();
        ctx.moveTo(x, y); ctx.lineTo(x - s, y + 16); ctx.lineTo(x + s, y + 16);
        ctx.closePath(); ctx.fill();
      }
      ctx.save();
      ctx.globalAlpha = .8;
      for (let i = 0; i < 4; i++) {
        const x = 780 + i * 30, y = 212 + (i % 2) * 10, s = 14 + (i % 3) * 4;
        ctx.beginPath();
        ctx.moveTo(x, y); ctx.lineTo(x - s, y + 16); ctx.lineTo(x + s, y + 16);
        ctx.closePath(); ctx.fill();
      }
      ctx.restore();
    }

    function drawWater(p, t) {
      const g = ctx.createLinearGradient(0, 230, 0, canvas.height);
      g.addColorStop(0, p.water[0]);
      g.addColorStop(1, p.water[1]);
      ctx.fillStyle = g;
      ctx.fillRect(0, 230, canvas.width, canvas.height - 230);

      // 水波层
      ctx.lineWidth = 3;
      for (let layer = 0; layer < 4; layer++) {
        ctx.strokeStyle = `rgba(255,255,255,${(0.42 - layer * 0.09) * p.waves})`;
        const base = 268 + layer * 42;
        ctx.beginPath();
        for (let x = 0; x <= canvas.width; x += 10) {
          const y = base + Math.sin(x * 0.018 + t * (0.7 + layer * 0.12) + layer * 1.7) * 5;
          x === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
        }
        ctx.stroke();
      }
      // 水面高光
      ctx.fillStyle = `rgba(255,255,255,${0.14 * p.waves})`;
      for (let i = 0; i < 6; i++) {
        const hx = (i * 173 + 40) % 860 + 20;
        const hy = 300 + ((i * 97) % 120);
        ctx.beginPath();
        ctx.ellipse(hx + Math.sin(t + i) * 6, hy, 26, 7, 0.15, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    // 黎明（左侧暖阳）/ 傍晚（右侧落日）的水面反光
    function drawReflection(p, t) {
      const gl = p.glow;
      if (!gl) return;
      const shimmer = 1 + Math.sin(t * 0.9) * 0.04;
      ctx.save();
      ctx.filter = "blur(6px)";
      ctx.globalAlpha = .34;
      ctx.fillStyle = "rgb(" + gl.color + ")";
      ctx.beginPath();
      ctx.ellipse(gl.x, gl.y, gl.rx * shimmer, gl.ry, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();

      ctx.save();
      ctx.globalAlpha = .4;
      ctx.strokeStyle = "rgb(" + gl.color + ")";
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(gl.x - gl.rx * 0.8, gl.y - 12);
      ctx.lineTo(gl.x + gl.rx * 0.8, gl.y - 12);
      ctx.moveTo(gl.x - gl.rx * 0.55, gl.y - 4);
      ctx.lineTo(gl.x + gl.rx * 0.55, gl.y - 4);
      ctx.stroke();
      ctx.restore();
    }

    function drawLilies(p, t) {
      lilies.forEach((l, i) => {
        const bob = Math.sin(t * 1.4 + l.bob) * 2.5;
        const dip = l.dip || 0;
        const y = l.y + bob + dip;   // 下沉量直接加在荷叶中心
        const s = i === state.cur ? 1.15 : 1;
        // 下沉时轻微压扁、回弹上浮时轻微拉伸，让"被踩下去"更有重量感
        const squash = Math.max(-0.075, Math.min(0.13, dip * 0.013));
        // 水面倒影
        ctx.save();
        ctx.globalAlpha = 0.16;
        ctx.fillStyle = "#1d6f86";
        ctx.beginPath();
        ctx.ellipse(l.x + 4, l.y + 14 + bob * 0.4 + dip * 0.5, 44 * s, 18 * s, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
        // 荷叶：明度随天空模式变化（与首页 #heroLilies 的滤镜一致）
        ctx.save();
        ctx.filter = p.flora;
        ctx.translate(l.x, y);
        ctx.scale(s * (1 + squash * 0.5), s * (1 - squash));
        const g = ctx.createRadialGradient(6, -8, 4, 0, 0, 48);
        g.addColorStop(0, "#c6f3c8");
        g.addColorStop(0.65, "#74d484");
        g.addColorStop(1, "#46b463");
        ctx.fillStyle = g;
        ctx.beginPath();
        ctx.ellipse(0, 0, 47, 26, 0, 0, Math.PI * 2);
        ctx.fill();
        // 高光弧
        ctx.strokeStyle = "rgba(255,255,255,.5)";
        ctx.lineWidth = 2.5;
        ctx.beginPath();
        ctx.arc(0, 2, 34, -2.2, -1.1);
        ctx.stroke();
        // 叶脉
        ctx.strokeStyle = "rgba(30, 96, 56, .4)";
        ctx.lineWidth = 1.6;
        ctx.beginPath();
        ctx.moveTo(-34, 0); ctx.lineTo(34, 0);
        ctx.moveTo(0, -19); ctx.lineTo(0, 19);
        ctx.moveTo(-18, -11); ctx.lineTo(18, 11);
        ctx.moveTo(-18, 11); ctx.lineTo(18, -11);
        ctx.stroke();
        ctx.restore();
      });
    }

    function drawFrog(p, t) {
      // 荷叶上表面 = 荷叶中心 y - 26；青蛙中心 = 交点 y - 28（半高），青蛙底部正好落在三条直线交点（荷叶中心 y）
      // 荷叶下沉/上浮时青蛙跟着一起动，避免落地瞬间"悬空"
      const i0 = state.cur, i1 = state.cur + 1;
      const lilyTop = i => lilies[i].y + (lilies[i].dip || 0) - 26;
      const frogBase = i => lilies[i].y + (lilies[i].dip || 0) - 28;
      // 空中轨迹用不含下沉的基准：青蛙已离叶，不该被起跳荷叶的下沉带着抖
      const lilyTopRaw = i => lilies[i].y - 26;
      const frogBaseRaw = i => lilies[i].y - 28;
      const k = state.jumping.active ? Math.min(state.jumping.t / 0.55, 1) : 0;
      let fx, fy;
      const focused = state.focus >= baseline;
      if (state.jumping.active) {
        fx = interpolateJump(state.jumping.t);
        fy = frogBaseRaw(i0) + (frogBaseRaw(i1) - frogBaseRaw(i0)) * k - jumpArc(state.jumping.t);
      } else {
        fx = lilies[i0].x;   // 荷叶正中心（叶脉交点）
        fy = frogBase(i0) + Math.sin(t * 2.2) * 2;
      }
      // 专注光环
      if (focused && !state.jumping.active) {
        const glow = 0.16 + Math.sin(t * 2.4) * 0.05;
        ctx.save();
        ctx.globalAlpha = glow;
        ctx.fillStyle = "#8fe3a0";
        ctx.beginPath();
        ctx.ellipse(fx, fy + 12, 52, 20, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }
      // 阴影：贴荷叶/水面，随跳跃高度缩小
      ctx.save();
      ctx.globalAlpha = 0.2 * (1 - 0.55 * Math.sin(k * Math.PI));
      ctx.fillStyle = "#1d6f86";
      ctx.beginPath();
      const shadowY = state.jumping.active
        ? (lilyTopRaw(i0) + 2) + (lilyTopRaw(i1) - lilyTopRaw(i0)) * k
        : lilyTop(i0) + 2;
      ctx.ellipse(fx, shadowY,
                 24 * (1 - 0.4 * Math.sin(k * Math.PI)), 9 * (1 - 0.4 * Math.sin(k * Math.PI)), 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
      // 青蛙本体
      // 注意：ctx.fillStyle / globalAlpha 是全局状态，若不显式重置会继承上一步画叶脉的
      // rgba(30, 96, 56, .4)，导致青蛙看起来是半透明的。
      ctx.save();
      ctx.globalAlpha = 1;
      ctx.filter = p.frog;
      ctx.fillStyle = "#1d3f2f";
      ctx.font = `${FROG_SIZE}px "Segoe UI Emoji", "Apple Color Emoji", "Noto Color Emoji", serif`;
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillText("🐸", fx, fy);
      ctx.restore();
    }

    function drawSplashes() {
      state.splashes.forEach(p => {
        if (p.t < 0) return;   // 多圈涟漪可以错开出现
        const k = p.t / p.life;
        const r = p.r0 + (p.r1 - p.r0) * k;
        ctx.save();
        ctx.globalAlpha = 0.78 * (1 - k);
        ctx.strokeStyle = "rgba(255,255,255,.98)";
        ctx.lineWidth = 3 * (1 - k) + 0.8;
        ctx.beginPath();
        // 贴水面的椭圆涟漪（透视压扁）
        ctx.ellipse(p.x, p.y, r, r * 0.42, 0, 0, Math.PI * 2);
        ctx.stroke();
        ctx.restore();
      });
    }

    function drawDroplets() {
      state.droplets.forEach(d => {
        const k = d.t / d.life;
        const stretch = 1 + Math.min(1.1, Math.abs(d.vy) / 520);
        ctx.save();
        ctx.globalAlpha = 0.92 * (1 - k * k);
        ctx.fillStyle = "rgba(255,255,255,.96)";
        ctx.beginPath();
        ctx.ellipse(d.x, d.y, d.r, d.r * stretch, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      });
    }

    function drawPopups() {
      state.popups.forEach(p => {
        const k = p.t / 1.2;
        ctx.save();
        ctx.globalAlpha = 1 - k;
        ctx.font = "900 30px 'PingFang SC', sans-serif";
        ctx.textAlign = "center";
        ctx.fillStyle = "#e8893a";
        ctx.shadowColor = "rgba(255,255,255,.9)";
        ctx.shadowBlur = 8;
        ctx.fillText(p.text, p.x, p.y - k * 26);
        ctx.restore();
      });
    }

    function drawEnergy(p) {
      const w = canvas.width - 32 - 96, h = 22, x = 16, y = 62;
      // 轨道
      ctx.fillStyle = "rgba(255,255,255,.5)";
      roundRect(ctx, x, y, w, h, 11);
      ctx.fill();
      ctx.strokeStyle = "rgba(255,255,255,.9)";
      ctx.lineWidth = 1.5;
      roundRect(ctx, x, y, w, h, 11);
      ctx.stroke();
      // 填充
      if (state.energy > 0) {
        const g = ctx.createLinearGradient(x, 0, x + w, 0);
        g.addColorStop(0, p.energy[0]);
        g.addColorStop(1, p.energy[1]);
        ctx.fillStyle = g;
        roundRect(ctx, x + 2, y + 2, Math.max(6, (w - 4) * state.energy / 100), h - 4, 9);
        ctx.fill();
        // 顶部光泽
        ctx.save();
        ctx.globalAlpha = 0.45;
        ctx.fillStyle = "#fff";
        roundRect(ctx, x + 5, y + 4, Math.max(2, (w - 10) * state.energy / 100), 5, 3);
        ctx.fill();
        ctx.restore();
      }
      // 标签
      ctx.textAlign = "right";
      ctx.font = "800 17px 'PingFang SC', sans-serif";
      ctx.fillStyle = p.hud.ink;
      ctx.fillText("蓄力", x + w + 12, y + h / 2 + 6);
      ctx.fillStyle = p.hud.inkSoft;
      ctx.font = "700 15px 'PingFang SC', sans-serif";
      ctx.fillText(Math.round(state.energy) + "%", x + w + 58, y + h / 2 + 6);
    }

    function drawHudText(p) {
      ctx.fillStyle = p.hud.pill;
      roundRect(ctx, 16, 18, 150, 32, 16);
      ctx.fill();
      ctx.fillStyle = p.hud.ink;
      ctx.font = "700 16px 'PingFang SC', sans-serif";
      ctx.textAlign = "left";
      ctx.fillText("🧠 脑波分数 " + Math.round(state.focus * 100) + "%", 30, 41);
    }

    function interpolateJump(tt) {
      const from = lilies[state.cur].x;
      const to = lilies[state.cur + 1].x;
      const k = Math.min(tt / 0.55, 1);
      return from + (to - from) * k;
    }
    function jumpArc(tt) {
      const k = Math.min(tt / 0.55, 1);
      return Math.sin(k * Math.PI) * 74;
    }

    function roundRect(ctx, x, y, w, h, r) {
      ctx.beginPath();
      ctx.moveTo(x + r, y);
      ctx.arcTo(x + w, y, x + w, y + h, r);
      ctx.arcTo(x + w, y + h, x, y + h, r);
      ctx.arcTo(x, y + h, x, y, r);
      ctx.arcTo(x, y, x + w, y, r);
      ctx.closePath();
    }

    // ---- 结束 ----
    async function finishGame() {
      if (state.over) return;
      state.over = true;
      if (state.es) state.es.close();
      try {
        const res = await API.post(`/api/session/${state.session.id}/finish`, {
          score: state.score,
          played_sec: state.totalSec - Math.max(0, state.timeLeft),
          notes: "完整一局（" + formatClock(state.totalSec) + "）",
        });
        location.href = "report.html?id=" + state.session.id;
      } catch (e) {
        toast("提交结果失败：" + e.message);
        location.href = "report.html?id=" + state.session.id;
      }
    }

    $("btn-quit").addEventListener("click", () => { location.href = "index.html"; });

    init().catch(e => {
      toast("游戏启动失败：" + e.message);
      console.error(e);
    });
  </script>
  <script src="assets/music.js" defer></script>
</body>
</html>
