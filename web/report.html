<!DOCTYPE html>
<html lang="zh-CN" data-sky="day">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>训练报告 - 专注小蛙</title>
  <link rel="stylesheet" href="assets/style.css">
  <link rel="stylesheet" href="assets/vinyl.css">
  <style>
    .curve-card { background: linear-gradient(180deg, rgba(255,255,255,.94), rgba(255,255,255,.78)); }
    .parent-note {
      background: linear-gradient(135deg, rgba(255,232,210,.5), rgba(255,255,255,.7));
      border: 1px solid rgba(247,164,85,.35);
      border-radius: 20px; padding: 18px 22px;
      font-size: 15.5px; line-height: 1.9; color: var(--ink);
    }
    .parent-note .em { font-size: 22px; }
    .pn-block + .pn-block {
      margin-top: 14px; padding-top: 14px;
      border-top: 1px dashed rgba(247,164,85,.42);
    }
    .pn-title {
      display: flex; align-items: center; gap: 8px;
      font-size: 14.5px; font-weight: 900; letter-spacing: .5px;
      color: #a9683a; margin-bottom: 6px;
    }
    .pn-title .emo { font-size: 17px; }
    .pn-chips { display: flex; flex-wrap: wrap; gap: 7px; margin: 2px 0 8px; }
    .pn-chip {
      font-size: 12.5px; font-weight: 700; color: #8a6242;
      background: rgba(255,255,255,.82);
      border: 1px solid rgba(247,164,85,.32);
      border-radius: 999px; padding: 3px 10px;
    }
    .pn-chip b { color: #c06a32; }
    .pn-text { margin: 0; }
    .pn-text b { color: #a9683a; }
    .pn-list { list-style: none; margin: 0; padding: 0; }
    .pn-list li { position: relative; padding-left: 18px; margin: 7px 0; }
    .pn-list li::before {
      content: ""; position: absolute; left: 3px; top: .72em;
      width: 6px; height: 6px; border-radius: 50%; background: #f0a45e;
    }
    .pn-list b { color: #a9683a; }
    .pn-note {
      margin-top: 13px; padding: 10px 12px; border-radius: 12px;
      background: rgba(35,70,79,.055);
      border: 1px dashed rgba(35,70,79,.22);
      font-size: 13px; line-height: 1.75; color: var(--ink-soft);
    }
    .pn-note b { color: #c4553f; }
    .pn-ref { display: block; margin-top: 4px; font-size: 11.5px; color: rgba(92,123,131,.85); }
    .pn-badge {
      font-size: 11.5px; font-weight: 800; letter-spacing: 1px;
      color: #b5673a;
      background: rgba(255,232,210,.85);
      border: 1px dashed rgba(247,164,85,.6);
      padding: 2px 9px; border-radius: 999px;
      margin-left: 2px;
    }
    html[data-sky="night"] .pn-title,
    html[data-sky="dusk"] .pn-title { color: #ffd39a; }
    html[data-sky="night"] .pn-text b,
    html[data-sky="dusk"] .pn-text b,
    html[data-sky="night"] .pn-list b,
    html[data-sky="dusk"] .pn-list b { color: #ffcf9a; }
    html[data-sky="night"] .pn-chip,
    html[data-sky="dusk"] .pn-chip {
      background: rgba(255,255,255,.09);
      border-color: rgba(255,195,126,.32);
      color: #eed9c2;
    }
    html[data-sky="night"] .pn-chip b,
    html[data-sky="dusk"] .pn-chip b { color: #ffd9a8; }
    html[data-sky="night"] .pn-note,
    html[data-sky="dusk"] .pn-note {
      background: rgba(0,0,0,.22);
      border-color: rgba(255,255,255,.16);
      color: #cfe0e4;
    }
    html[data-sky="night"] .pn-note b,
    html[data-sky="dusk"] .pn-note b { color: #ffb0a0; }
    html[data-sky="night"] .pn-ref,
    html[data-sky="dusk"] .pn-ref { color: rgba(207,224,228,.72); }
    html[data-sky="night"] .pn-badge,
    html[data-sky="dusk"] .pn-badge {
      color: #ffd0a1;
      background: rgba(255,255,255,.08);
      border-color: rgba(255,195,126,.45);
    }

    /* ---------- 鼓励卡：随机鼓励语 + 彩带 + 青蛙跳跃 ---------- */
    .cheer-card {
      position: relative;
      overflow: hidden;
      padding: 24px 26px;
      background:
        radial-gradient(130% 170% at 8% 0%, rgba(255, 238, 200, .9), rgba(255, 238, 200, 0) 58%),
        radial-gradient(120% 170% at 96% 6%, rgba(178, 244, 198, .85), rgba(178, 244, 198, 0) 62%),
        linear-gradient(135deg, #fffdf7 0%, #eefbf1 52%, #e3f7f8 100%);
      border: 1.5px solid rgba(255, 255, 255, .95);
      box-shadow: 0 18px 38px rgba(47, 110, 128, .16), inset 0 1px 0 rgba(255, 255, 255, .95);
    }
    .cheer-card::after {
      content: "";
      position: absolute; inset: 0;
      background: linear-gradient(105deg, transparent 32%, rgba(255, 255, 255, .5) 48%, transparent 64%);
      transform: translateX(-120%);
      animation: cheerShine 5.6s ease-in-out 1.4s infinite;
      pointer-events: none;
      z-index: 3;
    }
    @keyframes cheerShine {
      0% { transform: translateX(-120%); }
      42%, 100% { transform: translateX(120%); }
    }

    .cheer-glow {
      position: absolute; right: -46px; top: -70px;
      width: 230px; height: 230px; border-radius: 50%;
      background: radial-gradient(circle, rgba(255, 214, 130, .5), rgba(255, 214, 130, 0) 70%);
      pointer-events: none;
      z-index: 0;
    }
    .cheer-confetti {
      position: absolute; inset: 0;
      width: 100%; height: 100%;
      pointer-events: none;
      z-index: 1;
    }

    .cheer-inner {
      position: relative;
      z-index: 2;
      display: flex;
      align-items: center;
      gap: 20px;
    }

    .cheer-frog-wrap {
      position: relative;
      width: 104px; height: 96px;
      flex-shrink: 0;
      display: grid;
      place-items: end center;
    }
    .cheer-frog {
      width: 96px; height: 92px;
      transform-origin: 50% 92%;
      animation: frogHop 2.4s cubic-bezier(.42, 0, .52, 1) infinite;
      filter: drop-shadow(0 8px 12px rgba(47, 110, 128, .18));
      will-change: transform;
    }
    .cheer-frog svg { display: block; width: 100%; height: 100%; }
    @keyframes frogHop {
      0%, 100% { transform: translateY(0) rotate(0deg) scale(1, 1); }
      14% { transform: translateY(4px) rotate(-2deg) scale(1.08, .9); }
      36% { transform: translateY(-16px) rotate(-6deg) scale(.96, 1.06); }
      52% { transform: translateY(-19px) rotate(0deg) scale(1, 1); }
      72% { transform: translateY(2px) rotate(4deg) scale(1.06, .92); }
      86% { transform: translateY(0) rotate(0deg) scale(1, 1); }
    }
    .frog-shadow {
      position: absolute; bottom: 2px; left: 50%;
      width: 62px; height: 11px; margin-left: -31px;
      border-radius: 50%;
      background: radial-gradient(ellipse at center, rgba(47, 110, 128, .3), rgba(47, 110, 128, 0) 72%);
      animation: frogShadowPulse 2.4s cubic-bezier(.42, 0, .52, 1) infinite;
    }
    @keyframes frogShadowPulse {
      0%, 100% { transform: scale(1); opacity: .26; }
      46% { transform: scale(.66); opacity: .1; }
    }

    .frog-eye {
      transform-box: fill-box;
      transform-origin: center;
      animation: frogBlink 4.8s ease-in-out infinite;
    }
    @keyframes frogBlink {
      0%, 92%, 100% { transform: scaleY(1); }
      95% { transform: scaleY(.12); }
    }

    .cheer-copy { min-width: 0; flex: 1; }
    .cheer-kicker {
      display: inline-block;
      font-size: 12.5px; font-weight: 800; letter-spacing: 2px;
      color: #a9683a;
      background: rgba(255, 255, 255, .78);
      border: 1px solid rgba(247, 164, 85, .35);
      padding: 3px 10px; border-radius: 999px;
      margin-bottom: 6px;
    }
    .cheer-main {
      font-size: 30px;
      font-weight: 900;
      letter-spacing: 1.5px;
      line-height: 1.25;
      background: linear-gradient(100deg, #f07a3a, #ee5f86 55%, #2f9c93);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      color: #e2622f;
      animation: cheerPop .55s cubic-bezier(.2, 1.4, .4, 1) both;
    }
    .cheer-sub {
      margin-top: 4px;
      font-size: 14.5px;
      font-weight: 600;
      line-height: 1.6;
      color: var(--ink-soft);
    }
    @keyframes cheerPop {
      from { opacity: 0; transform: scale(.82) translateY(6px); }
      to   { opacity: 1; transform: none; }
    }

    .cheer-sparkles { position: relative; width: 62px; height: 84px; flex-shrink: 0; }
    .spark {
      position: absolute;
      font-size: 20px;
      color: #ffc861;
      text-shadow: 0 2px 6px rgba(255, 180, 80, .45);
      animation: sparkTwinkle 2.2s ease-in-out infinite;
    }
    .spark.s1 { top: 4px;  left: 18px; font-size: 24px; animation-delay: .1s; }
    .spark.s2 { top: 34px; left: 0;    font-size: 17px; animation-delay: .7s; color: #8fe0a6; }
    .spark.s3 { top: 52px; left: 36px; font-size: 14px; animation-delay: 1.2s; color: #7ec8e3; }
    @keyframes sparkTwinkle {
      0%, 100% { opacity: .35; transform: scale(.8) rotate(-8deg); }
      50%      { opacity: 1;   transform: scale(1.15) rotate(8deg); }
    }

    @media (max-width: 640px) {
      .cheer-card { padding: 16px 16px; }
      .cheer-inner { gap: 12px; }
      .cheer-frog-wrap { width: 78px; height: 76px; }
      .cheer-frog { width: 74px; height: 72px; }
      .frog-shadow { width: 50px; margin-left: -25px; }
      .cheer-main { font-size: 21px; letter-spacing: .5px; }
      .cheer-sub { font-size: 13px; }
      .cheer-kicker { font-size: 10.5px; letter-spacing: 1px; }
      .cheer-sparkles { display: none; }
    }

    @media (prefers-reduced-motion: reduce) {
      .cheer-frog, .frog-shadow, .spark, .frog-eye, .cheer-card::after, .cheer-main { animation: none !important; }
    }
  </style>

</head>
<body>
  <div class="bubbles"><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>

  <div class="wrap">

      <div class="cheer-inner">
        <div class="cheer-frog-wrap" aria-hidden="true">
          <div class="cheer-frog">
            <svg viewBox="0 0 100 92" role="img" aria-label="笑着跳跃的青蛙">
              <defs>
                <radialGradient id="frogBody" cx="38%" cy="26%" r="80%">
                  <stop offset="0%" stop-color="#a8eca1"/>
                  <stop offset="55%" stop-color="#5fc96f"/>
                  <stop offset="100%" stop-color="#36a356"/>
                </radialGradient>
                <linearGradient id="frogBelly" x1="0" y1="0" x2="0" y2="1">

              </defs>
              <g>

                <ellipse cx="80" cy="68" rx="12" ry="9" fill="#3fae5c" transform="rotate(18 80 68)"/>
                <ellipse cx="50" cy="56" rx="30" ry="25" fill="url(#frogBody)"/>
                <ellipse cx="50" cy="65" rx="20" ry="15" fill="url(#frogBelly)" opacity=".85"/>
                <ellipse cx="23" cy="63" rx="8" ry="5" fill="#4bb862" transform="rotate(22 23 63)"/>
                <ellipse cx="77" cy="63" rx="8" ry="5" fill="#4bb862" transform="rotate(-22 77 63)"/>
                <g class="frog-eye">
                  <circle cx="32" cy="30" r="14" fill="#7fd98a"/>

                  <circle cx="33" cy="30" r="6" fill="#1f3d36"/>
                  <circle cx="30.4" cy="27.4" r="2.2" fill="#ffffff"/>
                </g>
                <g class="frog-eye">
                  <circle cx="68" cy="30" r="14" fill="#7fd98a"/>
                  <circle cx="68" cy="29" r="10.5" fill="#ffffff"/>
                  <circle cx="67" cy="30" r="6" fill="#1f3d36"/>

                <circle cx="25" cy="51" r="5.4" fill="#ff9fae" opacity=".7"/>
                <circle cx="75" cy="51" r="5.4" fill="#ff9fae" opacity=".7"/>

    <div class="card hidden" id="actions-card">
      <div class="section-title">本局操作</div>
      <p id="actions-summary"></p>

    <div class="card curve-card">
      <div class="section-title"><span class="dot"></span><span id="curve-title">专注曲线</span></div>
      <canvas id="curve" width="880" height="230"></canvas>
      <p class="hint" style="font-size:13.5px;margin-top:10px">
        <span class="badge">浅绿色区域</span> 专注状态（蓄力/跳出）&nbsp;·&nbsp;
        <span class="badge">橙色虚线</span> 你的专注基线
      </p>
      <p class="hint" id="curve-tip" style="display:none;margin-top:6px;font-size:13px;color:#c26a1b"></p>
    </div>

    <div class="card">
      <div class="section-title"><span class="dot"></span>💬 给家长的话<span class="pn-badge">仅供参考</span></div>
      <p class="hint hidden" id="parent-source"></p>
      <div class="parent-note" id="parent-note">正在根据本局数据生成分析与建议……</div>
    </div>

    <div class="btn-row">
      <button id="btn-again" class="btn btn-primary">再来一局</button>
      <button id="btn-home" class="btn btn-ghost">🏠 回首页</button>

  <script src="assets/api.js"></script>
  <script>
    const $ = id => document.getElementById(id);
    const sid = new URLSearchParams(location.search).get("id");

    /* ---------------- 鼓励语：每次随机一句 ---------------- */
    const CHEER_LINES = [
      "真棒！",
      "再接再厉！",
      "专注的样子超帅气！",
      "青蛙给你鼓掌啦！",
      "这一跳，稳稳的！",
      "继续保持，你能行！",
      "小小的专注，大大的进步！",
      "荷叶都被你踩出节奏啦！",
      "今天的你，闪闪发光！",
      "稳住心态，越跳越远！",
      "专注小达人，非你莫属！",
      "再来一次，还会更棒！"
    ];
    const CHEER_SUBS = [
      "每一次专注，都算数。",
      "青蛙说：和你一起跳真开心！",
      "慢慢来，稳稳跳，就是最好的节奏。",
      "把这股劲儿留到下一局吧。",
      "你已经比刚才更棒了。",
      "记得休息一下，眼睛也要放松哦。"
    ];
    const pickOne = arr => arr[Math.floor(Math.random() * arr.length)];

    function renderCheer() {
      $("cheer-msg").textContent = pickOne(CHEER_LINES);
      $("cheer-sub").textContent = pickOne(CHEER_SUBS);
    }

    /* ---------------- 彩带庆祝 ---------------- */
    const CONFETTI_COLORS = [
      "#ffd166", "#ff8fa3", "#9fe3a3", "#58c270",
      "#7ec8e3", "#c3a6ff", "#ffb4a2", "#ff9f6e"
    ];
    const confettiCanvas = $("confetti");
    const confettiCtx = confettiCanvas.getContext("2d");
    let confettiPieces = [];
    let confettiRaf = null;
    let confettiLast = 0;
    let confettiW = 0, confettiH = 0;
    const confettiDpr = Math.min(window.devicePixelRatio || 1, 2);

    function sizeConfettiCanvas() {
      const rect = confettiCanvas.getBoundingClientRect();
      confettiW = Math.max(1, rect.width);
      confettiH = Math.max(1, rect.height);
      confettiCanvas.width = Math.round(confettiW * confettiDpr);
      confettiCanvas.height = Math.round(confettiH * confettiDpr);
      confettiCtx.setTransform(confettiDpr, 0, 0, confettiDpr, 0, 0);
    }

    function makePiece(x, y, vx, vy, gravity) {
      const roll = Math.random();
      const shape = roll < .55 ? "rect" : roll < .82 ? "ribbon" : "dot";
      return {
        x, y, vx, vy,
        gravity: gravity || 420,
        rot: Math.random() * Math.PI * 2,
        vr: (Math.random() - .5) * 9,
        w: shape === "dot" ? 6 + Math.random() * 4 : 7 + Math.random() * 7,
        h: shape === "dot" ? 0 : shape === "ribbon" ? 13 + Math.random() * 9 : 6 + Math.random() * 6,
        shape,
        color: CONFETTI_COLORS[Math.floor(Math.random() * CONFETTI_COLORS.length)],
        sway: 6 + Math.random() * 22,
        wobble: .8 + Math.random() * 2.2,
        phase: Math.random() * Math.PI * 2,
        life: 0
      };
    }

    /* 顶部飘落 */
    function rainConfetti(count) {
      for (let i = 0; i < count; i++) {
        confettiPieces.push(makePiece(
          Math.random() * confettiW,
          -14 - Math.random() * confettiH * .4,
          (Math.random() - .5) * 70,
          45 + Math.random() * 85,
          360
        ));
      }
      ensureConfettiLoop();
    }

    /* 两侧小礼炮 */
    function popConfetti() {
      [
        { x: 2, y: confettiH * .95, ang: -Math.PI / 2.6 },
        { x: confettiW - 2, y: confettiH * .95, ang: -Math.PI * 1.6 / 2.6 }
      ].forEach(spec => {
        for (let i = 0; i < 30; i++) {
          const ang = spec.ang + (Math.random() - .5) * .6;
          const speed = 280 + Math.random() * 220;
          confettiPieces.push(makePiece(
            spec.x, spec.y,
            Math.cos(ang) * speed,
            Math.sin(ang) * speed,
            760
          ));
        }
      });
      ensureConfettiLoop();
    }

    function confettiTick(t) {
      const dt = Math.min(Math.max((t - confettiLast) / 1000, .001), .05);
      confettiLast = t;
      const ctx = confettiCtx;
      ctx.clearRect(0, 0, confettiW, confettiH);

      for (let i = confettiPieces.length - 1; i >= 0; i--) {
        const p = confettiPieces[i];
        p.life += dt;
        p.vy += p.gravity * dt;
        p.vx *= Math.max(0, 1 - 1.1 * dt);
        p.x += p.vx * dt + Math.sin(p.phase + p.life * p.wobble) * p.sway * dt;
        p.y += p.vy * dt;
        p.rot += p.vr * dt;

        if (p.y > confettiH + 30 || p.x < -50 || p.x > confettiW + 50) {
          confettiPieces.splice(i, 1);
          continue;
        }

        ctx.save();
        ctx.translate(p.x, p.y);
        ctx.rotate(p.rot);
        ctx.globalAlpha = Math.max(0, 1 - p.life / 6.5);
        ctx.fillStyle = p.color;
        if (p.shape === "dot") {
          ctx.beginPath();
          ctx.arc(0, 0, p.w / 2, 0, Math.PI * 2);
          ctx.fill();
        } else {
          ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
        }
        ctx.restore();
      }

      if (confettiPieces.length) {
        confettiRaf = requestAnimationFrame(confettiTick);
      } else {
        confettiRaf = null;
        ctx.clearRect(0, 0, confettiW, confettiH);
      }
    }

    function ensureConfettiLoop() {
      if (confettiRaf == null) {
        confettiLast = performance.now();
        confettiRaf = requestAnimationFrame(confettiTick);
      }
    }

    const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

    function celebrate() {
      sizeConfettiCanvas();
      if (reduceMotion) return;
      popConfetti();
      rainConfetti(30);
      let extraWaves = 0;
      const waveTimer = setInterval(() => {
        if (!document.hidden) rainConfetti(9 + Math.floor(Math.random() * 6));
        if (++extraWaves >= 3) clearInterval(waveTimer);
      }, 4000);
      window.addEventListener("resize", sizeConfettiCanvas);
    }

    renderCheer();
    sizeConfettiCanvas();

    async function load() {
      try {
        const r = await API.get("/api/report/" + sid);
        render(r);
      } catch (e) {
        $("report").innerHTML = `<p class="hint">读取失败：${e.message}</p>`;
      }
    }

    function fmtPlayed(sec) {
      if (sec == null) return "—";
      const s = Math.max(0, Math.round(sec));
      if (s < 60) return s + "s";
      const m = Math.floor(s / 60);
      const r = s % 60;
      return r ? `${m}分${r}秒` : `${m}分钟`;
    }

    /* ---------------- 给家长的话：分析 + 建议 + 免责声明 ---------------- */
    function buildParentNote(r) {
      const pct = v => (v == null ? null : Math.round(v * 100));
      // 统一用后端 20–80 动态分（0–100）；旧报告没有 score 字段时退回原始 focus 百分比
      const mean = r.score_mean != null ? Math.round(r.score_mean) : pct(r.focus_mean);
      const max = r.score_max != null ? Math.round(r.score_max) : pct(r.focus_max);
      const min = r.score_min != null ? Math.round(r.score_min) : pct(r.focus_min);
      const above = r.above_mid_ratio != null ? pct(r.above_mid_ratio) : pct(r.above_baseline_ratio);
      const valid = r.n_frames ? Math.round(((r.n_valid_frames || 0) / r.n_frames) * 100) : null;
      const mins = Math.max(1, Math.round((r.played_sec || r.duration_sec || 0) / 60));
      const heartOnly = !!(r.source && r.source.name === "heart");
      const hr = r.heart || {};
      const hrMean = hr.mean != null ? Math.round(hr.mean) : null;
      const hrRest = hr.rest_bpm != null ? Math.round(hr.rest_bpm) : null;
      const hrDelta = (hrMean != null && hrRest != null) ? hrMean - hrRest : null;

      // ---- 从曲线里算本局“过程指标”，这些才是让建议有针对性依据 ----
      const curve = (r.curve || [])
        .map(p => {
          if (p.score != null) return p.score;
          const f = (p.focus_fused != null) ? p.focus_fused : p.focus;
          return f != null ? f * 100 : null;
        })
        .filter(v => v != null);
      const ts = (r.curve || []).filter(p => p.t != null).map(p => p.t);
      const dt = ts.length > 1 ? Math.abs(ts[ts.length - 1] - ts[0]) / (ts.length - 1) : 1.5;
      const avg = a => (a.length ? a.reduce((x, y) => x + y, 0) / a.length : null);
      const std = a => {
        if (a.length < 3) return null;
        const m = avg(a);
        return Math.sqrt(a.reduce((s, v) => s + (v - m) * (v - m), 0) / a.length);
      };
      const sd = std(curve);
      const half = Math.floor(curve.length / 2);
      const trend = curve.length >= 6 ? avg(curve.slice(half)) - avg(curve.slice(0, half)) : null;
      const base = 50;   // 动态定标下，50 分就是专注线；不再依赖原始 baseline 数值

      // 掉线最长时长 + 自己拉回基线的次数（恢复力比均值更能说明问题）
      let recoveries = 0, streak = 0, worst = 0;
      if (base != null) {
        for (const v of curve) {
          if (v < base) { streak += 1; if (streak > worst) worst = streak; }
          else { if (streak > 0) recoveries += 1; streak = 0; }
        }
      }
      const worstSec = Math.round(worst * dt);

      const hrVals = (r.hr_curve || []).map(p => p.bpm).filter(v => v != null);
      const hrSd = std(hrVals);

      // ---- 概览 chips：只放本局确实有数据的项 ----
      const chips = [];
      if (mean != null) chips.push(`<span class="pn-chip">专注均值 <b>${mean}%</b></span>`);
      if (max != null) chips.push(`<span class="pn-chip">最高 <b>${max}%</b></span>`);
      if (sd != null) chips.push(`<span class="pn-chip">波动 <b>±${Math.round(sd)}</b> 分</span>`);
      if (above != null) chips.push(`<span class="pn-chip">高于基线 <b>${above}%</b></span>`);
      if (base != null && curve.length >= 6) chips.push(`<span class="pn-chip">自己拉回 <b>${recoveries}</b> 次</span>`);
      if (hrMean != null) {
        const hrTag = (hrDelta != null && hrDelta !== 0) ? `（较静息${hrDelta > 0 ? "+" : ""}${hrDelta}）` : "";
        chips.push(`<span class="pn-chip">平均心率 <b>${hrMean}</b> BPM${hrTag}</span>`);
      }
      if (valid != null) chips.push(`<span class="pn-chip">有效数据 <b>${valid}%</b></span>`);
      chips.push(`<span class="pn-chip">本局 <b>${mins}</b> 分钟</span>`);

      // ---- 本局表现：按“水平 + 过程”两段说，而不是只报均值 ----
      let summary;
      if (mean == null) {
        summary = "本局没有采集到足够的有效数据，暂时无法解读表现，先检查设备佩戴与信号再开始下一局。";
      } else {
        if (mean >= 75) summary = `本局专注均值 <b>${mean}%</b>，整体处在较好的水平。`;
        else if (mean >= 60) summary = `本局专注均值 <b>${mean}%</b>，中等偏稳，属于常见的波动范围。`;
        else summary = `本局专注均值 <b>${mean}%</b>，低于平时水平，先别急着归因于“不专心”。`;

        if (above != null) {
          if (above >= 60) summary += ` 有 <b>${above}%</b> 的时间高于自己的基线。`;
          else if (above >= 30) summary += ` 高于基线的时间占 <b>${above}%</b>，状态时好时稳。`;
          else summary += ` 只有 <b>${above}%</b> 的时间高于基线。`;
        }
        if (trend != null && Math.abs(trend) >= 8) {
          summary += trend > 0
            ? ` 后半段比前半段高 <b>${Math.round(trend)}</b> 分，是越玩越进入状态。`
            : ` 后半段比前半段低 <b>${Math.round(-trend)}</b> 分，更像是中途累了。`;
        }
        if (base != null && curve.length >= 6) {
          if (recoveries >= 3) summary += ` 中途 <b>${recoveries}</b> 次掉下去又自己拉回来，这个过程值得肯定。`;
          else if (recoveries === 0 && worstSec >= 15) summary += ` 有一段连续 <b>${worstSec}</b> 秒没回到基线。`;
        }
        if (hrDelta != null && Math.abs(hrDelta) >= 8) {
          summary += ` 平均心率比静息${hrDelta > 0 ? "高" : "低"} <b>${Math.abs(hrDelta)}</b> BPM，身体状态也影响了这局。`;
        }
        if (valid != null && valid < 70) summary += ` 注意本局有效数据只有 <b>${valid}%</b>，结论要保守看。`;
      }

      // ---- 训练建议：按优先级取最能解释本局的那几条 ----
      const tips = [];
      const add = t => { if (tips.length < 4) tips.push(t); };

      // 数据质量不合格时，其他建议都不可靠，先修数据
      if (valid != null && valid < 70) {
        add(`<b>先把数据质量补上</b>：本局有效帧只有 ${valid}%，先确认头环贴合、电极湿润、周围没有大功率电器，再练一次对比。`);
      }

      // 纯心率玩法：核心是呼吸节奏，不是“用力专注”
      if (heartOnly) {
        if (hrDelta != null && hrDelta >= 5) {
          add(`<b>开局先落地</b>：本局平均心率比静息高 ${hrDelta} BPM，说明前段还在“启动”状态。下次坐下先做 6 轮慢呼吸（吸气 4 秒、呼气 6 秒）再点开始。`);
        } else {
          add(`<b>练呼气</b>：纯心率模式靠的是副交感神经。把呼气拉长到吸气的 1.5 倍（吸 4 秒、呼 6 秒），做 6 轮再看分数，比“努力集中”有效。`);
        }
      }

      // 稳定性
      if (sd != null) {
        if (sd >= 18) {
          add(`<b>先求稳再求高</b>：本局波动 ±${Math.round(sd)} 分，偏大。把单局缩到 ${Math.max(3, mins - 2)} 分钟，中间安排 1 次 30 秒深呼吸复位。`);
        } else if (sd <= 12 && mean != null && mean >= 60) {
          add(`<b>可以加难度</b>：本局波动只有 ±${Math.round(sd)} 分，很稳。下次把单局延长 1–2 分钟，或把目标基线提高 5 分。`);
        }
      }

      // 趋势：下滑是疲劳信号，上升是热身不足
      if (trend != null && trend <= -8) {
        add(`<b>缩短单局</b>：后半段掉了 ${Math.round(-trend)} 分，更像疲劳而不是不会做。下次把时长控制在 ${Math.max(3, mins - 2)} 分钟，练完先休息再写作业。`);
      } else if (trend != null && trend >= 8) {
        add(`<b>固定热身</b>：后半段比前半段高 ${Math.round(trend)} 分，说明需要时间进入状态。开局前做 30 秒慢呼吸，能少浪费前几分钟。`);
      }

      // 掉线时长：指出具体的高发时段
      if (base != null && worstSec >= 20 && recoveries <= 2) {
        add(`<b>盯住那次掉线</b>：本局最长连续 ${worstSec} 秒低于基线。和孩子一起回想那段时间在做什么（说话、看旁边、揉眼睛），下次提前避免。`);
      }

      // 恢复力
      if (base != null && curve.length >= 6) {
        if (recoveries >= 4) {
          add(`<b>表扬恢复过程</b>：本局 ${recoveries} 次从基线以下拉回来。夸具体行为——“你刚才自己调整回来了”，比夸“真聪明”更能强化这种能力。`);
        } else if (recoveries === 0 && above != null && above < 50) {
          add(`<b>把目标降到能做到</b>：整局没能回到基线以上。下一局只要求“连续 30 秒高于基线”，先建立成功体验，再逐步加码。`);
        }
      }

      // 心率反映的身体状态
      if (hrDelta != null && hrDelta >= 8 && !heartOnly) {
        add(`<b>先静一静再开始</b>：平均心率比静息高 ${hrDelta} BPM，可能是刚跑跳完或有点紧张。下次开局前静坐 1 分钟、做 4 次慢呼吸。`);
      } else if (hrDelta != null && hrDelta <= 0 && above != null && above < 50) {
        add(`<b>换个时段练</b>：心率几乎没高于静息，可能偏困倦。把训练放到精神较好的时段，或开局前走动 1 分钟再坐下。`);
      } else if (hrSd != null && hrSd >= 6) {
        add(`<b>固定训练时段</b>：本局心率波动 ${Math.round(hrSd)} BPM，身体状态不太稳定。固定在同一时段练，数据才有可比性。`);
      }

      // 时长
      if (mins <= 2) {
        add(`<b>样本太短</b>：本局只有 ${mins} 分钟，数据不足以看出趋势。建议 5 分钟起步，前 1 分钟当作热身不计入评价。`);
      } else if (mins >= 10) {
        add(`<b>中途起身</b>：本局 ${mins} 分钟偏长。每 5 分钟起身活动 30 秒，避免后段靠硬撑，也能保护视力。`);
      }

      // 兜底：数据正常但没有触发任何规则时，给一条与数据绑定的通用建议
      if (tips.length < 3 && above != null) {
        add(above >= 60
          ? `<b>保持节奏</b>：本局有 ${above}% 的时间高于基线，每次 5–10 分钟、每周 3–5 次即可，不需要一次练很久。`
          : `<b>从短局开始</b>：本局高于基线 ${above}% 的时间。把目标定为“单局 3 分钟、高于基线一半时间”，做到再延长。`);
      }

      // 合规项固定保留，不占上面 4 条的名额
      const helpline = "<b>需要时求助</b>：如果注意力困难持续 6 个月以上，并在家庭、学校等多个场景影响学习或社交，建议到儿保科或儿童心理科做专业评估。";

      return `
        <div class="pn-block">
          <div class="pn-title"><span class="emo">🔍</span>本局表现</div>
          <div class="pn-chips">${chips.join("")}</div>
          <p class="pn-text">${summary}</p>
        </div>
        <div class="pn-block">
          <div class="pn-title"><span class="emo">🌱</span>针对性建议</div>
          <ul class="pn-list">
            ${tips.map(t => `<li>${t}</li>`).join("")}
            <li>${helpline}</li>
          </ul>
        </div>
        <div class="pn-note">
          <b>仅供参考：</b>以上内容由本局游戏数据自动生成，仅供家长了解训练情况，不构成医学诊断、心理评估或治疗建议。脑波分数会受设备佩戴、疲劳、环境等因素影响，不能代表孩子的注意力水平。
          <span class="pn-ref">参考依据：WHO 5–17 岁身体活动建议、AASM 儿童睡眠建议、AAP 屏幕使用建议、DSM-5 注意缺陷多动障碍诊断要点。</span>
        </div>
      `;
    }

    let currentReport;
    function render(r) {
      currentReport = r;
      const above = r.above_mid_ratio != null ? Math.round(r.above_mid_ratio * 100)
        : (r.above_baseline_ratio != null ? Math.round(r.above_baseline_ratio * 100) : null);
      const hr = r.heart || {};
      const hrCard = (hr.n > 0)
        ? `<div class="stat"><div class="icon">❤️</div><div class="label">平均心率（AirPods 辅助）</div><div class="value">${Math.round(hr.mean)}<span style="font-size:13px;font-weight:700"> BPM</span></div></div>`
        : "";
      const source = r.source || {};
      const isReplay = source.name === "replay" || !!source.file;
      const isManual = source.name === "manual";
      const recorded = source.name === "hardware" || source.name === "heart";
      const srcName = r.demo ? "无设备试玩 · 手动模拟" : describeSignal(source);
      $("actions-card").classList.toggle("hidden", !r.actions);
      if (r.actions) {
        const { timed_jumps, automatic_jumps, targets_shown, targets_hit } = r.actions;
        $("actions-summary").textContent = `抓住起跳时机 ${timed_jumps} 次 · 蓄满自动跳 ${automatic_jumps} 次`;
        if (targets_shown != null && targets_hit != null) {
          $("actions-summary").textContent += ` · 点中目标 ${targets_hit}/${targets_shown}`;
        }
      }
      $("curve-title").textContent = isReplay ? "脑电回放曲线"
        : isManual ? "滑块模拟曲线" : "专注曲线";
      $("report").innerHTML = `
        <div class="stat-grid" style="justify-content:center">
          <div class="stat"><div class="icon">🐸</div><div class="label">游戏成绩（跳荷叶）</div><div class="value">${r.score ?? "—"}</div></div>
          <div class="stat"><div class="icon">⏱️</div><div class="label">高于专注线时间占比</div><div class="value">${above ?? "—"}%</div></div>
          <div class="stat"><div class="icon">📈</div><div class="label">${recorded ? "专注分均值" : "演示信号分均值"}</div><div class="value">${r.score_mean != null ? Math.round(r.score_mean) : (r.focus_mean != null ? Math.round(r.focus_mean * 100) : "—")}</div></div>
          <div class="stat"><div class="icon">🎯</div><div class="label">定标方式</div><div class="value">20 – 80</div></div>
          <div class="stat"><div class="icon">⌛</div><div class="label">用时</div><div class="value">${fmtPlayed(r.played_sec)}</div></div>
          <div class="stat"><div class="icon">✅</div><div class="label">有效数据占比</div><div class="value">${(r.n_valid_frames != null && r.n_frames) ? Math.round(r.n_valid_frames / r.n_frames * 100) + "%" : "—"}</div></div>
          ${hrCard}
        </div>
        <p class="hint" style="margin-top:12px;font-size:13.5px">
          <span id="report-source"></span>
        </p>
      `;
      $("report-source").textContent = "信号来源 · " + srcName;
      const scoreCurve = (r.curve || []).map(p => {
        const v = (p.score != null) ? p.score
          : ((p.focus_fused != null ? p.focus_fused : p.focus) != null
            ? (p.focus_fused != null ? p.focus_fused : p.focus) * 100 : null);
        return { t: p.t, focus: v == null ? null : v / 100 };
      }).filter(p => p.focus != null);
      drawCurve(scoreCurve, 0.5, r.hr_curve || []);
      const tip = $("curve-tip");
      if (tip) {
        if (!scoreCurve.length) {
          tip.textContent = "本局没有有效数据点，画不出曲线。先检查设备佩戴与信号，再开一局。";
          tip.style.display = "block";
        } else {
          tip.style.display = "none";
        }
      }
      const parentSource = $("parent-source");
      parentSource.classList.toggle("hidden", recorded);
      parentSource.textContent = recorded ? "" : "以下分析基于本局" + srcName + "数据。";
      $("parent-note").innerHTML = buildParentNote(r);
      $("sub").textContent = r.created_at ? r.created_at.replace("T", " ") : "";
      celebrate();
    }

    // 图表配色随天空模式切换：暗色下用浅色网格与更亮的曲线
    function chartTheme() {
      const sky = document.documentElement.getAttribute("data-sky");
      const dark = sky === "night" || sky === "dusk";
      return dark ? {
        grid: "rgba(255,255,255,.10)",
        label: "rgba(214,232,242,.92)",
        curve: "#6fd3c8",
        areaTop: "rgba(111,211,200,.28)",
        areaBot: "rgba(111,211,200,.02)",
        zone: "rgba(159,227,163,.16)",
        baseline: "#ffb257",
        halo: "rgba(9,26,36,.85)",
        tagText: "#ffb257",
      } : {
        grid: "rgba(58,108,122,.10)",
        label: "rgba(92,123,131,.9)",
        curve: "#2f9c93",
        areaTop: "rgba(58,167,160,.30)",
        areaBot: "rgba(58,167,160,.02)",
        zone: "rgba(159,227,163,.28)",
        baseline: "#ef8c1f",
        halo: "rgba(255,255,255,.92)",
        tagText: "#d9761a",
      };
    }

    let lastCurve = [], lastBaseline = null, lastHr = [];

    function drawCurve(curve, baseline, hrCurve) {
      lastCurve = curve || [];
      lastBaseline = baseline;
      lastHr = hrCurve || [];
      const hr = lastHr;
      const theme = chartTheme();
      const c = $("curve");
      const ctx = c.getContext("2d");
      const W = c.width, H = c.height, padL = 58, padR = 20, padT = 26, padB = 34;
      ctx.clearRect(0, 0, W, H);
      if (!curve.length) return;
      const xs = curve.map(p => p.t).concat(hr.map(p => p.t));
      const xmax = Math.max(Math.max(...xs), 10);
      const X = t => padL + (W - padL - padR) * (t / xmax);
      const Y = v => padT + (H - padT - padB) * (1 - Math.min(Math.max(v, 0), 1));

      // 网格 + 纵轴刻度
      ctx.font = "12px 'PingFang SC', sans-serif";
      for (let gy = 0; gy <= 4; gy++) {
        const y = Y(gy / 4);
        ctx.strokeStyle = theme.grid;
        ctx.lineWidth = 1;
        ctx.beginPath(); ctx.moveTo(padL, y); ctx.lineTo(W - padR, y); ctx.stroke();
        ctx.fillStyle = theme.label;
        ctx.textAlign = "right";
        ctx.fillText(Math.round(gy / 4 * 100) + "%", padL - 10, y + 4);
      }

      // 专注状态（focus >= 基线）的浅绿区间：先把连续段合并，再一次性填充。
      // 旧写法在每个采样点都从段首重绘一遍矩形，半透明色层层叠加会被叠成实色块，
      // 也会把基线虚线压得看不见。
      if (baseline != null) {
        const by = Y(baseline);
        const runs = [];
        let run = null;
        curve.forEach((p, i) => {
          if (p.focus >= baseline) {
            if (!run) { run = [i, i]; runs.push(run); }
            run[1] = i;
          } else run = null;
        });
        ctx.fillStyle = theme.zone;
        runs.forEach(([a, b]) => {
          if (b <= a) return;
          const x0 = X(curve[a].t), x1 = X(curve[b].t);
          ctx.fillRect(x0, by, x1 - x0, H - padB - by);
        });
      }

      // 面积渐变
      const g = ctx.createLinearGradient(0, padT, 0, H - padB);
      g.addColorStop(0, theme.areaTop);
      g.addColorStop(1, theme.areaBot);
      ctx.beginPath();
      curve.forEach((p, i) => {
        const x = X(p.t), y = Y(p.focus);
        i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
      });
      ctx.lineTo(X(curve[curve.length - 1].t), H - padB);
      ctx.lineTo(X(curve[0].t), H - padB);
      ctx.closePath();
      ctx.fillStyle = g;
      ctx.fill();

      // 曲线
      ctx.beginPath();
      curve.forEach((p, i) => {
        const x = X(p.t), y = Y(p.focus);
        i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
      });
      ctx.strokeStyle = theme.curve;
      ctx.lineWidth = 3;
      ctx.lineJoin = "round";
      ctx.stroke();
      // 起点圆点
      ctx.fillStyle = theme.curve;
      ctx.beginPath();
      ctx.arc(X(curve[0].t), Y(curve[0].focus), 5, 0, Math.PI * 2);
      ctx.fill();

      // 心率辅助曲线：独立量纲（40–140 BPM），用红色虚线叠加，只表达趋势。
      // 心率 3–5 秒才一个点，点数太少（<2）时不画，避免一条孤立线段造成误读。
      if (hr.length >= 2) {
        const Yhr = bpm => padT + (H - padT - padB) * (1 - Math.min(Math.max((bpm - 40) / 100, 0), 1));
        ctx.save();
        ctx.beginPath();
        hr.forEach((p, i) => {
          const x = X(p.t), y = Yhr(p.bpm);
          i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
        });
        ctx.strokeStyle = "rgba(226,85,78,.88)";
        ctx.lineWidth = 2;
        ctx.setLineDash([6, 4]);
        ctx.stroke();
        ctx.restore();

        // 顶部图例：显示本局心率区间，替代拥挤的右轴
        const lo = Math.round(Math.min(...hr.map(p => p.bpm)));
        const hi = Math.round(Math.max(...hr.map(p => p.bpm)));
        ctx.font = "700 12px 'PingFang SC', sans-serif";
        ctx.textAlign = "left";
        ctx.fillStyle = "rgba(226,85,78,.95)";
        ctx.fillText(`❤ 心率 ${lo}–${hi} BPM（右图红线，仅趋势）`, padL + 6, padT - 8);
      }

      // 基线虚线：放到最后绘制，并用背景色描边打底，
      // 否则会被面积渐变和曲线盖住，看起来像"没有橙色虚线"。
      if (baseline != null) {
        const by = Y(baseline);
        ctx.save();
        ctx.setLineDash([]);
        ctx.strokeStyle = theme.halo;
        ctx.lineWidth = 6;
        ctx.beginPath(); ctx.moveTo(padL, by); ctx.lineTo(W - padR, by); ctx.stroke();
        ctx.setLineDash([8, 6]);
        ctx.strokeStyle = theme.baseline;
        ctx.lineWidth = 2.6;
        ctx.beginPath(); ctx.moveTo(padL, by); ctx.lineTo(W - padR, by); ctx.stroke();
        ctx.restore();

        const label = "基线 " + Math.round(baseline * 100) + "%";
        ctx.font = "700 13px 'PingFang SC', sans-serif";
        const lx = W - padR - ctx.measureText(label).width - 10;
        let ly = by - 10;
        if (ly < padT + 14) ly = by + 18;
        ctx.lineWidth = 4;
        ctx.lineJoin = "round";
        ctx.strokeStyle = theme.halo;
        ctx.textAlign = "left";
        ctx.strokeText(label, lx, ly);
        ctx.fillStyle = theme.tagText;
        ctx.fillText(label, lx, ly);
      }

      // 横轴
      ctx.fillStyle = theme.label;
      ctx.textAlign = "center";
      ctx.font = "12px 'PingFang SC', sans-serif";
      ctx.fillText("0s", padL, H - 12);
      ctx.textAlign = "right";
      ctx.fillText(Math.round(xmax) + "s", W - padR, H - 12);
    }

    document.addEventListener("skychange", () => {
      if (lastCurve.length) drawCurve(lastCurve, lastBaseline, lastHr);
    });

    $("btn-again").addEventListener("click", () => { location.href = currentReport?.demo ? "game.html?demo=1&sec=60" : "index.html?pick=1"; });
    $("btn-home").addEventListener("click", () => { location.href = "index.html"; });
    load();
  </script>
  <script src="assets/music.js" defer></script>
</body>
</html>
